name: MAP-020 clean duplicate import

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  clean:
    if: github.event.pull_request.number == 68 && github.head_ref == 'agent/map-020-character-location-relations'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Remove duplicated type import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/admin-character-location-relations.spec.ts')
          text = path.read_text()
          duplicate = "import type { Request as PlaywrightRequest } from '@playwright/test';\nimport type { Request as PlaywrightRequest } from '@playwright/test';\n"
          text = text.replace(duplicate, "import type { Request as PlaywrightRequest } from '@playwright/test';\n")
          path.write_text(text)
          PY
          npx prettier --write tests/e2e/admin-character-location-relations.spec.ts
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/admin-character-location-relations.spec.ts
          git commit -m "MAP-020 fix Playwright request type import"
          git push origin HEAD:${{ github.head_ref }}
