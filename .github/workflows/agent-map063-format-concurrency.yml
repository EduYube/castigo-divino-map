name: MAP-063 temporary concurrency formatter

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format concurrency regression
        run: npx prettier --write scripts/test-map063-public-note-concurrency.mjs package.json
      - name: Verify formatting
        run: npx prettier --check scripts/test-map063-public-note-concurrency.mjs package.json
      - name: Commit formatted files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+EduYube@users.noreply.github.com"
          git add scripts/test-map063-public-note-concurrency.mjs package.json
          git rm .github/workflows/agent-map063-format-concurrency.yml
          git commit -m "style: format MAP-063 concurrency regression"
          git push origin HEAD:agent/map-063-public-player-notes
