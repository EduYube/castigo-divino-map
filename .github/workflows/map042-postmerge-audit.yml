name: MAP-042 temporary post-merge audit

on:
  push:
    branches:
      - agent/map-042-geographic-navigation-pin-visibility

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: write
  statuses: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: 0bac076f04053a6ca81abb2fe015f01edadbcceb
      REPOSITORY: EduYube/castigo-divino-map
    steps:
      - name: Wait for exact master CI and Pages deployment
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const repo = process.env.REPOSITORY;
          const sha = process.env.MERGE_SHA;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const api = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) throw new Error(`${response.status} ${path}: ${await response.text()}`);
            return response.json();
          };
          const waitForRun = async ({ name, event }) => {
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const data = await api(`/repos/${repo}/actions/runs?branch=master&event=${event}&per_page=100`);
              const run = data.workflow_runs.find((candidate) => candidate.head_sha === sha && candidate.name === name);
              if (run?.status === 'completed') return run;
              await sleep(30_000);
            }
            throw new Error(`Timed out waiting for ${name} (${event}) at ${sha}`);
          };

          const report = { merge_sha: sha, ok: false };
          try {
            const ci = await waitForRun({ name: 'CI', event: 'push' });
            report.master_ci = {
              id: ci.id,
              run_number: ci.run_number,
              status: ci.status,
              conclusion: ci.conclusion,
              html_url: ci.html_url,
              head_sha: ci.head_sha,
            };
            if (ci.conclusion !== 'success') throw new Error(`master CI concluded ${ci.conclusion}`);

            const pages = await waitForRun({
              name: 'Deploy public atlas to GitHub Pages',
              event: 'workflow_run',
            });
            report.pages = {
              id: pages.id,
              run_number: pages.run_number,
              status: pages.status,
              conclusion: pages.conclusion,
              html_url: pages.html_url,
              head_sha: pages.head_sha,
            };

            const jobs = await api(`/repos/${repo}/actions/runs/${pages.id}/jobs?per_page=100`);
            report.pages_jobs = jobs.jobs.map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              html_url: job.html_url,
              steps: (job.steps ?? []).map((step) => ({
                name: step.name,
                status: step.status,
                conclusion: step.conclusion,
              })),
            }));
            if (pages.conclusion !== 'success') throw new Error(`Pages workflow concluded ${pages.conclusion}`);

            const combined = await api(`/repos/${repo}/commits/${sha}/status`);
            const deploymentStatus = combined.statuses.find(
              (status) => status.context === 'github-pages/deployment',
            );
            report.github_pages_deployment = deploymentStatus
              ? {
                  state: deploymentStatus.state,
                  description: deploymentStatus.description,
                  target_url: deploymentStatus.target_url,
                }
              : null;
            if (deploymentStatus?.state !== 'success') {
              throw new Error('github-pages/deployment status is not success');
            }

            const match = /https?:\/\/\S+/.exec(deploymentStatus.description ?? '');
            report.public_url = match?.[0] ?? null;
            report.ok = true;
          } catch (error) {
            report.error = error instanceof Error ? error.message : String(error);
          }

          fs.writeFileSync('map042-postmerge-audit.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Publish audit report to merged PR
        if: always()
        shell: bash
        run: |
          {
            echo 'MAP-042 temporary post-merge audit for `0bac076f04053a6ca81abb2fe015f01edadbcceb`.'
            echo
            echo '```json'
            cat map042-postmerge-audit.json
            echo '```'
          } > /tmp/map042-postmerge-comment.md
          gh pr comment 116 --repo "${REPOSITORY}" --body-file /tmp/map042-postmerge-comment.md

      - name: Enforce successful audit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('map042-postmerge-audit.json', 'utf8'));
          if (!report.ok) process.exit(1);
          NODE
