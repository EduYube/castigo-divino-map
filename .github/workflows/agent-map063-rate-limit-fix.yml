name: MAP-063 temporary rate-limit fix

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Apply SQLSTATE correction
        run: node scripts/agent-map063-rate-limit-fix.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260901150000_add_public_player_note_authorship.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix(db): return HTTP 429 for public note rate limit"
          git push origin HEAD:agent/map-063-public-player-notes
