name: MAP-052 E2E fixture helper

on:
  push:
    branches:
      - agent/map-052-snapshot-sync
    paths:
      - .github/workflows/map-052-e2e-fixture.yml

permissions:
  contents: write

jobs:
  fixture:
    name: Preserve deterministic pre-archive E2E snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-052-snapshot-sync
          fetch-depth: 0

      - name: Copy the last pre-archive public snapshot into E2E fixtures
        run: |
          mkdir -p tests/e2e/fixtures
          git show a5f87aca37f2dc2cba48ee4256ecd69472d59c13:public/data/public-catalog.snapshot.json > tests/e2e/fixtures/public-catalog.demo.snapshot.json
          npx prettier --write tests/e2e/fixtures/public-catalog.demo.snapshot.json

      - name: Commit deterministic E2E fixture
        run: |
          if [ -z "$(git status --porcelain -- tests/e2e/fixtures/public-catalog.demo.snapshot.json)" ]; then
            echo "E2E fixture already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/fixtures/public-catalog.demo.snapshot.json
          git commit -m "test: preserve deterministic public catalog fixture"
          git push origin HEAD:agent/map-052-snapshot-sync
