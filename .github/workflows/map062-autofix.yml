name: MAP-062 one-shot autofix

on:
  push:
    branches:
      - agent/map-062-desktop-details-below-map

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-062-desktop-details-below-map
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove obsolete details-open invalidation and format touched TypeScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          source = path.read_text()
          needle = "\n      mapController.map.invalidateSize({ animate: false, pan: false });\n\n      window.requestAnimationFrame(() => {"
          replacement = "\n      window.requestAnimationFrame(() => {"
          if source.count(needle) != 1:
              raise SystemExit(f'Expected exactly one obsolete invalidateSize block, found {source.count(needle)}')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          npx prettier --write src/app/compactPinDetails.ts tests/e2e/map062-desktop-details-below-map.spec.ts
          rm .github/workflows/map062-autofix.yml

      - name: Commit one-shot fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/app/compactPinDetails.ts tests/e2e/map062-desktop-details-below-map.spec.ts .github/workflows/map062-autofix.yml
          git commit -m "fix(map): finalize MAP-062 layout synchronization"
          git push origin HEAD:agent/map-062-desktop-details-below-map
