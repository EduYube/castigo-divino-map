name: MAP-060 contract repair

on:
  push:
    branches:
      - agent/map-060-persistent-location-geometry

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/map-060-persistent-location-geometry
          fetch-depth: 0
      - name: Align MAP-060 test contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch_map060_ci.py <<'PY'
          from pathlib import Path
          import re


          def replace_exact(path: Path, old: str, new: str, count: int = 1) -> None:
              text = path.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, found {actual}')
              path.write_text(text.replace(old, new))

          # Editor/save RPC contract bumped by MAP-060 campaign scoping.
          for name in [
              'admin-map-entities.spec.ts',
              'admin-pin-visual-system.spec.ts',
              'admin-public-requests.spec.ts',
              'map046-request-publication.spec.ts',
              'map056-public-request-campaign-flow.spec.ts',
              'master-mode-startup-revocation.spec.ts',
          ]:
              path = Path('tests/e2e') / name
              if 'admin_get_map_entity_editor_v5' in path.read_text():
                  replace_exact(path, 'admin_get_map_entity_editor_v5', 'admin_get_map_entity_editor_v6')

          for name in [
              'admin-map-entities.spec.ts',
              'map046-request-publication.spec.ts',
              'map056-public-request-campaign-flow.spec.ts',
              'master-mode-startup-revocation.spec.ts',
          ]:
              path = Path('tests/e2e') / name
              if 'admin_save_map_entity_v5' in path.read_text():
                  replace_exact(path, 'admin_save_map_entity_v5', 'admin_save_map_entity_v6')

          geometry_decl = """      const geometry = body.p_geometry as {\n        coordinates?: { x?: unknown; y?: unknown };\n      };\n"""
          save_geometry_files = {
              'admin-map-entities.spec.ts': 'request',
              'map046-request-publication.spec.ts': 'requestInfo',
              'map056-public-request-campaign-flow.spec.ts': 'requestInfo',
          }
          for name, request_var in save_geometry_files.items():
              path = Path('tests/e2e') / name
              text = path.read_text()
              body_line = f"      const body = {request_var}.postDataJSON() as Record<string, unknown>;\n"
              if name == 'admin-map-entities.spec.ts':
                  marker = body_line
              else:
                  marker = "    if (url.pathname.endsWith('/rpc/admin_save_map_entity_v6')) {\n" + body_line
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one admin-save handler marker, found {text.count(marker)}')
              text = text.replace(marker, marker + geometry_decl, 1)
              if name == 'admin-map-entities.spec.ts':
                  old_xy = "        x: Number(body.p_x),\n        y: Number(body.p_y),"
                  new_xy = "        x: Number(geometry.coordinates?.x),\n        y: Number(geometry.coordinates?.y),"
              else:
                  old_xy = "      entity.x = Number(body.p_x);\n      entity.y = Number(body.p_y);"
                  new_xy = "      entity.x = Number(geometry.coordinates?.x);\n      entity.y = Number(geometry.coordinates?.y);"
              if text.count(old_xy) != 1:
                  raise SystemExit(f'{path}: expected one legacy p_x/p_y save assignment, found {text.count(old_xy)}')
              path.write_text(text.replace(old_xy, new_xy, 1))

          # Master catalog v5 requires explicit canonical geometry.
          for name in ['campaign-master-mode-stale-response.spec.ts', 'map059-master-isolation.spec.ts']:
              path = Path('tests/e2e') / name
              text = path.read_text()
              occurrences = text.count('admin_get_master_catalog_v4')
              expected = 2 if name == 'campaign-master-mode-stale-response.spec.ts' else 1
              if occurrences != expected:
                  raise SystemExit(f'{path}: expected {expected} v4 master references, found {occurrences}')
              text = text.replace('admin_get_master_catalog_v4', 'admin_get_master_catalog_v5')
              if name == 'campaign-master-mode-stale-response.spec.ts':
                  old = "        x: isB ? 2150 : 1150,\n        y: isB ? 1250 : 850,"
                  new = """        geometry: {\n          kind: 'point',\n          coordinates: { x: isB ? 2150 : 1150, y: isB ? 1250 : 850 },\n        },\n        x: isB ? 2150 : 1150,\n        y: isB ? 1250 : 850,"""
              else:
                  old = "        x: isB ? 2320 : 1020,\n        y: isB ? 1300 : 800,"
                  new = """        geometry: {\n          kind: 'point',\n          coordinates: { x: isB ? 2320 : 1020, y: isB ? 1300 : 800 },\n        },\n        x: isB ? 2320 : 1020,\n        y: isB ? 1300 : 800,"""
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one master x/y block, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY
          python /tmp/patch_map060_ci.py
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''
          data = gzip.decompress(base64.b64decode(encoded))
          expected = 'd91bb6387c495a707c15d8a9a00205c8e026d135c029e30100bf251acdc95389'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('MAP-060 pgTAP payload checksum mismatch')
          Path('supabase/tests/database/032_map_entity_geometry.test.sql').write_bytes(data)
          PY
          git diff --check
          ! grep -R "admin_get_map_entity_editor_v5" -- tests/e2e/admin-map-entities.spec.ts tests/e2e/admin-pin-visual-system.spec.ts tests/e2e/admin-public-requests.spec.ts tests/e2e/map046-request-publication.spec.ts tests/e2e/map056-public-request-campaign-flow.spec.ts tests/e2e/master-mode-startup-revocation.spec.ts
          ! grep -R "admin_save_map_entity_v5" -- tests/e2e/admin-map-entities.spec.ts tests/e2e/map046-request-publication.spec.ts tests/e2e/map056-public-request-campaign-flow.spec.ts tests/e2e/master-mode-startup-revocation.spec.ts
          ! grep -R "admin_get_master_catalog_v4" -- tests/e2e/campaign-master-mode-stale-response.spec.ts tests/e2e/map059-master-isolation.spec.ts
          git rm .github/workflows/map060-contract-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align MAP-060 CI contracts'
          git push origin HEAD:agent/map-060-persistent-location-geometry
