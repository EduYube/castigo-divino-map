name: MAP-051 TypeScript fix

on:
  push:
    branches:
      - agent/map-051-expanded-map-layout

permissions:
  contents: write

jobs:
  fix:
    name: Apply MAP-051 TypeScript fix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-051-expanded-map-layout

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply tuple defaults and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/map051-expanded-map.spec.ts')
          text = path.read_text()
          old = "  const [lat, lng] = centerText.split(',').map(Number);"
          new = "  const [lat = 0, lng = 0] = centerText.split(',').map(Number);"
          if old not in text:
              raise SystemExit('expected MAP-051 tuple line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write tests/e2e/map051-expanded-map.spec.ts

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/map051-expanded-map.spec.ts
          git commit -m "MAP-051: satisfy strict tuple typing"
          git push origin HEAD:agent/map-051-expanded-map-layout
