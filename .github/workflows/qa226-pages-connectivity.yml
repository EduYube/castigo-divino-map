name: QA-226 Pages connectivity without deployment

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/app/publicDataRuntime.ts'
      - 'src/app/backendStatus.ts'
      - 'tests/deployment/**'
      - 'tests/e2e/backend-status.spec.ts'
      - '.github/workflows/qa226-pages-connectivity.yml'

permissions:
  contents: read

jobs:
  published-no-retries:
    name: Published MAP-032 (20x, retries=0, no deploy)
    if: github.head_ref == 'agent/qa-226-pages-connectivity-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test candidate (not the published artifact)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled V4 snapshot (read-only)
        run: npm run snapshot:verify

      - name: Verify remote snapshot against Supabase (read-only)
        id: remote_verify
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ehpouvbzmvwbkkoypgfa.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0' }}
        run: npm run snapshot:verify:remote

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check already published MAP-032 20 times without retries
        id: published_map032
        continue-on-error: true
        env:
          PAGES_URL: https://eduyube.github.io/castigo-divino-map/
          QA226_DIAGNOSTICS: '1'
        run: |
          set -euo pipefail
          mkdir -p qa226-diagnostics
          for index in $(seq 1 20); do
            echo "::group::Published MAP-032 attempt ${index}/20"
            if ! npm run test:e2e:pages -- --grep="publishes the MAP-021 Waterdeep geographic search contract" --retries=0 --trace=retain-on-failure --reporter=line > "qa226-diagnostics/published-${index}.log" 2>&1; then
              cat "qa226-diagnostics/published-${index}.log"
              cp -r test-results "qa226-diagnostics/failed-${index}" || true
              echo "::endgroup::"
              exit 1
            fi
            cat "qa226-diagnostics/published-${index}.log"
            echo "::endgroup::"
          done
          echo "Published URL (pre-existing): 20/20 PASS, retries=0, no deployment." >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify published Veyra initial health and post-reload health without retries
        id: published_veyra_health
        continue-on-error: true
        env:
          PAGES_URL: https://eduyube.github.io/castigo-divino-map/
        run: |
          npm run test:e2e:pages -- --grep="QA-226 published Veyra first acquisition and reload require connected" --retries=0 --trace=retain-on-failure
          echo "Published Veyra: first navigation and reload healthy, retries=0." >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify full published Veyra functional/portrait and remote health smoke
        id: published_veyra_full
        continue-on-error: true
        env:
          PAGES_URL: https://eduyube.github.io/castigo-divino-map/
        run: npm run test:e2e:pages -- --grep="loads the v1.3 public experience from the repository subdirectory" --retries=0 --trace=retain-on-failure

      - name: Preserve network/status evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa226-published-network-timeline
          path: |
            qa226-diagnostics/
            test-results/
          retention-days: 7

      # Each check runs even if an earlier remote read fails, preserving
      # independent evidence. This final step makes any failure blocking.
      - name: Enforce all remote and published checks (no false green)
        if: always()
        env:
          REMOTE_VERIFY: ${{ steps.remote_verify.outcome }}
          PUBLISHED_MAP032: ${{ steps.published_map032.outcome }}
          VEYRA_HEALTH: ${{ steps.published_veyra_health.outcome }}
          VEYRA_FULL: ${{ steps.published_veyra_full.outcome }}
        run: |
          set -euo pipefail
          printf 'QA-226 remote=%s MAP-032=%s Veyra-health=%s Veyra-full=%s\n' \
            "$REMOTE_VERIFY" "$PUBLISHED_MAP032" "$VEYRA_HEALTH" "$VEYRA_FULL"
          for result in "$REMOTE_VERIFY" "$PUBLISHED_MAP032" "$VEYRA_HEALTH" "$VEYRA_FULL"; do
            if [ "$result" != success ]; then
              echo "::error::At least one required published/remote check failed or was skipped."
              exit 1
            fi
          done

  controlled-no-retries:
    name: Deterministic first-refresh fixtures (20x transient, retries=0)
    if: github.head_ref == 'agent/qa-226-pages-connectivity-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Slow success, transient failure, persistent failure, offline
        run: npm run test:e2e -- --project=chromium --grep="QA-226" --retries=0 --workers=1 --trace=retain-on-failure

      - name: Transient 503 sensitivity 20x without retries
        run: npm run test:e2e -- --project=chromium --grep="QA-226 transient 503" --repeat-each=20 --retries=0 --workers=1 --trace=retain-on-failure

      - name: Preserve controlled fixture failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa226-controlled-failure-traces
          path: test-results/
          retention-days: 7
