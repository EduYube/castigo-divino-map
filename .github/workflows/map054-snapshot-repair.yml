name: MAP-054 snapshot repair

on:
  push:
    branches:
      - hotfix/map-054-public-snapshot

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: hotfix/map-054-public-snapshot

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild legacy v2 snapshot from production projection
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import {
            buildPublicMulticampaignSnapshotContent,
            checksum,
            INITIAL_PUBLIC_CAMPAIGN,
            loadRemotePublicMulticampaignRows,
            projectMulticampaignSnapshotContentToV2,
            SNAPSHOT_PATH,
          } from './scripts/public-snapshot-lib.mjs';

          const multicampaignContent = buildPublicMulticampaignSnapshotContent(
            await loadRemotePublicMulticampaignRows(),
          );
          if (
            multicampaignContent.campaigns.length !== 1 ||
            multicampaignContent.campaigns[0]?.id !== INITIAL_PUBLIC_CAMPAIGN.id
          ) {
            throw new Error('Legacy schema v2 repair is only valid while the initial campaign is the sole active campaign.');
          }

          const content = projectMulticampaignSnapshotContentToV2(
            multicampaignContent,
            INITIAL_PUBLIC_CAMPAIGN.id,
          );
          const nextChecksum = checksum(content);
          const snapshot = {
            ...content,
            generatedAt: new Date().toISOString(),
            checksum: nextChecksum,
            sourceRevision: nextChecksum,
          };
          await writeFile(SNAPSHOT_PATH, `${JSON.stringify(snapshot, null, 2)}\n`);
          console.log(`Rebuilt legacy public snapshot from production: ${nextChecksum}.`);
          NODE

      - name: Verify snapshot locally
        run: npm run snapshot:verify

      - name: Verify snapshot against production Supabase
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: npm run snapshot:verify:remote

      - name: Commit regenerated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/public-catalog.snapshot.json
          git diff --cached --exit-code && exit 0
          git commit -m 'fix: align public snapshot with MAP-054 production data'
          git push origin HEAD:hotfix/map-054-public-snapshot
