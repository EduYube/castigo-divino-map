name: MAP-054 snapshot repair

on:
  push:
    branches:
      - hotfix/map-054-public-snapshot

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: hotfix/map-054-public-snapshot

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch legacy v2 snapshot with MAP-054 roster
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { checksum, SNAPSHOT_PATH, snapshotContent } from './scripts/public-snapshot-lib.mjs';

          const snapshot = JSON.parse(await readFile(SNAPSHOT_PATH, 'utf8'));
          if (snapshot.schemaVersion !== 2) {
            throw new Error(`Expected legacy schema v2 snapshot, got v${snapshot.schemaVersion}.`);
          }
          if (!Array.isArray(snapshot.players) || snapshot.players.length !== 0) {
            throw new Error('Expected the pre-MAP-054 snapshot to have an empty players array.');
          }

          snapshot.players = [
            { id: 'player-skade', slug: 'skade', displayName: 'Skade', nameLanguage: 'en' },
            { id: 'player-ura', slug: 'ura', displayName: 'Ura', nameLanguage: 'en' },
            { id: 'player-veyra', slug: 'veyra', displayName: 'Veyra', nameLanguage: 'en' },
          ];
          snapshot.generatedAt = new Date().toISOString();
          const nextChecksum = checksum(snapshotContent(snapshot));
          snapshot.checksum = nextChecksum;
          snapshot.sourceRevision = nextChecksum;

          await writeFile(SNAPSHOT_PATH, `${JSON.stringify(snapshot, null, 2)}\n`);
          console.log(`Updated legacy public snapshot to ${nextChecksum}.`);
          NODE

      - name: Verify snapshot locally
        run: npm run snapshot:verify

      - name: Verify snapshot against production Supabase
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: npm run snapshot:verify:remote

      - name: Commit regenerated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/public-catalog.snapshot.json
          git diff --cached --exit-code && exit 0
          git commit -m 'fix: align public snapshot with MAP-054 roster'
          git push origin HEAD:hotfix/map-054-public-snapshot
