name: MAP-061 Review Fix Helper

on:
  push:
    branches:
      - agent/map-061-campaign-regions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-061-campaign-regions
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch revoked Master search state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.ts')
          text = path.read_text()
          start_marker = '    if (previousMasterEntityIds.size > 0 && nextMasterEntityIds.size === 0) {'
          end_marker = '\n\n    masterEntityIds = nextMasterEntityIds;'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('end marker not found')
          replacement = """    const removedMasterEntityIds = new Set(
            [...previousMasterEntityIds].filter((entityId) => !nextMasterEntityIds.has(entityId)),
          );
          if (removedMasterEntityIds.size > 0) {
            if (
              activeSupplementalPin?.entityId &&
              removedMasterEntityIds.has(activeSupplementalPin.entityId)
            ) {
              activeSupplementalPin = null;
              compactDetailsController.hide();
              clearSupplementalMapSelection();
            }
            if (placeSearchController.getQuery()) {
              placeSearchController.setQuery('', { notify: false });
            }
          }"""
          path.write_text(text[:start] + replacement + text[end:])
          PY
          npx prettier --write src/main.ts
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "fix: purge revoked Master search state"
          git push origin HEAD:agent/map-061-campaign-regions
