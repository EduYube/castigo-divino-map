name: MAP-066 release authoring

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  author:
    if: github.head_ref == 'agent/map-066-v1-1-release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-066-v1-1-release
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Apply release changes
        run: node scripts/map066-author-release.mjs

      - name: Commit release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(MAP-066): prepare v1.1 release gate'
          git push origin HEAD:agent/map-066-v1-1-release
