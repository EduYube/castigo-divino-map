name: MAP-046 public snapshot refresh

on:
  push:
    branches:
      - agent/map-046-sync-public-snapshot

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-046-sync-public-snapshot
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate committed public snapshot from published Supabase data
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: |
          npm run snapshot:generate
          npx prettier --write public/data/public-catalog.snapshot.json
          npm run snapshot:verify:remote
          npm run snapshot:verify
          npx prettier --check --end-of-line auto public/data/public-catalog.snapshot.json
      - name: Commit refreshed snapshot
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/public-catalog.snapshot.json
          if git diff --cached --quiet; then
            echo 'Snapshot already matches the current published catalog.'
            exit 0
          fi
          git commit -m 'data: sync public snapshot with Supabase'
          git push origin HEAD:agent/map-046-sync-public-snapshot
