name: MAP064 async save E2E fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/map-064-mission-hazard-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make lifecycle save sequencing deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/e2e/admin-map-entities.spec.ts')
          s = p.read_text()
          old = "  await expect(page.getByLabel('Estado funcional')).toHaveValue('active');\n  await page.getByRole('button', { name: 'Publicar' }).click();\n  await page.getByLabel('Estado funcional').selectOption('resolved');\n  await page.getByRole('button', { name: 'Publicar' }).click();\n  expect(backend.getEntity('entity-map064-bridge-hazard')).toMatchObject({\n"
          new = "  await expect(page.getByLabel('Estado funcional')).toHaveValue('active');\n  const beforeHazardPublish = backend.getSaveCount();\n  await page.getByRole('button', { name: 'Publicar' }).click();\n  await expect.poll(() => backend.getSaveCount()).toBe(beforeHazardPublish + 1);\n  await expect(page.getByText('Entidad publicada correctamente.')).toBeVisible();\n\n  await page.getByLabel('Estado funcional').selectOption('resolved');\n  const beforeHazardResolve = backend.getSaveCount();\n  await page.getByRole('button', { name: 'Publicar' }).click();\n  await expect.poll(() => backend.getSaveCount()).toBe(beforeHazardResolve + 1);\n  await expect(page.getByText('Entidad publicada correctamente.')).toBeVisible();\n  expect(backend.getEntity('entity-map064-bridge-hazard')).toMatchObject({\n"
          if s.count(old) != 1:
              raise SystemExit(f'MAP-064 hazard save anchor count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write tests/e2e/admin-map-entities.spec.ts
          npx prettier --check tests/e2e/admin-map-entities.spec.ts
      - name: Remove integration workflow
        run: rm .github/workflows/map064-e2e-async-save-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/admin-map-entities.spec.ts .github/workflows/map064-e2e-async-save-fix.yml
          git commit -m 'test(map-064): await lifecycle saves before follow-up edits'
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
