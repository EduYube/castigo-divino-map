name: MAP-059 regression repair

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

# Temporary MAP-059 iteration workflow; removed before Ready/merge.
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/map-059-proximity-spiderfy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python .github/map059_repair.py
      - run: >-
          npx prettier --write
          tests/e2e/compact-pin-details.spec.ts
          tests/e2e/map045-character-portraits.spec.ts
          tests/e2e/master-mode.spec.ts
          tests/e2e/pin-visual-system.spec.ts
          tests/e2e/map059-proximity-spiderfy.spec.ts
      - name: Commit residual repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e
          git commit -m 'MAP-059: finish residual E2E alignment'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
