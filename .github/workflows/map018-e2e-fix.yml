name: MAP-018 e2e one-shot fixer

on:
  push:
    branches:
      - agent/map-018-admin-taxonomy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-018-admin-taxonomy

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make administrative locators exact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/admin-catalog.spec.ts')
          text = path.read_text()
          replacements = {
              "page.getByLabel('Buscar')": "page.getByRole('searchbox', { name: 'Buscar', exact: true })",
              "page.getByLabel('Slug')": "page.getByRole('textbox', { name: 'Slug', exact: true })",
              "page.getByRole('button', { name: 'Nombres geográficos' })": "page.getByRole('button', { name: 'Nombres geográficos', exact: true })",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected locator not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Verify updated e2e suite
        run: |
          npm run format
          npm run lint
          npm run test
          npm run build:pages
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Remove one-shot workflow
        run: rm .github/workflows/map018-e2e-fix.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MAP-018 — Precisar selectores e2e administrativos"
          git push origin HEAD:agent/map-018-admin-taxonomy
