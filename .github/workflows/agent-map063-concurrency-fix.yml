name: MAP-063 temporary concurrency fix

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lock dynamic note preconditions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'supabase/migrations/20260901150000_add_public_player_note_authorship.sql';
          let sql = fs.readFileSync(path, 'utf8');

          function replaceSection(source, startMarker, endMarker, replacement, after = 0) {
            const start = source.indexOf(startMarker, after);
            if (start < 0) throw new Error(`missing start marker: ${startMarker}`);
            const end = source.indexOf(endMarker, start);
            if (end < 0) throw new Error(`missing end marker after: ${startMarker}`);
            return source.slice(0, start) + replacement + source.slice(end);
          }

          const publicAfter = [
            '  -- Keep the lock order deterministic: entity -> campaign -> player. The entity',
            '  -- UPDATE lock is also the existing serialization point for rate limiting and',
            '  -- sort-order allocation. Missing, draft, archived and Master-only targets',
            '  -- deliberately share one error.',
            '  select entity.*',
            '  into entity_row',
            '  from public.map_entities as entity',
            '  where entity.id = p_entity_id',
            "    and entity.publication_status = 'published'::public.publication_status",
            "    and entity.audience = 'public'::public.entity_audience",
            '  for update;',
            '',
            '  if not found then',
            "    raise exception using errcode = '22023', message = 'public note target unavailable';",
            '  end if;',
            '',
            '  -- FOR SHARE conflicts with administrative UPDATE/DELETE while remaining',
            '  -- compatible with concurrent public-note creations for different entities.',
            '  -- Under READ COMMITTED a waiter rechecks these predicates after the writer',
            '  -- commits, so a concurrent revocation either serializes after this creation',
            '  -- or makes this RPC fail before INSERT.',
            '  perform 1',
            '  from public.campaigns as campaign',
            '  where campaign.id = entity_row.campaign_id',
            "    and campaign.status = 'active'",
            '  for share;',
            '',
            '  if not found then',
            "    raise exception using errcode = '22023', message = 'public note target unavailable';",
            '  end if;',
            '',
            '  perform 1',
            '  from public.players as player',
            '  where player.id = p_player_id',
            '    and player.campaign_id = entity_row.campaign_id',
            "    and player.publication_status = 'published'::public.publication_status",
            '  for share;',
            '',
            '  if not found then',
            "    raise exception using errcode = '22023', message = 'invalid public note author';",
            '  end if;',
          ].join('\n');

          sql = replaceSection(
            sql,
            '  -- Lock the public entity before validation and sort-order allocation. Missing,',
            '\n\n  if pg_catalog.char_length(title_value)',
            publicAfter,
          );

          const masterFunction = 'create or replace function public.create_master_public_note(';
          const masterOffset = sql.indexOf(masterFunction);
          if (masterOffset < 0) throw new Error('missing Master create function');
          const masterAfter = [
            '  select entity.*',
            '  into entity_row',
            '  from public.map_entities as entity',
            '  where entity.id = p_entity_id',
            "    and entity.publication_status = 'published'::public.publication_status",
            "    and entity.audience = 'public'::public.entity_audience",
            '  for update;',
            '',
            '  if not found then',
            "    raise exception using errcode = '22023', message = 'public note target unavailable';",
            '  end if;',
            '',
            "  -- Match the public writer's entity -> campaign prefix so a campaign",
            '  -- lifecycle change cannot race an administrative note creation either.',
            '  perform 1',
            '  from public.campaigns as campaign',
            '  where campaign.id = entity_row.campaign_id',
            "    and campaign.status = 'active'",
            '  for share;',
            '',
            '  if not found then',
            "    raise exception using errcode = '22023', message = 'public note target unavailable';",
            '  end if;',
          ].join('\n');

          sql = replaceSection(
            sql,
            '  select entity.*',
            '\n\n  if pg_catalog.char_length(title_value)',
            masterAfter,
            masterOffset,
          );

          const shareCount = (sql.match(/for share;/g) ?? []).length;
          if (shareCount < 3) throw new Error(`expected new campaign/player SHARE locks, found ${shareCount}`);
          fs.writeFileSync(path, sql);
          NODE

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Validate migration and database tests
        run: |
          npm run supabase:db:reset
          npm run supabase:db:lint
          npm run supabase:db:test

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

      - name: Commit validated lock fix and remove helper
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+EduYube@users.noreply.github.com"
          git add supabase/migrations/20260901150000_add_public_player_note_authorship.sql
          git rm .github/workflows/agent-map063-concurrency-fix.yml
          git commit -m "fix(db): serialize public note eligibility"
          git push origin HEAD:agent/map-063-public-player-notes
