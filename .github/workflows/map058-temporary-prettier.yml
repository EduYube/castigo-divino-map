name: MAP-058 temporary Prettier

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format-map058-review-followup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/map-058-player-associations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format review follow-up
        run: npx prettier --write scripts/test-map058-v4-v5-concurrency.mjs package.json
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-map058-v4-v5-concurrency.mjs package.json
          git commit -m "style: format MAP-058 review follow-up"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
