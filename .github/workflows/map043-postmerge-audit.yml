name: MAP-043 post-merge audit

on:
  pull_request:
    branches:
      - master

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: f71ee498883e69327ac8f31bf4ca379942dac2a7
    steps:
      - name: Wait for exact master CI and Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          for attempt in $(seq 1 48); do
            runs="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"
            echo "=== exact-SHA workflow runs (attempt ${attempt}) ==="
            echo "$runs" | jq -r --arg sha "$TARGET_SHA" '
              .workflow_runs[]
              | select(.head_sha == $sha)
              | [.id, .name, .event, .status, (.conclusion // "-"), .head_branch, .html_url]
              | @tsv
            '

            ci="$(echo "$runs" | jq -c --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha and .name == "CI" and .event == "push")]
              | sort_by(.run_number)
              | last // empty
            ')"

            if [[ -n "$ci" ]]; then
              ci_status="$(echo "$ci" | jq -r '.status')"
              ci_conclusion="$(echo "$ci" | jq -r '.conclusion // ""')"
              ci_id="$(echo "$ci" | jq -r '.id')"
              echo "MASTER_CI_ID=${ci_id} status=${ci_status} conclusion=${ci_conclusion}"
              if [[ "$ci_status" == "completed" && "$ci_conclusion" != "success" ]]; then
                echo "Exact master CI failed." >&2
                exit 1
              fi
            else
              ci_status=""
            fi

            deployments="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${TARGET_SHA}&environment=github-pages&per_page=20")"
            deployment_count="$(echo "$deployments" | jq 'length')"
            echo "PAGES_DEPLOYMENT_COUNT=${deployment_count}"

            pages_ok=false
            if [[ "$deployment_count" -gt 0 ]]; then
              deployment_id="$(echo "$deployments" | jq -r 'sort_by(.created_at) | last | .id')"
              statuses="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20")"
              echo "=== exact-SHA Pages deployment statuses ==="
              echo "$statuses" | jq -r '.[] | [.id, .state, (.environment_url // "-"), (.log_url // "-")] | @tsv'
              latest_state="$(echo "$statuses" | jq -r 'sort_by(.created_at) | last | .state // ""')"
              environment_url="$(echo "$statuses" | jq -r 'sort_by(.created_at) | last | .environment_url // ""')"
              echo "PAGES_DEPLOYMENT_ID=${deployment_id} state=${latest_state} environment_url=${environment_url}"
              if [[ "$latest_state" == "failure" || "$latest_state" == "error" || "$latest_state" == "inactive" ]]; then
                echo "Exact-SHA Pages deployment failed." >&2
                exit 1
              fi
              if [[ "$latest_state" == "success" && -n "$environment_url" ]]; then
                pages_ok=true
              fi
            fi

            if [[ "${ci_status:-}" == "completed" && "$pages_ok" == "true" ]]; then
              code="$(curl --fail --location --silent --show-error --output /tmp/map043-public.html --write-out '%{http_code}' "$environment_url")"
              echo "PUBLIC_SMOKE_URL=${environment_url} HTTP=${code} bytes=$(wc -c < /tmp/map043-public.html)"
              test "$code" = "200"
              grep -q '<div id="app"' /tmp/map043-public.html
              echo "POST_MERGE_AUDIT_OK"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for exact master CI and Pages deployment." >&2
          exit 1
