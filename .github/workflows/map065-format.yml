name: MAP-065 formatter

on:
  push:
    branches:
      - agent/map-065-content-layers

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-065-content-layers
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format MAP-065 changes
        run: |
          npx prettier --write --end-of-line auto \
            src/app/placeSearch.ts \
            src/app/urlState.layers.test.ts \
            src/app/urlState.ts \
            src/domain/mapLayers.test.ts \
            src/domain/mapLayers.ts \
            src/main.ts \
            tests/e2e/map065-fixture.ts \
            tests/e2e/map065-layers.spec.ts \
            tests/e2e/map065-master-layers.spec.ts \
            tests/e2e/map065-url-responsive.spec.ts
      - name: Commit formatted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/map065-format.yml
          git add -A
          git commit -m "style(map): format MAP-065 changes"
          git push origin HEAD:agent/map-065-content-layers
