name: MAP-061 E2E Fix Helper

on:
  push:
    branches:
      - agent/map-061-campaign-regions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-061-campaign-regions

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MAP-061 E2E interaction fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/map061-campaign-regions.spec.ts')
          text = path.read_text()

          def replace(old: str, new: str, expected: int = 1) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} matches, found {count}: {old!r}')
              text = text.replace(old, new)

          replace(
              'async function configureBackend(page: Page): Promise<void> {',
              """async function configureBackend(
            page: Page,
            options: { readonly includeInnerPin?: boolean } = {},
          ): Promise<void> {
            const includeInnerPin = options.includeInnerPin ?? true;""",
          )

          replace(
              "    const rows = PUBLIC_ROWS[table] ?? [];",
              """    const sourceRows = PUBLIC_ROWS[table] ?? [];
            const rows =
              table === 'map_entities' && !includeInnerPin
                ? sourceRows.filter(({ id }) => id !== INNER_PIN_ID)
                : sourceRows;""",
          )

          replace(
              'async function openMap(page: Page): Promise<void> {\n  await configureBackend(page);',
              """async function openMap(
            page: Page,
            options: { readonly includeInnerPin?: boolean } = {},
          ): Promise<void> {
            await configureBackend(page, options);""",
          )

          replace(
              """function region(page: Page, id: string) {
            return page.locator(`.campaign-region[data-region-id=\"${id}\"]`);
          }
          """,
              """function region(page: Page, id: string) {
            return page.locator(`.campaign-region[data-region-id=\"${id}\"]`);
          }

          async function clickRegionInterior(
            page: Page,
            id: string,
            position: { readonly xRatio: number; readonly yRatio: number } = {
              xRatio: 0.5,
              yRatio: 0.5,
            },
          ): Promise<void> {
            const target = region(page, id);
            const box = await target.boundingBox();
            expect(box).not.toBeNull();
            if (!box) throw new Error(`La región ${id} no tiene un área interactiva visible.`);
            await target.click({
              position: {
                x: box.width * position.xRatio,
                y: box.height * position.yRatio,
              },
            });
          }
          """,
          )

          replace(
              "  await cromryn.click({ position: { x: 6, y: 6 } });",
              "  await clickRegionInterior(page, REGION_A_ID, { xRatio: 0.25, yRatio: 0.25 });",
              expected=1,
          )

          replace(
              "  await overlap.click({ position: { x: 6, y: 6 } });",
              "  await clickRegionInterior(page, REGION_B_ID, { xRatio: 0.75, yRatio: 0.25 });",
          )

          replace(
              """    await page.setViewportSize({ width, height: 780 });
            await openMap(page);
            const cromryn = region(page, REGION_A_ID);

            await cromryn.click({ position: { x: 6, y: 6 } });""",
              """    await page.setViewportSize({ width, height: 780 });
            await openMap(page, { includeInnerPin: false });
            const cromryn = region(page, REGION_A_ID);
            await expect(insidePin(page)).toHaveCount(0);

            await clickRegionInterior(page, REGION_A_ID);""",
          )

          path.write_text(text)
          PY

          npx prettier --write tests/e2e/map061-campaign-regions.spec.ts
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/map061-campaign-regions.spec.ts
          git commit -m "test: exercise MAP-061 region hit targets reliably"
          git push origin HEAD:agent/map-061-campaign-regions
