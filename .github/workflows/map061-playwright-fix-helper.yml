name: MAP-061 Playwright Fix Helper

on:
  push:
    branches:
      - agent/map-061-campaign-regions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-061-campaign-regions

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MAP-061 regression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          replace(
              'tests/e2e/admin-map-entities.spec.ts',
              r'/location · Places · X 1200, Y 900/',
              r'/location · Punto · Places · X 1200, Y 900/',
          )

          replace(
              'tests/e2e/map061-admin-regions.spec.ts',
              "page.getByLabel('Coordenada X representativa')",
              "page.getByLabel(/Coordenada X(?: representativa)?/)",
          )
          replace(
              'tests/e2e/map061-admin-regions.spec.ts',
              "page.getByLabel('Coordenada Y representativa')",
              "page.getByLabel(/Coordenada Y(?: representativa)?/)",
          )
          replace(
              'tests/e2e/map061-admin-regions.spec.ts',
              "for (let index = 0; index < 7; index += 1) await page.keyboard.press('Shift+ArrowRight');\n  await page.keyboard.press('ArrowRight');\n  await page.keyboard.press('ArrowRight');",
              "for (let index = 0; index < 7; index += 1) await firstVertex.press('Shift+ArrowRight');\n  await firstVertex.press('ArrowRight');\n  await firstVertex.press('ArrowRight');",
          )
          replace(
              'tests/e2e/map061-admin-regions.spec.ts',
              "await page.mouse.click(canvasBox.x + canvasBox.width / 2, canvasBox.y + canvasBox.height / 2);",
              "await canvas.click({ position: { x: canvasBox.width * 0.72, y: canvasBox.height * 0.52 } });",
          )
          replace(
              'tests/e2e/map061-admin-regions.spec.ts',
              "await firstVertex.focus();\n  await page.keyboard.press('ArrowRight');",
              "await firstVertex.press('ArrowRight');",
          )

          replace(
              'tests/e2e/map061-admin-mobile.spec.ts',
              "page.getByLabel('Coordenada X representativa')",
              "page.getByLabel(/Coordenada X(?: representativa)?/)",
          )
          replace(
              'tests/e2e/map061-admin-mobile.spec.ts',
              "page.getByLabel('Coordenada Y representativa')",
              "page.getByLabel(/Coordenada Y(?: representativa)?/)",
          )
          replace(
              'tests/e2e/map061-admin-mobile.spec.ts',
              "await page.touchscreen.tap(box.x + box.width / 2, box.y + box.height / 2);",
              "await page.touchscreen.tap(box.x + box.width * 0.72, box.y + box.height * 0.52);",
          )

          campaign = Path('tests/e2e/map061-campaign-regions.spec.ts')
          text = campaign.read_text()
          count = text.count("'data-active-place-id'")
          if count != 6:
              raise SystemExit(f'map061-campaign-regions: expected 6 legacy detail assertions, found {count}')
          text = text.replace("'data-active-place-id'", "'data-entity-id'")
          old = r'/No coincide con los filtros explícitos actuales/i'
          if text.count(old) != 1:
              raise SystemExit('map061-campaign-regions: filter aria assertion changed unexpectedly')
          text = text.replace(old, r'/No coincide con .*filtros actuales/i')
          campaign.write_text(text)

          replace(
              'tests/e2e/map061-region-selection-state.spec.ts',
              "await region.click({ force: true });",
              "await region.focus();\n  await page.keyboard.press('Enter');",
          )

          replace(
              'tests/e2e/map059-master-isolation.spec.ts',
              "await regionA.click();\n  await expect(page.getByTestId('place-details')).toContainText(MASTER_REGION_A_NAME);",
              "await regionA.focus();\n  await page.keyboard.press('Enter');\n  await expect(page.getByTestId('place-details')).toContainText(MASTER_REGION_A_NAME);",
          )

          replace(
              'src/styles/campaign-regions.css',
              "  .campaign-region:hover,\n  .campaign-region:focus {\n    stroke: Highlight;\n    stroke-width: 5;\n    stroke-dasharray: 3 4;\n  }",
              "  .campaign-region:hover,\n  .campaign-region:focus {\n    stroke: Highlight;\n    stroke-width: 5;\n    stroke-dasharray: 3 4;\n    fill-opacity: 0.01;\n  }",
          )
          PY

          npx prettier --write \
            src/styles/campaign-regions.css \
            tests/e2e/admin-map-entities.spec.ts \
            tests/e2e/map059-master-isolation.spec.ts \
            tests/e2e/map061-admin-mobile.spec.ts \
            tests/e2e/map061-admin-regions.spec.ts \
            tests/e2e/map061-campaign-regions.spec.ts \
            tests/e2e/map061-region-selection-state.spec.ts

          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/campaign-regions.css tests/e2e
          git commit -m "fix: stabilize MAP-061 interaction regressions"
          git push origin HEAD:agent/map-061-campaign-regions
