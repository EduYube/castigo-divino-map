name: MAP-039 format helper

on:
  push:
    branches:
      - agent/map-039-complete-geographic-index

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-039-complete-geographic-index
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and commit MAP-039 files
        run: |
          npx prettier --write \
            src/data-access/geographicCoverageContract.js \
            src/data-access/geographicCoverageContract.test.ts \
            src/data-access/geographicCoverageManifest.d.ts \
            src/data-access/geographicCoverageManifest.js
          if git diff --quiet -- \
            src/data-access/geographicCoverageContract.js \
            src/data-access/geographicCoverageContract.test.ts \
            src/data-access/geographicCoverageManifest.d.ts \
            src/data-access/geographicCoverageManifest.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/data-access/geographicCoverageContract.js \
            src/data-access/geographicCoverageContract.test.ts \
            src/data-access/geographicCoverageManifest.d.ts \
            src/data-access/geographicCoverageManifest.js
          git commit -m "style(MAP-039): apply canonical formatting"
          git push origin HEAD:agent/map-039-complete-geographic-index
