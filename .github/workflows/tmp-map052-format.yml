name: MAP-052 temporary formatter

on:
  push:
    branches:
      - agent/map-052-snapshot-sync
    paths:
      - .github/workflows/tmp-map052-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-052-snapshot-sync
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format smoke test
        run: npx prettier --write tests/deployment/pages-smoke.spec.ts
      - name: Verify formatting
        run: npm run format:check
      - name: Commit formatted file
        run: |
          if git diff --quiet -- tests/deployment/pages-smoke.spec.ts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/deployment/pages-smoke.spec.ts
          git commit -m "style: format MAP-052 Pages smoke"
          git push origin HEAD:agent/map-052-snapshot-sync
