name: MAP-064 final test fixes

on:
  push:
    branches:
      - agent/map-064-mission-hazard-lifecycle
    paths:
      - .github/workflows/map064-final-test-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MAP-064 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final MAP-064 test fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sqlPath = 'supabase/tests/database/038_mission_hazard_lifecycle.test.sql';
          let sql = fs.readFileSync(sqlPath, 'utf8');
          if (!sql.includes('select plan(28);')) throw new Error('Missing MAP-064 pgTAP plan');
          sql = sql.replace('select plan(28);', 'select plan(29);');
          const roleBlock = `set local role authenticated;\n\ninsert into public.map_entities (`;
          if (!sql.includes(roleBlock)) throw new Error('Missing first authenticated fixture block');
          sql = sql.replace(
            roleBlock,
            `set local role authenticated;\n\nselect ok(\n  pg_temp.statement_fails(\n    $$update public.map_entities\n      set lifecycle_status = null\n      where id = 'place-demo-harbor'$$\n  ),\n  'authenticated cannot mutate lifecycle directly through the table'\n);\n\nreset role;\n\ninsert into public.map_entities (`,
          );
          fs.writeFileSync(sqlPath, sql);

          const e2ePath = 'tests/e2e/map064-functional-pin-visuals.spec.ts';
          let e2e = fs.readFileSync(e2ePath, 'utf8');
          const oldSelectors = `  const locationOption = page\n    .getByTestId('coincident-pin-option')\n    .filter({ has: page.locator('[data-entity-type="location"]') });\n  const hazardOption = page\n    .getByTestId('coincident-pin-option')\n    .filter({ has: page.locator('[data-entity-type="hazard"]') });`;
          const newSelectors = `  const locationOption = page.locator(\n    '[data-testid="coincident-pin-option"][data-entity-type="location"]',\n  );\n  const hazardOption = page.locator(\n    '[data-testid="coincident-pin-option"][data-entity-type="hazard"]',\n  );`;
          if (!e2e.includes(oldSelectors)) throw new Error('Missing brittle MAP-064 option selectors');
          e2e = e2e.replace(oldSelectors, newSelectors);
          const oldHazard = `  const hazard = options.locator('[data-entity-type="hazard"]').first();\n  await hazard.click();`;
          if (!e2e.includes(oldHazard)) throw new Error('Missing MAP-064 hazard option click');
          e2e = e2e.replace(oldHazard, `  await hazardOption.click();`);
          fs.writeFileSync(e2ePath, e2e);
          NODE

      - name: Format and validate changed browser test
        run: |
          npx prettier --write tests/e2e/map064-functional-pin-visuals.spec.ts
          npx prettier --check tests/e2e/map064-functional-pin-visuals.spec.ts

      - name: Remove workflow and commit fixes
        shell: bash
        run: |
          git rm .github/workflows/map064-final-test-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/038_mission_hazard_lifecycle.test.sql tests/e2e/map064-functional-pin-visuals.spec.ts
          git commit -m "test(map-064): harden lifecycle validation"
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
