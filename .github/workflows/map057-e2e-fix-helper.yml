name: MAP-057 E2E fix helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/map-057-editable-player-dispositions' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch full-details E2E navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/e2e/admin-map-entities.spec.ts')
          text = path.read_text()
          pattern = re.compile(
              r"  const popupPromise = page\.waitForEvent\('popup'\);\n.*?  await detailsPage\.close\(\);\n",
              re.DOTALL,
          )
          new = (
              "  const fullAction = panel.getByRole('link', {\n"
              "    name: 'Abrir ficha completa de MAP-019 Character en una pestaña nueva',\n"
              "  });\n"
              "  const fullHref = await fullAction.getAttribute('href');\n"
              "  expect(fullHref).toMatch(/\\?entity=map019-character&campaign=castigo-divino$/);\n"
              "  await page.goto(fullHref ?? '/');\n"
              "  await expect(\n"
              "    page.getByRole('heading', { level: 2, name: 'Relación con los personajes' }),\n"
              "  ).toBeVisible();\n"
              "  await expect(page.getByRole('listitem', { name: 'Skade: Enemigo' })).toBeVisible();\n"
              "  await expect(page.getByRole('listitem', { name: 'Ura: Aliado' })).toBeVisible();\n"
              "  await expect(page.getByRole('listitem', { name: 'Veyra: Neutral' })).toBeVisible();\n"
          )
          text, replacements = pattern.subn(lambda _: new, text, count=1)
          if replacements != 1:
              raise SystemExit(f'Expected one MAP-057 popup block, found {replacements}')
          path.write_text(text)
          PY
      - run: npx prettier --write tests/e2e/admin-map-entities.spec.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/admin-map-entities.spec.ts
          git commit -m "test: validate full relation view on mocked page"
          git push origin HEAD:${{ github.head_ref }}
