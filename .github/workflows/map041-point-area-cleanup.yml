name: MAP-041 Focus State Cleanup

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-041-geographic-search-extents
      - name: Clear legacy point state before every search navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/map/leaflet.ts')
          text = path.read_text()
          old = '''    locateSearchTarget(target: MapSearchTarget): void {\n      clearMapSearchFocus(map);\n\n      if (target.searchExtent) {\n'''
          new = '''    locateSearchTarget(target: MapSearchTarget): void {\n      clearSearchHighlight();\n      clearMapSearchFocus(map);\n\n      if (target.searchExtent) {\n'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('MAP-041 locateSearchTarget marker missing')
          path.write_text(text)
          PY
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/leaflet.ts
          git commit -m "fix(MAP-041): replace point and area focus atomically"
          git push origin HEAD:agent/map-041-geographic-search-extents
