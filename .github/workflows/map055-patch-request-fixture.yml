name: MAP-055 patch request fixture

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime
    paths:
      - .github/workflows/map055-patch-request-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Adapt MAP-046 request publication public catalog fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/map046-request-publication.spec.ts')
          text = path.read_text()

          playwright_import = "import { expect, test, type Page, type Route } from '@playwright/test';\n"
          campaign_import = "\nimport { INITIAL_PUBLIC_CAMPAIGN_ID } from '../../src/data-access/publicCatalogQueryContract.js';\n"
          if 'INITIAL_PUBLIC_CAMPAIGN_ID' not in text:
              text = text.replace(playwright_import, playwright_import + campaign_import, 1)

          old = """const rows: Record<string, unknown>[] =
        table === 'categories'
"""
          new = """const rows: Record<string, unknown>[] =
        table === 'campaigns'
          ? [
              {
                id: INITIAL_PUBLIC_CAMPAIGN_ID,
                slug: 'castigo-divino',
                name: 'Castigo Divino',
                status: 'active',
                display_order: 0,
              },
            ]
          : table === 'categories'
"""
          matches = text.count(old)
          if matches != 2:
              raise SystemExit(f'Expected 2 public/admin GET row branches, found {matches}')
          text = text.replace(old, new)
          path.write_text(text)
          PY
          npx prettier --write tests/e2e/map046-request-publication.spec.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/map046-request-publication.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "MAP-055 adapt MAP-046 request campaign fixture"
          git push origin HEAD:agent/map-055-public-campaign-runtime
