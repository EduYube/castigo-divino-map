name: MAP-046 E2E debug

on:
  push:
    branches:
      - agent/map-046-admin-workspace-initialization

permissions:
  contents: write

jobs:
  map046:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-046-admin-workspace-initialization
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Apply exact selector fix
        shell: bash
        run: |
          sed -i "s/page.getByLabel('ID estable')/page.getByRole('textbox', { name: 'ID estable' })/g" tests/e2e/map046-admin-workspace.spec.ts
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/map046-admin-workspace.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test: scope MAP-046 catalog focus assertion'
            git push origin HEAD:agent/map-046-admin-workspace-initialization
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run MAP-046 workspace regression
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/map046-admin-workspace.spec.ts --project=chromium --reporter=line --max-failures=1 > /tmp/map046-workspace.log 2>&1
          status=$?
          tail -n 100 /tmp/map046-workspace.log
          exit $status
      - name: Run MAP-046 request publication regression
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/map046-request-publication.spec.ts --project=chromium --reporter=line --max-failures=1 > /tmp/map046-request.log 2>&1
          status=$?
          tail -n 140 /tmp/map046-request.log
          exit $status