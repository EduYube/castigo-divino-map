name: MAP-046 E2E debug

on:
  push:
    branches:
      - agent/map-046-admin-workspace-initialization

permissions:
  contents: read

jobs:
  map046:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run MAP-046 browser regressions only
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/map046-admin-workspace.spec.ts tests/e2e/map046-request-publication.spec.ts --project=chromium --reporter=line > /tmp/map046-e2e.log 2>&1
          status=$?
          tail -n 220 /tmp/map046-e2e.log
          exit $status
