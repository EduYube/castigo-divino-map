name: MAP-046 E2E debug

on:
  push:
    branches:
      - agent/map-046-admin-workspace-initialization

permissions:
  contents: write

jobs:
  map046:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-046-admin-workspace-initialization
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Apply exact test-runtime fix
        shell: bash
        run: |
          sed -i 's/retryDelaysMs: \[\]/retryDelaysMs: [0]/g' tests/e2e/map046-admin-workspace.spec.ts tests/e2e/map046-request-publication.spec.ts
          git diff --check
          git diff --exit-code -- .github/workflows/ci.yml src || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/map046-admin-workspace.spec.ts tests/e2e/map046-request-publication.spec.ts
          git commit -m 'test: execute MAP-046 public runtime once'
          git push origin HEAD:agent/map-046-admin-workspace-initialization
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run MAP-046 workspace regression
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/map046-admin-workspace.spec.ts --project=chromium --reporter=line --max-failures=1 > /tmp/map046-workspace.log 2>&1
          status=$?
          tail -n 120 /tmp/map046-workspace.log
          exit $status
      - name: Run MAP-046 request publication regression
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/map046-request-publication.spec.ts --project=chromium --reporter=line --max-failures=1 > /tmp/map046-request.log 2>&1
          status=$?
          tail -n 160 /tmp/map046-request.log
          exit $status