name: MAP-042 temporary E2E diagnostic

on:
  push:
    branches:
      - agent/map-042-geographic-navigation-pin-visibility

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Reproduce E2E failure
        id: e2e
        shell: bash
        run: |
          set +e
          npm run test:e2e 2>&1 | tee /tmp/map042-e2e.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic excerpt to PR
        if: steps.e2e.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'MAP-042 temporary E2E diagnostic for commit `${{ github.sha }}`.'
            echo
            echo '```text'
            tail -n 220 /tmp/map042-e2e.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 116 --repo EduYube/castigo-divino-map --body-file /tmp/comment.md

      - name: Fail when reproduction fails
        if: steps.e2e.outputs.status != '0'
        run: exit 1
