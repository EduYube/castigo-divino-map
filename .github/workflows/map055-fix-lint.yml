name: MAP-055 lint fix

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
      - name: Remove unused geographic destructure binding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/infrastructure/supabase/publicCatalogRepository.ts')
          text = path.read_text()
          old = """  return catalog.geographicNames.map(({ entityId: _entityId, ...name }) => name);\n"""
          new = """  return catalog.geographicNames.map((name) => ({\n    id: name.id,\n    slug: name.slug,\n    name: name.name,\n    language: name.language,\n    aliases: name.aliases,\n    coordinates: name.coordinates,\n    searchExtent: name.searchExtent,\n    recommendedZoom: name.recommendedZoom,\n  }));\n"""
          if old not in text:
              raise SystemExit('lint fix target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and commit
        run: |
          npx --yes prettier@3.6.2 --write src/infrastructure/supabase/publicCatalogRepository.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/supabase/publicCatalogRepository.ts
          git commit -m "MAP-055 fix global geography projection lint"
          git push origin HEAD:agent/map-055-public-campaign-runtime
