name: MAP-045 database diagnostic

on:
  push:
    branches:
      - agent/map-045-character-portraits

jobs:
  database-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase database
        run: npx supabase db start

      - name: Test upgrade path
        run: npm run supabase:db:test:upgrade

      - name: Reset local database
        run: npm run supabase:db:reset

      - name: Test MAP-045 Storage HTTP authorization
        run: npm run supabase:db:test:map045:http

      - name: Test MAP-028 data migration
        run: npm run supabase:db:test:map028

      - name: Test MAP-040 data migration
        run: npm run supabase:db:test:map040

      - name: Test MAP-041 data migration
        run: npm run supabase:db:test:map041

      - name: Lint database
        run: npm run supabase:db:lint

      - name: Run pgTAP database suite
        run: npm run supabase:db:test

      - name: Run database concurrency suite
        run: npm run supabase:db:test:concurrency

      - name: Stop local Supabase database
        if: always()
        run: npx supabase stop --no-backup
