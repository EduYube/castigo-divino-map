name: MAP-049 format diagnostic

on:
  push:
    branches:
      - agent/map-049-portrait-footprint

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write tests/e2e/map045-character-portraits.spec.ts
          git diff -- tests/e2e/map045-character-portraits.spec.ts
