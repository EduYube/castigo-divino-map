name: MAP-016 format and validate once

on:
  push:
    branches:
      - agent/map-016-public-data-resilience
    paths:
      - .github/workflows/map-016-format-once.yml

permissions:
  contents: write
  actions: write
  statuses: write

jobs:
  format-and-dispatch:
    name: Format MAP-016 and launch definitive CI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout MAP-016 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-016-public-data-resilience
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatting
        run: npm run format

      - name: Guard and commit the formatting result
        env:
          FORMAT_BASE_SHA: 96fe09f7ea7c291e52c66509028cbc2984ce0186
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/map-016-format-once.yml

          expected_files=(
            "src/infrastructure/supabase/publicCatalogCodec.test.ts"
            "src/infrastructure/supabase/publicCatalogCodec.ts"
            "src/infrastructure/supabase/publicCatalogRepository.test.ts"
            "src/infrastructure/supabase/publicCatalogRepository.ts"
          )
          mapfile -t changed_files < <(git diff --name-only "$FORMAT_BASE_SHA")

          if [[ "${#changed_files[@]}" -ne "${#expected_files[@]}" ]]; then
            printf 'Unexpected formatting scope:\n' >&2
            printf '  %s\n' "${changed_files[@]}" >&2
            exit 1
          fi

          for expected_file in "${expected_files[@]}"; do
            if ! printf '%s\n' "${changed_files[@]}" | grep -Fxq "$expected_file"; then
              echo "Expected formatted file is missing: $expected_file" >&2
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft "$FORMAT_BASE_SHA"
          git add -A
          git commit -m "style: apply Prettier to MAP-016 hardening"
          git push --force-with-lease origin HEAD:agent/map-016-public-data-resilience

      - name: Launch definitive CI and publish its status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/map-016-public-data-resilience
        shell: bash
        run: |
          set -euo pipefail
          new_sha=$(git rev-parse HEAD)
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          curl --fail-with-body --silent --show-error -X POST \
            "${headers[@]}" \
            "$api/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}"

          run_id=""
          run_url=""
          for _ in $(seq 1 60); do
            response=$(curl --fail-with-body --silent --show-error \
              "${headers[@]}" \
              "$api/actions/workflows/ci.yml/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20")
            run_id=$(jq -r --arg sha "$new_sha" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$response" | head -n 1)
            run_url=$(jq -r --arg sha "$new_sha" '.workflow_runs[] | select(.head_sha == $sha) | .html_url' <<<"$response" | head -n 1)

            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "The definitive CI run could not be located." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error -X POST \
            "${headers[@]}" \
            "$api/statuses/$new_sha" \
            -d "{\"state\":\"pending\",\"target_url\":\"$run_url\",\"description\":\"Definitive CI is running\",\"context\":\"map-016/definitive-ci\"}" >/dev/null

          conclusion=""
          for _ in $(seq 1 360); do
            run=$(curl --fail-with-body --silent --show-error \
              "${headers[@]}" \
              "$api/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run")

            if [[ "$status" == "completed" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$conclusion" == "success" ]]; then
            state=success
            description="Definitive CI passed"
          else
            state=failure
            description="Definitive CI failed: ${conclusion:-unknown}"
          fi

          curl --fail-with-body --silent --show-error -X POST \
            "${headers[@]}" \
            "$api/statuses/$new_sha" \
            -d "{\"state\":\"$state\",\"target_url\":\"$run_url\",\"description\":\"$description\",\"context\":\"map-016/definitive-ci\"}" >/dev/null

          echo "Definitive CI: $run_url"
          [[ "$conclusion" == "success" ]]
