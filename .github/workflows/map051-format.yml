name: MAP-051 formatter

on:
  push:
    branches:
      - agent/map-051-expanded-map-layout

permissions:
  contents: write

jobs:
  format:
    name: Apply repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-051-expanded-map-layout

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format MAP-051 TypeScript
        run: npx prettier --write src/map/expandToggle.test.ts src/map/leaflet.ts tests/e2e/map051-expanded-map.spec.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/expandToggle.test.ts src/map/leaflet.ts tests/e2e/map051-expanded-map.spec.ts
          git commit -m "MAP-051: apply repository formatting"
          git push origin HEAD:agent/map-051-expanded-map-layout
