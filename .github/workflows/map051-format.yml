name: MAP-051 formatter

on:
  push:
    branches:
      - agent/map-051-expanded-map-layout

permissions:
  contents: write

jobs:
  format:
    name: Format MAP-051 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-051-expanded-map-layout

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format modified E2E
        run: npx prettier --write tests/e2e/map051-expanded-map.spec.ts

      - name: Remove temporary formatter and commit
        run: |
          rm .github/workflows/map051-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/map051-expanded-map.spec.ts .github/workflows/map051-format.yml
          git commit -m "MAP-051: format deterministic navigation E2E"
          git push origin HEAD:agent/map-051-expanded-map-layout
