name: Format MAP-006

on:
  push:
    branches:
      - agent/map-006-markers-and-place-details

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier formatting
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-006-markers-and-place-details

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply formatting
        run: npm run format

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: format MAP-006 files"
          git push origin HEAD:agent/map-006-markers-and-place-details
