name: MAP-041 E2E Diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-041-geographic-search-extents
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture MAP-041 E2E output
        id: e2e
        shell: bash
        run: |
          set +e
          CI=1 npx playwright test tests/e2e/map041-geographic-search-extents.spec.ts --project=chromium --reporter=line > map041-e2e-debug.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat map041-e2e-debug.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map041-e2e-debug.txt
          git commit -m "chore(MAP-041): capture E2E failure output"
          git push origin HEAD:agent/map-041-geographic-search-extents
      - name: Preserve diagnostic failure state
        if: steps.e2e.outputs.exit_code != '0'
        run: exit 1
