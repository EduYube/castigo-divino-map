name: MAP-057 ready helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    if: github.head_ref == 'agent/map-057-editable-player-dispositions' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 173 --repo EduYube/castigo-divino-map
