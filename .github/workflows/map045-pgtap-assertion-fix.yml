name: MAP-045 pgTAP assertion fix

on:
  push:
    branches:
      - agent/map-045-character-portraits

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/map-045-character-portraits
          fetch-depth: 0
      - name: Replace unavailable pgTAP like assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/tests/database/020_character_portraits.test.sql")
          text = path.read_text()
          old_editor = (
              "select like(\n"
              "  public.admin_get_map_entity_editor_v3('entity-map045-master') -> 'record' ->> 'portrait_path',\n"
              "  'portraits/%',\n"
              "  'admin editor receives the current portrait reference'\n"
              ");"
          )
          new_editor = (
              "select ok(\n"
              "  (public.admin_get_map_entity_editor_v3('entity-map045-master') -> 'record' ->> 'portrait_path') like 'portraits/%',\n"
              "  'admin editor receives the current portrait reference'\n"
              ");"
          )
          old_catalog = (
              "select like(\n"
              "  public.admin_get_master_catalog_v2()::text,\n"
              "  '%22222222-2222-4222-8222-222222222222.webp%',\n"
              "  'authorized master catalog includes the master portrait reference'\n"
              ");"
          )
          new_catalog = (
              "select ok(\n"
              "  public.admin_get_master_catalog_v2()::text like '%22222222-2222-4222-8222-222222222222.webp%',\n"
              "  'authorized master catalog includes the master portrait reference'\n"
              ");"
          )
          if old_editor not in text or old_catalog not in text:
              raise SystemExit("expected pgTAP assertions not found")
          path.write_text(text.replace(old_editor, new_editor, 1).replace(old_catalog, new_catalog, 1))
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/map045-pgtap-assertion-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use portable pgTAP portrait assertions"
          git push origin HEAD:agent/map-045-character-portraits
