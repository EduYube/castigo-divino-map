name: MAP-018 type one-shot fixer

on:
  push:
    branches:
      - agent/map-018-admin-taxonomy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-018-admin-taxonomy

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('src/app/adminCatalog.ts')
          text = ui.read_text()
          old = "(control) => !control.input.disabled && !control.input.readOnly,"
          new = """(control) =>
                    !control.input.disabled &&
                    (control.input instanceof HTMLSelectElement || !control.input.readOnly),"""
          if old not in text:
              raise SystemExit('Expected admin focus predicate was not found')
          ui.write_text(text.replace(old, new, 1))

          test = Path('src/application/adminCatalogController.test.ts')
          text = test.read_text()
          old_resolver = "let resolveFirst: ((records: readonly AdminCatalogRecord[]) => void) | null = null;"
          new_resolver = "let resolveFirst: (records: readonly AdminCatalogRecord[]) => void = () => undefined;"
          if old_resolver not in text or "resolveFirst?.([category]);" not in text:
              raise SystemExit('Expected concurrent-load test expressions were not found')
          text = text.replace(old_resolver, new_resolver, 1)
          text = text.replace("resolveFirst?.([category]);", "resolveFirst([category]);", 1)
          test.write_text(text)
          PY

      - name: Verify patched sources
        run: |
          npm run format
          npm run lint
          npm run test
          npm run build:pages

      - name: Remove one-shot workflow
        run: rm .github/workflows/map018-type-fix.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MAP-018 — Corregir tipos del foco y prueba concurrente"
          git push origin HEAD:agent/map-018-admin-taxonomy
