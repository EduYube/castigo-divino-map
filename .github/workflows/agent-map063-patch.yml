name: MAP-063 temporary lint patch

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Patch unused catch binding
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'src/app/publicNotes.ts';
          const source = fs.readFileSync(path, 'utf8');
          const target = '    } catch (error) {\n      if (destroyed || request.signal.aborted) return;';
          if (!source.includes(target)) process.exit(2);
          fs.writeFileSync(path, source.replace(target, '    } catch {\n      if (destroyed || request.signal.aborted) return;'));
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/publicNotes.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(notes): remove unused degraded error binding"
          git push origin HEAD:agent/map-063-public-player-notes
