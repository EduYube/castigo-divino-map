name: MAP-061 Format Helper

on:
  push:
    branches:
      - agent/map-061-campaign-regions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-061-campaign-regions
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/map/leaflet.ts
      - run: git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/leaflet.ts
          git commit -m "chore: format MAP-061 review fix"
          git push origin HEAD:agent/map-061-campaign-regions
