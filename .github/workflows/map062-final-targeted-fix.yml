name: MAP-062 final targeted fix

on:
  push:
    branches:
      - agent/map-062-desktop-details-below-map
    paths:
      - .github/workflows/map062-final-targeted-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-062-desktop-details-below-map
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply MAP-062 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text()
          old = """  const keepPinVisibleWithCompactDetails = (): void => {\n    if (!mobileCompactDetailsMedia.matches) {\n      return;\n    }\n\n    const adjustActiveMarker = (attemptsRemaining: number): void => {\n"""
          new = """  const keepPinVisibleWithCompactDetails = (): void => {\n    if (!mobileCompactDetailsMedia.matches) {\n      return;\n    }\n\n    // MAP-037: synchronize Leaflet before the first sheet measurement. Narrow WebKit\n    // otherwise observes stale viewport geometry; desktop never enters this branch.\n    mapController.map.invalidateSize({ animate: false, pan: false });\n\n    const adjustActiveMarker = (attemptsRemaining: number): void => {\n"""
          if old not in text:
              raise SystemExit('main.ts mobile helper anchor not found')
          main.write_text(text.replace(old, new, 1))

          spec = Path('tests/e2e/map062-desktop-details-below-map.spec.ts')
          text = spec.read_text()
          old_path = "const PORTRAIT_PATH = 'portraits/map062-rich-character.png';"
          if old_path not in text:
              raise SystemExit('portrait path anchor not found')
          text = text.replace(
              old_path,
              "const PORTRAIT_PATH = 'portraits/123e4567-e89b-42d3-a456-426614174062.png';",
              1,
          )

          old = """  await page.route('**/rest/v1/**', async (route: Route) => {\n    const resource = new URL(route.request().url()).pathname.split('/rest/v1/')[1] ?? '';\n    if (resource.startsWith('rpc/')) {\n      await route.fulfill({ status: 403, contentType: 'application/json', body: '{}' });\n      return;\n    }\n    const table = resource.split('?')[0] ?? '';\n    const rows = ROWS[table] ?? [];\n    await route.fulfill({\n"""
          new = """  await page.route('**/rest/v1/**', async (route: Route) => {\n    const requestUrl = new URL(route.request().url());\n    const resource = requestUrl.pathname.split('/rest/v1/')[1] ?? '';\n    if (resource.startsWith('rpc/')) {\n      await route.fulfill({ status: 403, contentType: 'application/json', body: '{}' });\n      return;\n    }\n    const table = resource.split('?')[0] ?? '';\n    const requestedFields =\n      requestUrl.searchParams\n        .get('select')\n        ?.split(',')\n        .filter(Boolean) ?? [];\n    const rows = (ROWS[table] ?? []).map((row) =>\n      Object.fromEntries(requestedFields.map((field) => [field, row[field]])),\n    );\n    await route.fulfill({\n"""
          if old not in text:
              raise SystemExit('REST mock anchor not found')
          text = text.replace(old, new, 1)

          read_anchor = """async function readMapView(page: Page): Promise<MapViewState> {\n  const shell = page.getByTestId('map-shell');\n  return {\n    center: (await shell.getAttribute('data-map-center')) ?? '',\n    zoom: (await shell.getAttribute('data-map-zoom')) ?? '',\n  };\n}\n\n"""
          if read_anchor not in text:
              raise SystemExit('readMapView anchor not found')
          text = text.replace(
              read_anchor,
              read_anchor
              + """async function settleLayoutFrames(page: Page): Promise<void> {\n  await page.evaluate(\n    () =>\n      new Promise<void>((resolve) =>\n        requestAnimationFrame(() => requestAnimationFrame(() => resolve())),\n      ),\n  );\n}\n\n""",
              1,
          )

          text = text.replace("  const viewBefore = await readMapView(page);\n", "", 1)
          old = """  await expectDesktopDetailsBelowMap(page, mapBefore?.width ?? 0);\n  expect(await readMapView(page)).toEqual(viewBefore);\n\n"""
          new = """  await expectDesktopDetailsBelowMap(page, mapBefore?.width ?? 0);\n  const viewAfterSelection = await readMapView(page);\n  await settleLayoutFrames(page);\n  expect(await readMapView(page)).toEqual(viewAfterSelection);\n\n"""
          if old not in text:
              raise SystemExit('1440 view assertion anchor not found')
          text = text.replace(old, new, 1)
          old = """  await expect(panel).toBeHidden();\n  await expect(marker).toBeFocused();\n  await expect(marker).toHaveAttribute('aria-pressed', 'false');\n});\n"""
          new = """  await expect(panel).toBeHidden();\n  await expect(marker).toBeFocused();\n  await expect(marker).toHaveAttribute('aria-pressed', 'false');\n  expect(await readMapView(page)).toEqual(viewAfterSelection);\n});\n"""
          if old not in text:
              raise SystemExit('1440 close assertion anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace("  const viewBeforeOpen = await readMapView(page);\n\n", "", 1)
          old = """  const panel = page.getByTestId('place-details');\n  await expectDesktopDetailsBelowMap(page, expandedBefore?.width ?? 0);\n  expect(await readMapView(page)).toEqual(viewBeforeOpen);\n  await expect(page.locator('.map-experience')).toHaveAttribute('data-map-expanded', 'true');\n"""
          new = """  const panel = page.getByTestId('place-details');\n  await expectDesktopDetailsBelowMap(page, expandedBefore?.width ?? 0);\n  const viewAfterFirstSelection = await readMapView(page);\n  await settleLayoutFrames(page);\n  expect(await readMapView(page)).toEqual(viewAfterFirstSelection);\n  await expect(page.locator('.map-experience')).toHaveAttribute('data-map-expanded', 'true');\n"""
          if old not in text:
              raise SystemExit('expanded first selection anchor not found')
          text = text.replace(old, new, 1)

          old = """  await point(page, POINT_B_ID).click();\n  await expect(panel).toHaveCount(1);\n"""
          new = """  const secondPoint = point(page, POINT_B_ID);\n  await secondPoint.focus();\n  await expect(secondPoint).toBeFocused();\n  await page.keyboard.press('Enter');\n  await expect(panel).toHaveCount(1);\n"""
          if old not in text:
              raise SystemExit('point B activation anchor not found')
          text = text.replace(old, new, 1)

          old = """  await expect(\n    panel.getByRole('heading', { level: 3, name: 'MAP062 Second Character' }),\n  ).toBeFocused();\n  await expectUniqueCompactIds(page);\n\n"""
          new = """  await expect(\n    panel.getByRole('heading', { level: 3, name: 'MAP062 Second Character' }),\n  ).toBeFocused();\n  const viewAfterSecondSelection = await readMapView(page);\n  await settleLayoutFrames(page);\n  expect(await readMapView(page)).toEqual(viewAfterSecondSelection);\n  await expectUniqueCompactIds(page);\n\n"""
          if old not in text:
              raise SystemExit('expanded second selection anchor not found')
          text = text.replace(old, new, 1)

          old = """  await toggleExpanded(page, true);\n  await panel.getByRole('button', { name: 'Cerrar la ficha de MAP062 Second Character' }).click();\n  await expect(panel).toBeHidden();\n  await expect(page.locator('.map-experience')).toHaveAttribute('data-map-expanded', 'true');\n});\n"""
          new = """  await toggleExpanded(page, true);\n  const viewBeforeClose = await readMapView(page);\n  await panel.getByRole('button', { name: 'Cerrar la ficha de MAP062 Second Character' }).click();\n  await expect(panel).toBeHidden();\n  await expect(page.locator('.map-experience')).toHaveAttribute('data-map-expanded', 'true');\n  expect(await readMapView(page)).toEqual(viewBeforeClose);\n});\n"""
          if old not in text:
              raise SystemExit('expanded close anchor not found')
          spec.write_text(text.replace(old, new, 1))

          css = Path('src/styles/map062-desktop-details.css')
          text = css.read_text()
          global_button = """.place-details__return {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 2.75rem;\n  min-height: 2.75rem;\n  padding: 0.55rem 0.8rem;\n  color: var(--ink);\n  font-size: 0.78rem;\n  font-weight: 800;\n  line-height: 1.15;\n  text-align: center;\n  cursor: pointer;\n  background: rgba(247, 241, 227, 0.08);\n  border: 1px solid var(--line);\n  border-radius: 0.7rem;\n  touch-action: manipulation;\n}\n\n.place-details__return:hover {\n  color: #172018;\n  background: var(--accent-strong);\n}\n\n"""
          if global_button not in text:
              raise SystemExit('global return button block not found')
          text = text.replace(global_button, '', 1)
          desktop_anchor = "@media (min-width: 48.001rem) {\n"
          desktop_button = """@media (min-width: 48.001rem) {\n  .place-details__return {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    min-width: 2.75rem;\n    min-height: 2.75rem;\n    padding: 0.55rem 0.8rem;\n    color: var(--ink);\n    font-size: 0.78rem;\n    font-weight: 800;\n    line-height: 1.15;\n    text-align: center;\n    cursor: pointer;\n    background: rgba(247, 241, 227, 0.08);\n    border: 1px solid var(--line);\n    border-radius: 0.7rem;\n    touch-action: manipulation;\n  }\n\n  .place-details__return:hover {\n    color: #172018;\n    background: var(--accent-strong);\n  }\n\n"""
          text = text.replace(desktop_anchor, desktop_button, 1)
          forced = """@media (forced-colors: active) {\n  .place-details__return {\n    color: ButtonText;\n    background: ButtonFace;\n    border-color: ButtonText;\n    forced-color-adjust: auto;\n  }\n}\n"""
          if forced not in text:
              raise SystemExit('forced colors block not found')
          text = text.replace(
              forced,
              """@media (forced-colors: active) and (min-width: 48.001rem) {\n  .place-details__return {\n    color: ButtonText;\n    background: ButtonFace;\n    border-color: ButtonText;\n    forced-color-adjust: auto;\n  }\n}\n""",
              1,
          )
          css.write_text(text)
          PY
          npx prettier --write src/main.ts tests/e2e/map062-desktop-details-below-map.spec.ts
      - name: Install targeted Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify MAP-037 narrow WebKit regression
        run: npx playwright test tests/e2e/map037-mobile-details.spec.ts --project=mobile-webkit --grep "320x740"
      - name: Verify MAP-062 suite
        run: npx playwright test tests/e2e/map062-desktop-details-below-map.spec.ts --project=chromium
      - name: Commit verified fixes and remove helper workflows
        run: |
          rm -f .github/workflows/map062-targeted-fix.yml .github/workflows/map062-final-targeted-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/styles/map062-desktop-details.css tests/e2e/map062-desktop-details-below-map.spec.ts .github/workflows/map062-targeted-fix.yml .github/workflows/map062-final-targeted-fix.yml
          git commit -m "fix(map): preserve mobile sheet sync and MAP-062 invariants"
          git push origin HEAD:agent/map-062-desktop-details-below-map
