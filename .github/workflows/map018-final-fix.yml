name: MAP-018 final one-shot fixer

on:
  push:
    branches:
      - agent/map-018-admin-taxonomy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-018-admin-taxonomy

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repository = Path('src/infrastructure/supabase/adminCatalogRepository.ts')
          text = repository.read_text()
          text = text.replace(
              "  const { id: _id, ...body } = draftBody(draft);\n  return body;",
              "  const { id: _id, ...body } = draftBody(draft);\n  void _id;\n  return body;",
              1,
          )
          repository.write_text(text)

          ui = Path('src/app/adminCatalog.ts')
          text = ui.read_text()
          pattern = re.compile(
              r"    addField\(form, controls, \{\n"
              r"      name: 'id',\n"
              r"      label: 'ID estable',\n"
              r"      value: draft\.id,\n"
              r"      required: true,\n"
              r"      readOnly: Boolean\(record\),\n"
              r"    \}\);\n"
              r"    if \(fields\.parentElement !== form\) \{\n"
              r"      fields\.append\(\.\.\.Array\.from\(form\.querySelectorAll\(':scope > \.admin-catalog__field'\)\)\);\n"
              r"    \}"
          )
          replacement = """    const idInput = addField(form, controls, {
              name: 'id',
              label: 'ID estable',
              value: draft.id,
              required: true,
              readOnly: Boolean(record),
            });
            fields.append(idInput.closest('.admin-catalog__field') as HTMLElement);"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one admin ID-field pattern, found {count}')
          ui.write_text(text)
          PY

      - name: Format and lint
        run: |
          npm run format
          npm run lint

      - name: Remove one-shot workflow
        run: rm .github/workflows/map018-final-fix.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MAP-018 — Corregir limpieza del editor y lint restante"
          git push origin HEAD:agent/map-018-admin-taxonomy
