name: MAP-057 format helper

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/map-057-editable-player-dispositions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAP-057 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-057-editable-player-dispositions
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format MAP-057 files
        run: npx prettier --write src/app/adminMapEntities.ts tests/e2e/compact-pin-details.spec.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/adminMapEntities.ts tests/e2e/compact-pin-details.spec.ts
          git commit -m "chore: apply Prettier to MAP-057 files"
          git push origin HEAD:agent/map-057-editable-player-dispositions
