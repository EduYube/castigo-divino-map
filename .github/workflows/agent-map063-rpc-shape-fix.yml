name: MAP-063 temporary final hardening

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final hardening fixes and regressions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const migrationPath = 'supabase/migrations/20260901150000_add_public_player_note_authorship.sql';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          const returnShapeBefore = `returns table (\n  id text,\n  slug text,\n  entity_id text,`;
          const returnShapeAfter = `returns table (\n  id text,\n  entity_id text,`;
          const returnShapeCount = migration.split(returnShapeBefore).length - 1;
          if (returnShapeCount !== 3) throw new Error(`expected three RPC return shapes with slug, found ${returnShapeCount}`);
          migration = migration.split(returnShapeBefore).join(returnShapeAfter);

          const returningBefore = `  returning\n    note.id,\n    note.slug,\n    note.entity_id,`;
          const returningAfter = `  returning\n    note.id,\n    note.entity_id,`;
          const returningCount = migration.split(returningBefore).length - 1;
          if (returningCount !== 3) throw new Error(`expected three RETURNING slug fields, found ${returningCount}`);
          migration = migration.split(returningBefore).join(returningAfter);
          fs.writeFileSync(migrationPath, migration);

          const dbTestPath = 'supabase/tests/database/036_public_player_notes_hardening.test.sql';
          let dbTest = fs.readFileSync(dbTestPath, 'utf8');
          if ((dbTest.split('select plan(11);').length - 1) !== 1) throw new Error('expected plan(11) once');
          dbTest = dbTest.replace('select plan(11);', 'select plan(14);');
          const insertionPoint = `select ok(\n  pg_temp.statement_fails($$select public.create_public_player_note(\n    'entity-aster-guide', 'player-demo-one', 'Title', 'Body', 'master'\n  )$$),\n  'public RPC exposes no extra mass-assignment parameter for Master authorship'\n);\n`;
          if ((dbTest.split(insertionPoint).length - 1) !== 1) throw new Error('expected mass-assignment test once');
          const shapeTests = `${insertionPoint}\nselect ok(\n  pg_catalog.strpos(\n    pg_catalog.pg_get_function_result('public.create_public_player_note(text,text,text,text)'::regprocedure),\n    'slug'\n  ) = 0,\n  'public player RPC response omits the unused slug field rejected by the strict client parser'\n);\nselect ok(\n  pg_catalog.strpos(\n    pg_catalog.pg_get_function_result('public.create_master_public_note(text,text,text)'::regprocedure),\n    'slug'\n  ) = 0,\n  'Master create RPC response matches the strict public note client shape'\n);\nselect ok(\n  pg_catalog.strpos(\n    pg_catalog.pg_get_function_result('public.update_master_public_note(text,text,text,text)'::regprocedure),\n    'slug'\n  ) = 0,\n  'Master update RPC response matches the strict public note client shape'\n);\n`;
          dbTest = dbTest.replace(insertionPoint, () => shapeTests);
          fs.writeFileSync(dbTestPath, dbTest);

          const appPath = 'src/app/publicNotes.ts';
          let app = fs.readFileSync(appPath, 'utf8');
          const retryBefore = `          error.textContent = describeRepositoryError(errorValue);\n          error.focus({ preventScroll: true });\n        })\n        .finally(() => {\n          saving = false;\n        });`;
          const retryAfter = `          error.textContent = describeRepositoryError(errorValue);\n          error.focus({ preventScroll: true });\n        })\n        .finally(() => {\n          saving = false;\n          if (form.isConnected) {\n            form.removeAttribute('aria-busy');\n            save.disabled = false;\n          }\n        });`;
          if ((app.split(retryBefore).length - 1) !== 1) throw new Error('expected recoverable edit finally block once');
          app = app.replace(retryBefore, retryAfter);
          fs.writeFileSync(appPath, app);

          const e2ePath = 'tests/e2e/map063-public-player-notes.spec.ts';
          let e2e = fs.readFileSync(e2ePath, 'utf8');
          const stateBefore = `  online: boolean;\n  admin: boolean;\n  rpcBodies:`;
          const stateAfter = `  online: boolean;\n  admin: boolean;\n  failNextMasterUpdate: boolean;\n  rpcBodies:`;
          if ((e2e.split(stateBefore).length - 1) !== 1) throw new Error('expected BackendState fields once');
          e2e = e2e.replace(stateBefore, stateAfter);

          const initBefore = `    online: options.online ?? true,\n    admin: options.admin ?? false,\n    rpcBodies: [],`;
          const initAfter = `    online: options.online ?? true,\n    admin: options.admin ?? false,\n    failNextMasterUpdate: false,\n    rpcBodies: [],`;
          if ((e2e.split(initBefore).length - 1) !== 1) throw new Error('expected BackendState initializer once');
          e2e = e2e.replace(initBefore, initAfter);

          const updateHandlerBefore = `      if (name === 'update_master_public_note') {\n        const entityId = String(body.p_entity_id ?? '');`;
          const updateHandlerAfter = `      if (name === 'update_master_public_note') {\n        if (state.failNextMasterUpdate) {\n          state.failNextMasterUpdate = false;\n          await route.fulfill({ status: 503, contentType: 'application/json', body: '{}' });\n          return;\n        }\n        const entityId = String(body.p_entity_id ?? '');`;
          if ((e2e.split(updateHandlerBefore).length - 1) !== 1) throw new Error('expected update RPC handler once');
          e2e = e2e.replace(updateHandlerBefore, updateHandlerAfter);

          const testAnchor = `\ntest('stale Master authorization fails closed until the session is revalidated', async ({`;
          if ((e2e.split(testAnchor).length - 1) !== 1) throw new Error('expected stale authorization test anchor once');
          const retryTest = `\ntest('recoverable Master edit failure preserves the draft and allows retry', async ({\n  context,\n  page,\n}) => {\n  const state = await configureBackend(context, { admin: true });\n  await openCampaignA(page);\n\n  const playerNote = page.locator('[data-public-note-id="note-map063-player-a"]');\n  await playerNote.getByRole('button', { name: 'Editar nota Apunte de Skade' }).click();\n  const editForm = playerNote.locator('form');\n  const title = editForm.getByLabel('Título');\n  const body = editForm.getByRole('textbox', { name: 'Nota', exact: true });\n  const save = editForm.getByRole('button', { name: 'Guardar cambios' });\n\n  await title.fill('Apunte recuperable');\n  await body.fill('Este borrador debe sobrevivir a un fallo transitorio.');\n  state.failNextMasterUpdate = true;\n  await save.click();\n\n  await expect(editForm.getByText(/texto se conserva para reintentarlo/i)).toBeVisible();\n  await expect(title).toHaveValue('Apunte recuperable');\n  await expect(body).toHaveValue('Este borrador debe sobrevivir a un fallo transitorio.');\n  await expect(editForm).not.toHaveAttribute('aria-busy', 'true');\n  await expect(save).toBeEnabled();\n\n  await save.click();\n  await expect(\n    page.getByRole('heading', { level: 3, name: 'Apunte recuperable' }),\n  ).toBeVisible();\n});\n`;
          e2e = e2e.replace(testAnchor, `${retryTest}${testAnchor}`);
          fs.writeFileSync(e2ePath, e2e);
          NODE
          npx prettier --write src/app/publicNotes.ts tests/e2e/map063-public-player-notes.spec.ts .github/workflows/agent-map063-rpc-shape-fix.yml
          git diff --check
      - name: Lint and unit tests
        run: |
          npm run lint
          npm run test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run MAP-063 E2E regression suite
        env:
          CI: '1'
        run: npx playwright test tests/e2e/map063-public-player-notes.spec.ts --project=chromium
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Complete remaining database gates
        run: |
          npm run supabase:db:lint
          npm run supabase:db:test
          npm run supabase:db:test:concurrency
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
      - name: Commit validated fixes and remove helper
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+EduYube@users.noreply.github.com"
          git add src/app/publicNotes.ts tests/e2e/map063-public-player-notes.spec.ts supabase/migrations/20260901150000_add_public_player_note_authorship.sql supabase/tests/database/036_public_player_notes_hardening.test.sql
          git rm .github/workflows/agent-map063-rpc-shape-fix.yml
          git commit -m "fix: harden public note write recovery"
          git push origin HEAD:agent/map-063-public-player-notes
