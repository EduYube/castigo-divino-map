name: MAP-055 E2E fixture fix

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch legacy E2E assumptions
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, oldValue, newValue) {
            const text = fs.readFileSync(path, 'utf8');
            if (!text.includes(oldValue)) throw new Error(`Missing expected text in ${path}`);
            fs.writeFileSync(path, text.replace(oldValue, newValue));
          }

          const compact = 'tests/e2e/compact-pin-details.spec.ts';
          replaceOnce(
            compact,
            "const LOCAL_SUPABASE_URL = 'http://127.0.0.1:4173';\n",
            "const LOCAL_SUPABASE_URL = 'http://127.0.0.1:4173';\nconst CAMPAIGN_A_ID = '00000000-0000-4000-8000-000000000053';\n",
          );
          replaceOnce(
            compact,
            "    const table = match?.[1] ?? '';\n    const rows = PUBLIC_ROWS[table] ?? [];\n",
            [
              "    const table = match?.[1] ?? '';",
              '    const rows =',
              "      table === 'campaigns'",
              '        ? [',
              '            {',
              '              id: CAMPAIGN_A_ID,',
              "              slug: 'castigo-divino',",
              "              name: 'Castigo Divino',",
              "              status: 'active',",
              '              display_order: 0,',
              '            },',
              '          ]',
              '        : (PUBLIC_ROWS[table] ?? []);',
              '',
            ].join('\n'),
          );
          let compactText = fs.readFileSync(compact, 'utf8');
          const compactPatterns = [
            ['puerto-de-demostracion', 2],
            ['scout', 1],
          ];
          for (const [slug, expectedCount] of compactPatterns) {
            const oldValue = `/\\?entity=${slug}$/`;
            const count = compactText.split(oldValue).length - 1;
            if (count !== expectedCount) {
              throw new Error(`Expected ${expectedCount} ${slug} URL pattern(s), found ${count}`);
            }
            compactText = compactText.split(oldValue).join(`/\\?entity=${slug}&campaign=castigo-divino$/`);
          }
          fs.writeFileSync(compact, compactText);

          const backend = 'tests/e2e/backend-status.spec.ts';
          replaceOnce(
            backend,
            "  const tag = page.getByRole('checkbox', { name: /Paso de montaña/ });\n  const originalUrl = page.url();\n\n  await expectConnected(status, backend);",
            "  const tag = page.getByRole('checkbox', { name: /Paso de montaña/ });\n\n  await expectConnected(status, backend);",
          );
          replaceOnce(
            backend,
            "  await expect(category).toBeChecked();\n  await expect(tag).toBeChecked();\n\n  backend.setMode('failure');",
            "  await expect(category).toBeChecked();\n  await expect(tag).toBeChecked();\n  const originalUrl = page.url();\n  expect(new URL(originalUrl).searchParams.get('campaign')).toBe('castigo-divino');\n\n  backend.setMode('failure');",
          );
          NODE
      - run: npx prettier --write tests/e2e/compact-pin-details.spec.ts tests/e2e/backend-status.spec.ts .github/workflows/map055-e2e-fixture-fix.yml
      - run: npm run format:check
      - run: npm test
      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/compact-pin-details.spec.ts tests/e2e/backend-status.spec.ts .github/workflows/map055-e2e-fixture-fix.yml
          git commit -m 'MAP-055 align compact detail fixtures with campaigns'
          git push origin HEAD:agent/map-055-public-campaign-runtime
