name: MAP063 temporary upgrade test fixer

on:
  push:
    branches:
      - agent/map-063-public-player-notes
    paths:
      - .github/workflows/map063-upgrade-fix-helper.yml
      - scripts/test-map063-public-note-upgrade.mjs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix SQL helper and format regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test-map063-public-note-upgrade.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'pg_catalog.coalesce(('
          if old not in text:
              raise SystemExit('expected pg_catalog.coalesce occurrence not found')
          path.write_text(text.replace(old, 'coalesce((', 1), encoding='utf-8')
          PY
          npx prettier --write scripts/test-map063-public-note-upgrade.mjs

      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-map063-public-note-upgrade.mjs
          if git diff --cached --quiet; then
            echo 'No correction required.'
            exit 0
          fi
          git commit -m 'fix(map-063): correct upgrade regression'
          git push origin HEAD:agent/map-063-public-player-notes
