name: MAP-055 format diagnostic

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/infrastructure/supabase/masterCatalogRepository.test.ts tests/e2e/campaign-master-mode-stale-response.spec.ts
          git diff -- src/infrastructure/supabase/masterCatalogRepository.test.ts tests/e2e/campaign-master-mode-stale-response.spec.ts
