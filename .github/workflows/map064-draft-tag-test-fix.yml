name: MAP-064 draft tag test correction

on:
  push:
    branches:
      - agent/map-064-mission-hazard-lifecycle
    paths:
      - .github/workflows/map064-draft-tag-test-fix.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0

      - name: Correct baseline-compatible draft tag assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/admin-map-entities.spec.ts')
          text = path.read_text()
          old = "await expect(page.getByLabel(/Draft tag · draft/)).toBeDisabled();"
          new = "await expect(page.getByLabel(/Draft tag · draft/)).toBeEnabled();"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale draft-tag assertion, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Format changed test
        run: npx prettier --write tests/e2e/admin-map-entities.spec.ts

      - name: Remove integration workflow and commit clean tree
        shell: bash
        run: |
          git rm .github/workflows/map064-draft-tag-test-fix.yml
          git add tests/e2e/admin-map-entities.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(map-064): preserve selectable draft references"
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
