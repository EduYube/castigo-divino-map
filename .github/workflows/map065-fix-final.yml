name: MAP-065 final fixes

on:
  push:
    branches:
      - agent/map-065-content-layers

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-065-content-layers
      - name: Apply targeted compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          search = Path('src/app/placeSearch.ts')
          text = search.read_text()
          old = '`No hay resultados visibles para “${query.trim()}” con las capas y filtros actuales.`'
          new = '`No hay lugares, personajes ni nombres geográficos para “${query.trim()}”; tampoco misiones ni peligros.`'
          assert old in text, 'expected MAP-065 no-results copy not found'
          search.write_text(text.replace(old, new, 1))

          master = Path('tests/e2e/map065-master-layers.spec.ts')
          text = master.read_text()
          old_email = "await page.getByLabel('Correo').fill('admin@example.invalid');"
          new_email = "await page.locator('input[type=\"email\"]').fill('admin@example.invalid');"
          old_password = "await page.getByLabel('Contraseña').fill('correct horse battery staple');"
          new_password = "await page.locator('input[type=\"password\"]').fill('correct horse battery staple');"
          assert old_email in text, 'expected email locator not found'
          assert old_password in text, 'expected password locator not found'
          master.write_text(text.replace(old_email, new_email, 1).replace(old_password, new_password, 1))
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git rm .github/workflows/map065-fix-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/placeSearch.ts tests/e2e/map065-master-layers.spec.ts
          git commit -m "test(map): fix MAP-065 E2E compatibility"
          git push origin HEAD:agent/map-065-content-layers
