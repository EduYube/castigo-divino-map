name: MAP-052 snapshot refresh helper

on:
  push:
    branches:
      - agent/map-052-snapshot-sync
    paths:
      - .github/workflows/map-052-snapshot-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Generate and commit current public snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout snapshot sync branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-052-snapshot-sync

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot from published Supabase data
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: npm run snapshot:generate

      - name: Verify generated snapshot against Supabase
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: npm run snapshot:verify:remote

      - name: Commit generated snapshot
        run: |
          if git diff --quiet -- public/data/public-catalog.snapshot.json; then
            echo "Snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/public-catalog.snapshot.json
          git commit -m "chore: sync public snapshot with production"
          git push origin HEAD:agent/map-052-snapshot-sync
