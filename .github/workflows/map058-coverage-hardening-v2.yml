name: MAP-058 temporary coverage hardening v2

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  harden:
    name: Harden MAP-058 acceptance and security coverage v2
    if: github.head_ref == 'agent/map-058-player-associations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MAP-058 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-058-player-associations

      - name: Add missing regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/map058-player-associations.spec.ts')
          source = path.read_text()
          old = "  await expect(details).toContainText('Relación con los personajes');\n});\n"
          new = """  await expect(details).toContainText('Relación con los personajes');

            const fullAction = details.getByRole('link', { name: /Abrir ficha completa/ });
            const fullHref = await fullAction.getAttribute('href');
            await page.goto(fullHref ?? '/');
            await expect(
              page.getByRole('heading', { level: 2, name: 'Relacionado con' }),
            ).toBeVisible();
            await expect(page.locator('.full-entity__associations')).toContainText('Skade');
          });
          """
          if old not in source:
            raise SystemExit('MAP-058 full-details anchor not found')
          path.write_text(source.replace(old, new, 1))

          path = Path('tests/e2e/master-mode.spec.ts')
          source = path.read_text()
          old = "    players: [],\n    dispositions: [],\n    associations: [],\n"
          new = """    players:
                audience === 'master'
                  ? [{ id: 'player-skade', display_name: 'Skade', accent_color: '#c2410c' }]
                  : [],
              dispositions: [],
              associations:
                audience === 'master'
                  ? [{ entity_id: MASTER_ID, player_id: 'player-skade' }]
                  : [],
          """
          if old not in source:
            raise SystemExit('Master catalog fixture anchor not found')
          source = source.replace(old, new, 1)
          old = "  await expect(privateMarker).toHaveAttribute('data-portrait-marker', 'true');\n"
          new = """  await expect(privateMarker).toHaveAttribute('data-portrait-marker', 'true');
            await expect(privateMarker).toHaveAttribute('data-association-count', '1');
            await expect(privateMarker).toHaveAttribute('aria-description', /Relacionado con: Skade\\./);
            await expect(privateMarker.locator('.pin-player-association-ring')).toHaveCSS(
              '--pin-player-association-accent',
              '#c2410c',
            );
          """
          if old not in source:
            raise SystemExit('Master marker assertion anchor not found')
          path.write_text(source.replace(old, new, 1))

          path = Path('tests/e2e/admin-map-entities.spec.ts')
          source = path.read_text()
          old = "  getSaveCount(): number;\n  getStoredPortraits(): readonly string[];\n"
          new = "  getSaveCount(): number;\n  getLastAssociationIds(): readonly string[];\n  getStoredPortraits(): readonly string[];\n"
          if old not in source:
            raise SystemExit('BackendControl interface anchor not found')
          source = source.replace(old, new, 1)
          old = "  let counter = 10;\n  let saveCount = 0;\n  const storedPortraits = new Set<string>();\n"
          new = "  let counter = 10;\n  let saveCount = 0;\n  let lastAssociationIds: string[] = [];\n  const storedPortraits = new Set<string>();\n"
          if old not in source:
            raise SystemExit('Backend state anchor not found')
          source = source.replace(old, new, 1)
          old = "      dispositions.set(id, nextDispositions);\n      saveCount += 1;\n"
          new = """      dispositions.set(id, nextDispositions);
                lastAssociationIds = Array.isArray(body.p_player_association_ids)
                  ? body.p_player_association_ids.map(String)
                  : [];
                saveCount += 1;
          """
          if old not in source:
            raise SystemExit('Admin save payload anchor not found')
          source = source.replace(old, new, 1)
          old = "    getSaveCount(): number {\n      return saveCount;\n    },\n    getStoredPortraits(): readonly string[] {\n"
          new = """    getSaveCount(): number {
                  return saveCount;
                },
                getLastAssociationIds(): readonly string[] {
                  return [...lastAssociationIds];
                },
                getStoredPortraits(): readonly string[] {
          """
          if old not in source:
            raise SystemExit('BackendControl return anchor not found')
          source = source.replace(old, new, 1)
          old = "  await expect(veyra).toHaveAttribute('aria-label', 'Veyra: Neutral');\n  await skade.focus();\n"
          new = """  await expect(veyra).toHaveAttribute('aria-label', 'Veyra: Neutral');

            const skadeAssociation = page.getByTestId('admin-player-association-player-skade');
            const uraAssociation = page.getByTestId('admin-player-association-player-ura');
            await expect(skadeAssociation).toBeVisible();
            await expect(uraAssociation).toBeVisible();
            await expect(page.getByRole('group', { name: 'Relacionado con' })).toBeVisible();
            const skadeAccent = await skadeAssociation.evaluate((checkbox) =>
              checkbox.parentElement
                ?.querySelector<HTMLElement>('.admin-map-entity__association-accent')
                ?.style.getPropertyValue('--player-association-accent'),
            );
            expect(skadeAccent).toBe('#c2410c');
            await skadeAssociation.check();
            await uraAssociation.check();

            await skade.focus();
          """
          if old not in source:
            raise SystemExit('Admin association UI anchor not found')
          source = source.replace(old, new, 1)
          old = "  expect(backend.getEntity('entity-map019-character')?.publication_status).toBe('draft');\n"
          new = """  expect(backend.getEntity('entity-map019-character')?.publication_status).toBe('draft');
            expect(backend.getLastAssociationIds()).toEqual(['player-skade', 'player-ura']);
          """
          if old not in source:
            raise SystemExit('Admin association save assertion anchor not found')
          path.write_text(source.replace(old, new, 1))

          path = Path('supabase/tests/database/030_entity_player_associations.test.sql')
          source = path.read_text()
          if 'select plan(21);' not in source:
            raise SystemExit('MAP-058 pgTAP plan anchor not found')
          source = source.replace('select plan(21);', 'select plan(23);', 1)
          old = """select ok(
            pg_temp.statement_fails($sql$
              select public.admin_get_map_entity_editor_v5(
                '00000000-0000-4000-8000-000000000580', 'entity-map058-public-a'
              )
            $sql$),
            'authenticated non-admin cannot inspect the association editor payload'
          );
          """
          new = """select is(
            (select count(*) from public.entity_player_associations where entity_id = 'entity-map058-master-a'),
            0::bigint,
            'authenticated non-admin cannot infer Master associations through direct table reads'
          );
          select ok(
            pg_temp.statement_fails($sql$
              select public.admin_get_map_entity_editor_v5(
                '00000000-0000-4000-8000-000000000580', 'entity-map058-public-a'
              )
            $sql$),
            'authenticated non-admin cannot inspect the association editor payload'
          );
          select ok(
            pg_temp.statement_fails($sql$
              select public.admin_get_master_catalog_v4('00000000-0000-4000-8000-000000000580')
            $sql$),
            'authenticated non-admin cannot inspect the private Master association catalog'
          );
          """
          if old not in source:
            raise SystemExit('MAP-058 security anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit regression coverage
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No coverage changes remain."
            exit 0
          fi
          git config user.name "Eduardo Yubero Lavandeira"
          git config user.email "33625448+EduYube@users.noreply.github.com"
          git add tests/e2e/map058-player-associations.spec.ts tests/e2e/master-mode.spec.ts tests/e2e/admin-map-entities.spec.ts supabase/tests/database/030_entity_player_associations.test.sql
          git commit -m "MAP-058 harden acceptance and security coverage"
          git push origin HEAD:agent/map-058-player-associations
