name: MAP-058 temporary master association fixture fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  fix:
    if: github.head_ref == 'agent/map-058-player-associations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MAP-058 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-058-player-associations

      - name: Repair Master association E2E fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/master-mode.spec.ts')
          source = path.read_text()

          constants_anchor = "const MASTER_NAME = 'MAP044 E2E SECRET';\n"
          constants = """const MASTER_NAME = 'MAP044 E2E SECRET';
          const MASTER_ASSOCIATION_PLAYER_ID = 'player-map044-e2e';
          const MASTER_ASSOCIATION_PLAYER_NAME = 'MAP044 E2E Player';
          const MASTER_ASSOCIATION_PLAYER_ACCENT = '#c2410c';
          """
          if 'MASTER_ASSOCIATION_PLAYER_ID' not in source:
            if constants_anchor not in source:
              raise SystemExit('Master constants anchor not found')
            source = source.replace(constants_anchor, constants, 1)

          project_anchor = "  const entries = [...fixtureRows] as Record<string, unknown>[];\n"
          project_insert = """  const entries = [...fixtureRows] as Record<string, unknown>[];
          if (table === 'players') {
            entries.push({
              id: MASTER_ASSOCIATION_PLAYER_ID,
              slug: 'map044-e2e-player',
              display_name: MASTER_ASSOCIATION_PLAYER_NAME,
              name_language: 'en',
              accent_color: MASTER_ASSOCIATION_PLAYER_ACCENT,
              publication_status: 'published',
            });
          }
          """
          if "slug: 'map044-e2e-player'" not in source:
            if project_anchor not in source:
              raise SystemExit('Public player projection anchor not found')
            source = source.replace(project_anchor, project_insert, 1)

          source = source.replace(
            "? [{ id: 'player-skade', display_name: 'Skade', accent_color: '#c2410c' }]",
            "? [{ id: MASTER_ASSOCIATION_PLAYER_ID, display_name: MASTER_ASSOCIATION_PLAYER_NAME, accent_color: MASTER_ASSOCIATION_PLAYER_ACCENT }]",
          )
          source = source.replace(
            "? [{ entity_id: MASTER_ID, player_id: 'player-skade' }]",
            "? [{ entity_id: MASTER_ID, player_id: MASTER_ASSOCIATION_PLAYER_ID }]",
          )
          source = source.replace(
            "await expect(privateMarker).toHaveAttribute('aria-description', /Relacionado con: Skade\\./);",
            "await expect(privateMarker).toHaveAttribute(\n    'aria-description',\n    new RegExp(`Relacionado con: ${MASTER_ASSOCIATION_PLAYER_NAME}\\\\.`),\n  );",
          )
          source = source.replace(
            "    '#c2410c',\n  );",
            "    MASTER_ASSOCIATION_PLAYER_ACCENT,\n  );",
            1,
          )

          path.write_text(source)
          PY
          npx prettier --write --end-of-line auto tests/e2e/master-mode.spec.ts

      - name: Commit fixture repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Fixture already repaired."
            exit 0
          fi
          git config user.name "Eduardo Yubero Lavandeira"
          git config user.email "33625448+EduYube@users.noreply.github.com"
          git add tests/e2e/master-mode.spec.ts
          git commit -m "MAP-058 repair Master association E2E fixture"
          git push origin HEAD:agent/map-058-player-associations
