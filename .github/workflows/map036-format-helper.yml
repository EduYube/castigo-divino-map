name: MAP-036 Format Helper

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format-map036:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format MAP-036 spec
        run: npx prettier --write tests/e2e/map036-contextual-help.spec.ts
      - name: Upload formatted spec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: map036-prettier-output
          path: tests/e2e/map036-contextual-help.spec.ts
          retention-days: 1
