name: MAP-063 temporary E2E fix

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply and format E2E corrections
        run: |
          node scripts/agent-map063-e2e-fix.mjs
          npx prettier --write tests/e2e/map063-public-player-notes.spec.ts
          npx prettier --check tests/e2e/map063-public-player-notes.spec.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/map063-public-player-notes.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(e2e): align MAP-063 fixtures with current contracts"
          git push origin HEAD:agent/map-063-public-player-notes
