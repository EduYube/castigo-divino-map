name: MAP-055 branch formatter

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier contract
        run: >-
          npx prettier --write --end-of-line auto
          "src/**/*.{ts,js,json}"
          "public/**/*.json"
          "tests/**/*.ts"
          "scripts/**/*.{mjs,mts}"
          "*.{js,mjs,ts,json,html}"
          ".github/**/*.yml"
      - name: Commit formatting-only result
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "MAP-055 format runtime changes"
          git push origin HEAD:agent/map-055-public-campaign-runtime
