name: MAP-040 snapshot formatter

on:
  push:
    branches:
      - agent/map-040-spanish-geographic-names
    paths:
      - .github/workflows/map040-format-snapshot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAP-040 branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-040-spanish-geographic-names
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Format snapshot with the pinned repository toolchain
        shell: bash
        run: |
          npm ci
          npx prettier --write public/data/public-catalog.snapshot.json
          rm .github/workflows/map040-format-snapshot.yml
      - name: Commit final formatted snapshot
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/public-catalog.snapshot.json .github/workflows/map040-format-snapshot.yml
          git commit -m "chore(map-040): format regenerated public snapshot"
          git push origin HEAD:agent/map-040-spanish-geographic-names
