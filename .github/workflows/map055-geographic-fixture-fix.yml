name: MAP-055 geographic fixture fix

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch geographic public campaign roster
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/e2e/geographic-search.spec.ts';
          let text = fs.readFileSync(path, 'utf8');
          const oldValue = "    const table = match?.[1] ?? '';\n    const rows = PUBLIC_ROWS[table] ?? [];\n";
          const newValue = [
            "    const table = match?.[1] ?? '';",
            '    const rows =',
            "      table === 'campaigns'",
            '        ? [',
            '            {',
            '              id: INITIAL_CAMPAIGN_ID,',
            "              slug: 'castigo-divino',",
            "              name: 'Castigo Divino',",
            "              status: 'active',",
            '              display_order: 0,',
            '            },',
            '          ]',
            '        : (PUBLIC_ROWS[table] ?? []);',
            '',
          ].join('\n');
          if (!text.includes(oldValue)) throw new Error('Expected geographic fixture pattern not found');
          text = text.replace(oldValue, newValue);
          fs.writeFileSync(path, text);
          NODE
      - run: npx prettier --write tests/e2e/geographic-search.spec.ts .github/workflows/map055-geographic-fixture-fix.yml
      - run: npm run format:check
      - run: npm test
      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/geographic-search.spec.ts .github/workflows/map055-geographic-fixture-fix.yml
          git commit -m 'MAP-055 align geographic search fixture with campaigns'
          git push origin HEAD:agent/map-055-public-campaign-runtime
