name: MAP-054 snapshot format

on:
  push:
    branches:
      - hotfix/map-054-public-snapshot

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: hotfix/map-054-public-snapshot

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format snapshot
        run: npx prettier --write public/data/public-catalog.snapshot.json

      - name: Verify formatting and snapshot
        run: |
          npm run format:check
          npm run snapshot:verify

      - name: Verify snapshot against production Supabase
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: npm run snapshot:verify:remote

      - name: Commit formatted snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/public-catalog.snapshot.json
          git diff --cached --exit-code && exit 0
          git commit -m 'style: format MAP-054 public snapshot'
          git push origin HEAD:hotfix/map-054-public-snapshot
