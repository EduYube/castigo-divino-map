name: MAP-058 temporary branch patch

on:
  push:
    branches:
      - agent/map-058-player-associations

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[map058-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAP-058 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-058-player-associations

      - name: Patch the existing entity editor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/adminMapEntities.ts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import '../styles/admin-map-entities.css';",
              "import '../styles/admin-map-entities.css';\nimport '../styles/admin-entity-player-associations.css';",
          )

          replace_once(
              "  let tagCheckboxes: HTMLInputElement[] = [];\n  let dispositionSelects: HTMLSelectElement[] = [];",
              "  let tagCheckboxes: HTMLInputElement[] = [];\n  let associationCheckboxes: HTMLInputElement[] = [];\n  let dispositionSelects: HTMLSelectElement[] = [];",
          )

          replace_once(
              "  let tagError: HTMLParagraphElement | null = null;\n  let dispositionError: HTMLParagraphElement | null = null;",
              "  let tagError: HTMLParagraphElement | null = null;\n  let associationError: HTMLParagraphElement | null = null;\n  let dispositionError: HTMLParagraphElement | null = null;",
          )

          replace_once(
              "      dispositions: [\n        ...dispositionSelects.map((select) => ({\n          playerId: select.dataset.playerId ?? '',\n          disposition: select.value as PlayerDisposition,\n        })),\n        ...preservedDispositions,\n      ],\n      publicationStatus,",
              "      dispositions: [\n        ...dispositionSelects.map((select) => ({\n          playerId: select.dataset.playerId ?? '',\n          disposition: select.value as PlayerDisposition,\n        })),\n        ...preservedDispositions,\n      ],\n      playerAssociationIds: associationCheckboxes\n        .filter((checkbox) => checkbox.checked)\n        .map((checkbox) => checkbox.value),\n      publicationStatus,",
          )

          replace_once(
              "    if (tagError) tagError.textContent = validation.fieldErrors.tagIds ?? '';\n    if (dispositionError) {",
              "    if (tagError) tagError.textContent = validation.fieldErrors.tagIds ?? '';\n    if (associationError) {\n      const message = validation.fieldErrors.playerAssociationIds ?? '';\n      associationError.textContent = message;\n      associationCheckboxes.forEach((checkbox) =>\n        checkbox.setAttribute('aria-invalid', message ? 'true' : 'false'),\n      );\n    }\n    if (dispositionError) {",
          )

          replace_once(
              "    tagCheckboxes = [];\n    dispositionSelects = [];\n    preservedDispositions = [];\n    tagError = null;\n    dispositionError = null;",
              "    tagCheckboxes = [];\n    associationCheckboxes = [];\n    dispositionSelects = [];\n    preservedDispositions = [];\n    tagError = null;\n    associationError = null;\n    dispositionError = null;",
          )

          insertion = """
    const associationFieldset = createElement(
      'fieldset',
      'admin-map-entity__fieldset admin-map-entity__associations',
    );
    const associationLegend = createElement('legend', 'admin-map-entity__legend');
    const associationHelp = createElement('p', 'admin-map-entity__help');
    const associationHelpId = 'admin-map-entity-associations-help';
    const associationErrorId = 'admin-map-entity-associations-error';
    associationLegend.textContent = 'Relacionado con';
    associationHelp.id = associationHelpId;
    associationHelp.textContent =
      'Asociación narrativa independiente de Aliado, Neutral o Enemigo. Puedes seleccionar cero, uno o varios personajes activos de esta campaña.';
    associationFieldset.setAttribute(
      'aria-describedby',
      `${associationHelpId} ${associationErrorId}`,
    );
    associationFieldset.append(associationLegend, associationHelp);
    associationError = createElement('p', 'admin-map-entity__field-error');
    associationError.id = associationErrorId;
    associationError.setAttribute('aria-live', 'polite');

    if (activePlayers.length === 0) {
      const noPlayers = createElement('p', 'admin-map-entity__help');
      noPlayers.textContent = 'No hay personajes jugadores activos en esta campaña.';
      associationFieldset.append(noPlayers);
    }

    for (const player of activePlayers) {
      const row = createElement('label', 'admin-map-entity__association-option');
      const checkbox = document.createElement('input');
      const accent = createElement('span', 'admin-map-entity__association-accent');
      const text = document.createElement('span');
      const id = `admin-map-entity-association-${player.id}`;
      checkbox.id = id;
      checkbox.type = 'checkbox';
      checkbox.value = player.id;
      checkbox.checked = draft.playerAssociationIds.includes(player.id);
      checkbox.setAttribute('data-testid', `admin-player-association-${player.id}`);
      checkbox.setAttribute('aria-describedby', `${associationHelpId} ${associationErrorId}`);
      accent.style.setProperty('--player-association-accent', player.accentColor);
      accent.setAttribute('aria-hidden', 'true');
      text.textContent = player.displayName;
      row.append(checkbox, accent, text);
      associationFieldset.append(row);
      associationCheckboxes.push(checkbox);
    }
    associationFieldset.append(associationError);
    fields.append(associationFieldset);

"""
          marker = "    const dispositionFieldset = createElement(\n"
          if text.count(marker) != 1:
              raise SystemExit('Could not locate disposition fieldset insertion point')
          text = text.replace(marker, insertion + marker, 1)

          replace_once(
              "      ...tagCheckboxes,\n      ...dispositionSelects,",
              "      ...tagCheckboxes,\n      ...associationCheckboxes,\n      ...dispositionSelects,",
          )

          path.write_text(text)
          PY

      - name: Install formatter
        run: npm ci

      - name: Format repository changes
        run: npm run format

      - name: Commit patched editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "MAP-058 integrate player association editor [map058-autofix]"
          git push origin HEAD:agent/map-058-player-associations
