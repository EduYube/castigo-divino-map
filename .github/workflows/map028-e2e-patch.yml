name: MAP-028 temporary E2E patch

on:
  push:
    branches:
      - agent/map-028-static-catalog-migration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-028-static-catalog-migration
      - name: Align E2E expectations with the Beta 0.2 snapshot fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('tests/e2e/app.spec.ts')
          app = app_path.read_text()
          app = replace_once(app, "await expect(panel).toHaveAttribute('data-detail-source', 'beta01');", "await expect(panel).toHaveAttribute('data-detail-source', 'beta02');", 'app detail source')
          app = replace_once(app, """  await expect(panel.getByRole('button', { name: 'Abrir ficha completa' })).toBeDisabled();
          await expect(panel).toContainText(
            'Esta entidad no dispone de una ficha completa pública en Beta 0.2.',
          );""", """  const fullAction = panel.getByRole('link', {
            name: 'Abrir ficha completa de Puerto de demostración en una pestaña nueva',
          });
          await expect(fullAction).toBeVisible();
          await expect(fullAction).toHaveAttribute('href', /\\?entity=puerto-de-demostracion$/);""", 'app desktop full-details action')
          app = replace_once(app, "await expect(panel.getByRole('button', { name: 'Abrir ficha completa' })).toBeVisible();", """await expect(
            panel.getByRole('link', {
              name: 'Abrir ficha completa de Puerto de demostración en una pestaña nueva',
            }),
          ).toBeVisible();""", 'app mobile full-details action')
          app_path.write_text(app)

          compact_path = Path('tests/e2e/compact-pin-details.spec.ts')
          compact = compact_path.read_text()
          compact = replace_once(compact, "test('falls back to a compact Beta 0.1 card offline without inventing a full URL', async ({", "test('falls back to a compact Beta 0.2 snapshot card offline with a safe full URL', async ({", 'compact fallback title')
          compact = replace_once(compact, "await expect(panel).toHaveAttribute('data-detail-source', 'beta01');", "await expect(panel).toHaveAttribute('data-detail-source', 'beta02');", 'compact detail source')
          compact = replace_once(compact, """  const fullAction = panel.getByRole('button', { name: 'Abrir ficha completa' });
          await expect(fullAction).toBeDisabled();
          await expect(panel).toContainText(
            'Esta entidad no dispone de una ficha completa pública en Beta 0.2.',
          );""", """  const fullAction = panel.getByRole('link', {
            name: 'Abrir ficha completa de Puerto de demostración en una pestaña nueva',
          });
          await expect(fullAction).toBeVisible();
          await expect(fullAction).toHaveAttribute('target', '_blank');
          await expect(fullAction).toHaveAttribute('rel', /noopener/);
          await expect(fullAction).toHaveAttribute('href', /\\?entity=puerto-de-demostracion$/);""", 'compact full-details action')
          compact_path.write_text(compact)

          full_path = Path('tests/e2e/full-entity-details.spec.ts')
          full = full_path.read_text()
          full = replace_once(full, """test('fails closed when the remote projection is unavailable', async ({ context, page }) => {
            await configureRuntime(context, { available: false });
            await page.goto('/?entity=puerto-de-demostracion');

            await expect(
              page.getByRole('heading', { level: 1, name: 'Entidad no disponible' }),
            ).toBeVisible();
            await expect(page.locator('[data-backend-status]')).toHaveAttribute(
              'data-backend-state',
              /degraded|offline/,
            );
            await expect(page.getByText('Resumen público del puerto.')).toHaveCount(0);
          });""", """test('keeps full details available from the Beta 0.2 snapshot when the remote projection is unavailable', async ({
            context,
            page,
          }) => {
            await configureRuntime(context, { available: false });
            await page.goto('/?entity=puerto-de-demostracion');

            await expect(
              page.getByRole('heading', { level: 1, name: 'Puerto de demostración' }),
            ).toBeVisible();
            await expect(page.locator('[data-backend-status]')).toHaveAttribute(
              'data-backend-state',
              /degraded|offline/,
            );
            await expect(page.getByText('Puerto de ejemplo')).toBeVisible();
            await expect(page.getByText('Información pública de demostración')).toBeVisible();
            await expect(page.getByText('Costero', { exact: true })).toBeVisible();
            await expect(page.getByText('Resumen público del puerto.')).toHaveCount(0);
            await expect(
              page.getByRole('heading', { level: 1, name: 'Entidad no disponible' }),
            ).toHaveCount(0);
          });""", 'full-details offline fallback')
          full_path.write_text(full)
          PY
          npx prettier --write tests/e2e/app.spec.ts tests/e2e/compact-pin-details.spec.ts tests/e2e/full-entity-details.spec.ts
          git diff --check
      - name: Commit focused E2E correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/app.spec.ts tests/e2e/compact-pin-details.spec.ts tests/e2e/full-entity-details.spec.ts
          git commit -m "MAP-028 — alinear E2E con fallback Beta 0.2"
          git push origin HEAD:agent/map-028-static-catalog-migration
