name: MAP-019 one-shot format

on:
  push:
    branches:
      - agent/map-019-pin-crud

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-019-pin-crud
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final MAP-019 cleanup
        shell: python
        run: |
          from pathlib import Path
          import json

          ui_path = Path('src/app/adminMapEntities.ts')
          ui = ui_path.read_text()
          ui = ui.replace(
              "const first = Array.from(controls.values()).find(({ input }) => !input.readOnly && !input.disabled);",
              """const first = Array.from(controls.values()).find(
                ({ input }) =>
                  !input.disabled &&
                  (!(
                    input instanceof HTMLInputElement || input instanceof HTMLTextAreaElement
                  ) ||
                    !input.readOnly),
              );""",
          )
          ui = ui.replace(
              """const desiredEditorKey = state.creating
              ? `new:${requestedEntityType}`
              : state.editorDetail
                ? state.editorDetail.record.id
                : null;""",
              """const desiredEditorKey = state.creating
              ? `new:${requestedEntityType}`
              : state.editorDetail
                ? `${state.editorDetail.record.id}:${state.editorDetail.record.updatedAt}`
                : null;""",
          )
          ui_path.write_text(ui)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['format:check'] = (
              'prettier --check "src/**/*.{ts,json}" "public/**/*.json" '
              '"tests/**/*.ts" "scripts/**/*.{mjs,mts}" "*.{js,mjs,ts,json,html}" '
              '".github/**/*.yml"'
          )
          package_path.write_text(json.dumps(package, indent=2) + '\n')
      - name: Format tracked sources
        run: npm run format
      - name: Commit cleanup only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src public tests scripts package.json '*.js' '*.mjs' '*.ts' '*.json' '*.html' .github
          git commit -m "MAP-019 finalize formatting and editor safety"
          git push origin HEAD:agent/map-019-pin-crud
