name: MAP-019 one-shot format

on:
  push:
    branches:
      - agent/map-019-pin-crud

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-019-pin-crud
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format tracked sources
        run: npm run format
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src public tests scripts '*.js' '*.mjs' '*.ts' '*.json' '*.html' .github
          git commit -m "MAP-019 apply project formatting"
          git push origin HEAD:agent/map-019-pin-crud
