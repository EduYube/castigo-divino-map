name: MAP-055 unit contract fix

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Finish v3 unit adaptation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/snapshot/publicCatalogSnapshot.test.ts')
          text = path.read_text()
          old = """  const geographicNames = catalog.geographicNames.map(\n    ({ entityId: _entityId, ...geographicName }) => geographicName,\n  );\n"""
          new = """  const geographicNames = catalog.geographicNames.map((geographicName) => ({\n    id: geographicName.id,\n    slug: geographicName.slug,\n    name: geographicName.name,\n    language: geographicName.language,\n    aliases: geographicName.aliases,\n    coordinates: geographicName.coordinates,\n    searchExtent: geographicName.searchExtent,\n    recommendedZoom: geographicName.recommendedZoom,\n  }));\n"""
          if old not in text:
              raise SystemExit('global geography test target not found')
          text = text.replace(old, new, 1)
          old = """    const projected = await projectPublicCatalogSnapshotV3ToV2(\n      loaded.data.catalog,\n      INITIAL_PUBLIC_CAMPAIGN_ID,\n      () => generatedAt,\n    );\n    expect(projected.entities).toEqual(legacySnapshot.entities);\n    expect(projected.geographicNames).toEqual(legacySnapshot.geographicNames);\n"""
          new = """    const projected = projectPublicCatalogSnapshotV3ToV2(\n      loaded.data.catalog,\n      INITIAL_PUBLIC_CAMPAIGN_ID,\n    );\n    expect(projected?.entities).toEqual(legacySnapshot.entities);\n    expect(projected?.geographicNames).toEqual(legacySnapshot.geographicNames);\n"""
          if old not in text:
              raise SystemExit('projection call target not found')
          text = text.replace(old, new, 1)
          old = """      schemaVersion: 1,\n      generatedAt: snapshot.generatedAt,\n"""
          new = """      schemaVersion: 1,\n      contract: 'beta01',\n      generatedAt: snapshot.generatedAt,\n"""
          if old not in text:
              raise SystemExit('beta01 contract target not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/infrastructure/supabase/publicCatalogRepository.test.ts')
          text = path.read_text()
          old = "expect(campaignUrl?.searchParams.get('status')).toBe('eq.active');"
          new = "expect(campaignUrl?.searchParams.has('status')).toBe(false);"
          if old not in text:
              raise SystemExit('campaign RLS expectation target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed tests
        run: npx prettier --write src/infrastructure/snapshot/publicCatalogSnapshot.test.ts src/infrastructure/supabase/publicCatalogRepository.test.ts
      - name: Validate unit suite
        run: npm test
      - name: Commit validated unit contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/snapshot/publicCatalogSnapshot.test.ts src/infrastructure/supabase/publicCatalogRepository.test.ts
          git commit -m "MAP-055 validate multicampaign unit contract"
          git push origin HEAD:agent/map-055-public-campaign-runtime
