name: MAP-058 temporary runtime contract fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  fix:
    name: Apply MAP-058 runtime contract fixes
    if: github.head_ref == 'agent/map-058-player-associations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MAP-058 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-058-player-associations

      - name: Apply proven fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          association = Path('src/app/adminEntityPlayerAssociations.ts')
          source = association.read_text()
          old_config = """function projectUrl(): string | null {
            const value = import.meta.env.VITE_SUPABASE_URL?.trim();
            return value ? value.replace(/\\/$/, '') : null;
          }

          function publishableKey(): string | null {
            const value = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim();
            return value || null;
          }
          """
          new_config = """function projectUrl(): string | null {
            const value =
              (import.meta.env.DEV ? window.__MAP017_AUTH_TEST_CONFIG__?.projectUrl : undefined) ??
              import.meta.env.VITE_SUPABASE_URL;
            const normalized = value?.trim();
            return normalized ? normalized.replace(/\\/$/, '') : null;
          }

          function publishableKey(): string | null {
            const value =
              (import.meta.env.DEV ? window.__MAP017_AUTH_TEST_CONFIG__?.publishableKey : undefined) ??
              import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY;
            return value?.trim() || null;
          }
          """
          if old_config not in source:
            raise SystemExit('expected association configuration block not found')
          source = source.replace(old_config, new_config, 1)

          unavailable = """function unavailableAssociationSaveResponse(): Response {
            return new Response(
              JSON.stringify({
                code: 'MAP058_ASSOCIATIONS_UNAVAILABLE',
                message:
                  'Las asociaciones con jugadores no están disponibles todavía. Recarga el editor antes de guardar.',
              }),
              {
                status: 409,
                headers: { 'Content-Type': 'application/json' },
              },
            );
          }

          """
          if unavailable not in source:
            raise SystemExit('expected unavailable-save helper not found')
          source = source.replace(unavailable, '', 1)
          guard = """        if (body.p_expected_updated_at != null) {
                    return unavailableAssociationSaveResponse();
                  }
          """
          if guard not in source:
            raise SystemExit('expected unavailable-save guard not found')
          source = source.replace(guard, '', 1)
          association.write_text(source)

          roster = Path('tests/e2e/map054-campaign-roster.spec.ts')
          source = roster.read_text()
          source = source.replace(
              "const publicPlayerSelect = 'id,slug,display_name,name_language';",
              "const publicPlayerSelect = 'id,slug,display_name,name_language,accent_color';",
              1,
          )
          old_projection = """              display_name: player.display_name,
                        name_language: player.name_language,
          """
          new_projection = """              display_name: player.display_name,
                        name_language: player.name_language,
                        accent_color: player.accent_color,
          """
          if old_projection not in source:
            raise SystemExit('expected MAP-054 public player projection not found')
          source = source.replace(old_projection, new_projection, 1)
          roster.write_text(source)
          PY

      - name: Commit runtime contract alignment
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No runtime contract changes remain."
            exit 0
          fi
          git config user.name "Eduardo Yubero Lavandeira"
          git config user.email "33625448+EduYube@users.noreply.github.com"
          git add src/app/adminEntityPlayerAssociations.ts tests/e2e/map054-campaign-roster.spec.ts
          git commit -m "MAP-058 fix association hydration save race"
          git push origin HEAD:agent/map-058-player-associations
