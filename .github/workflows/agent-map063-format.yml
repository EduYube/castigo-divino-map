name: MAP-063 temporary formatter

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format MAP-063 sources
        run: npx prettier --write src/app/publicNotes.ts src/infrastructure/supabase/publicNoteRepository.ts src/infrastructure/supabase/publicNoteRosterRepository.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/publicNotes.ts src/infrastructure/supabase/publicNoteRepository.ts src/infrastructure/supabase/publicNoteRosterRepository.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(notes): apply repository formatting"
          git push origin HEAD:agent/map-063-public-player-notes
