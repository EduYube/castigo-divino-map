name: MAP-046 final diagnostics

on:
  push:
    branches:
      - agent/map-046-admin-workspace-initialization

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-046-admin-workspace-initialization
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting
        shell: bash
        run: |
          npx prettier --write src/app/adminMapEntities.ts tests/deployment/map046-admin-workspace.spec.ts tests/deployment/pages-smoke.spec.ts
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/adminMapEntities.ts tests/deployment/map046-admin-workspace.spec.ts tests/deployment/pages-smoke.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: format MAP-046 final fixes'
            git push origin HEAD:agent/map-046-admin-workspace-initialization
          fi
      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint
      - name: Build production-equivalent Pages artifact
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Repeat MAP-046 publication focus regression
        run: npx playwright test tests/e2e/map046-request-publication.spec.ts --project=chromium --repeat-each=5 --reporter=line --max-failures=1
      - name: Run production Pages smoke
        run: npm run test:e2e:pages
