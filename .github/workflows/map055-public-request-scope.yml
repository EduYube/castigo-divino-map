name: MAP-055 public request scope

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire selected campaign into public request submission
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/publicPinRequest.ts')
          text = path.read_text()
          old = "import { SupabasePublicPinRequestRepository } from '../infrastructure/supabase/publicPinRequestRepository';\n"
          new = old + "import { getCurrentPublicCampaignSelection } from './campaignSelection';\n"
          if old not in text:
              raise SystemExit('public request import target not found')
          text = text.replace(old, new, 1)
          old = "await repository.submit(validation.value, controller.signal);"
          new = "await repository.submit(\n        validation.value,\n        getCurrentPublicCampaignSelection().id,\n        controller.signal,\n      );"
          if old not in text:
              raise SystemExit('public request submit target not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/infrastructure/supabase/publicPinRequestRepository.test.ts')
          text = path.read_text()
          insert_after = "const LEGACY_SERVICE_ROLE_KEY = 'eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.signature';\n"
          if insert_after not in text:
              raise SystemExit('request test constants target not found')
          text = text.replace(insert_after, insert_after + "const CAMPAIGN_ID = '00000000-0000-4000-8000-000000000054';\n", 1)
          text = text.replace(
              'repository.submit(REQUEST, new AbortController().signal)',
              'repository.submit(REQUEST, CAMPAIGN_ID, new AbortController().signal)',
          )
          text = text.replace(
              "expect(new URL(capturedRequest.url).pathname).toBe('/rest/v1/rpc/submit_public_request');",
              "expect(new URL(capturedRequest.url).pathname).toBe('/rest/v1/rpc/submit_public_request_v2');",
              1,
          )
          payload_target = """    expect(await capturedRequest.json()).toEqual({\n      p_sender_name: 'Edu',\n"""
          if payload_target not in text:
              raise SystemExit('request payload target not found')
          text = text.replace(
              payload_target,
              """    expect(await capturedRequest.json()).toEqual({\n      p_campaign_id: CAMPAIGN_ID,\n      p_sender_name: 'Edu',\n""",
              1,
          )
          closing = """  test('accepts the legacy anon key only for the local stack', async () => {\n"""
          invalid_test = """  test('rejects a malformed campaign id before making a network request', async () => {\n    let requests = 0;\n    const repository = new SupabasePublicPinRequestRepository({\n      projectUrl: PROJECT_URL,\n      publishableKey: PUBLISHABLE_KEY,\n      fetchImplementation: async () => {\n        requests += 1;\n        return new Response('true');\n      },\n    });\n\n    await expect(\n      repository.submit(REQUEST, 'not-a-campaign', new AbortController().signal),\n    ).rejects.toMatchObject({ kind: 'configuration' });\n    expect(requests).toBe(0);\n  });\n\n"""
          if closing not in text:
              raise SystemExit('invalid campaign insertion target not found')
          path.write_text(text.replace(closing, invalid_test + closing, 1))
          PY
      - name: Format
        run: npx prettier --write src/app/publicPinRequest.ts src/data-access/publicPinRequest.ts src/infrastructure/supabase/publicPinRequestRepository.ts src/infrastructure/supabase/publicPinRequestRepository.test.ts
      - name: Validate public request unit and build contracts
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: |
          npm test -- src/infrastructure/supabase/publicPinRequestRepository.test.ts
          npm run build:pages
      - name: Commit validated scoping
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/publicPinRequest.ts src/data-access/publicPinRequest.ts src/infrastructure/supabase/publicPinRequestRepository.ts src/infrastructure/supabase/publicPinRequestRepository.test.ts
          git commit -m "MAP-055 bind public requests to selected campaign"
          git push origin HEAD:agent/map-055-public-campaign-runtime
