name: MAP-041 Branch Formatter

on:
  push:
    branches:
      - agent/map-041-geographic-search-extents

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-041-geographic-search-extents
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize MAP-041 compatibility paths
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/data/search.ts'): [
                  ('searchExtent: geographicName.searchExtent,', 'searchExtent: geographicName.searchExtent ?? null,'),
              ],
              Path('src/infrastructure/supabase/publicCatalogCodec.ts'): [
                  ('name.searchExtent === null ? null : expectRecord', 'name.searchExtent == null ? null : expectRecord'),
              ],
              Path('src/data-access/geographicSearchExtentContract.js'): [
                  ('} else if (name.searchExtent !== null) {', '} else if ((name.searchExtent ?? null) !== null) {'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Apply Prettier
        run: npx prettier --write --end-of-line auto "src/**/*.{ts,js,json}" "public/**/*.json" "tests/**/*.ts" "scripts/**/*.{mjs,mts}" "*.{js,mjs,ts,json,html}" ".github/**/*.yml"
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(MAP-041): normalize and format"
          git push origin HEAD:agent/map-041-geographic-search-extents
