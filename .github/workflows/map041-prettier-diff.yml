name: MAP-041 Prettier Diff

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write --end-of-line auto "src/**/*.{ts,js,json}" "public/**/*.json" "tests/**/*.ts" "scripts/**/*.{mjs,mts}" "*.{js,mjs,ts,json,html}" ".github/**/*.yml"
          git diff --no-ext-diff --src-prefix=a/ --dst-prefix=b/
