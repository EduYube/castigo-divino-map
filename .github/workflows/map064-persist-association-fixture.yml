name: MAP-064 persist association fixture

on:
  push:
    branches:
      - agent/map-064-mission-hazard-lifecycle
    paths:
      - .github/workflows/map064-persist-association-fixture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MAP-064 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Persist associations in the admin E2E backend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/e2e/admin-map-entities.spec.ts';
          let text = fs.readFileSync(path, 'utf8');

          const tagsAnchor = "  const entityTags = new Map<string, string[]>([['entity-aster-guide', ['notable']]]);\n";
          if (!text.includes(tagsAnchor)) throw new Error('Missing entityTags fixture anchor');
          text = text.replace(
            tagsAnchor,
            `${tagsAnchor}  const entityAssociations = new Map<string, string[]>();\n`,
          );

          const revisionAnchor = "  const relationRevision = (id: string): string =>\n    `revision-${id}-${(entityTags.get(id) ?? []).join('-')}-${Object.values(dispositions.get(id) ?? {}).join('-')}`;";
          if (!text.includes(revisionAnchor)) throw new Error('Missing relation revision fixture anchor');
          text = text.replace(
            revisionAnchor,
            "  const relationRevision = (id: string): string =>\n    `revision-${id}-${(entityTags.get(id) ?? []).join('-')}-${Object.values(dispositions.get(id) ?? {}).join('-')}-${(entityAssociations.get(id) ?? []).join('-')}`;",
          );

          const detailAnchor = "    const currentDispositions = dispositions.get(id) ?? {};\n    return {";
          if (!text.includes(detailAnchor)) throw new Error('Missing detail fixture anchor');
          text = text.replace(
            detailAnchor,
            "    const currentDispositions = dispositions.get(id) ?? {};\n    const associationIds = entityAssociations.get(id) ?? [];\n    return {",
          );

          const associationAnchor = "      associations: [],\n      relations_revision: relationRevision(id),";
          if (!text.includes(associationAnchor)) throw new Error('Missing association projection anchor');
          text = text.replace(
            associationAnchor,
            `      associations: associationIds.flatMap((playerId) => {\n        const player = players.find((candidate) => candidate.id === playerId);\n        return player\n          ? [\n              {\n                player_id: player.id,\n                display_name: player.display_name,\n                accent_color: player.accent_color,\n                publication_status: player.publication_status,\n                created_at: entity.updated_at,\n              },\n            ]\n          : [];\n      }),\n      relations_revision: relationRevision(id),`,
          );

          const saveAnchor = `      lastAssociationIds = Array.isArray(body.p_player_association_ids)\n        ? body.p_player_association_ids.map(String)\n        : [];\n      saveCount += 1;`;
          if (!text.includes(saveAnchor)) throw new Error('Missing association save anchor');
          text = text.replace(
            saveAnchor,
            `      lastAssociationIds = Array.isArray(body.p_player_association_ids)\n        ? body.p_player_association_ids.map(String)\n        : [];\n      entityAssociations.set(id, [...lastAssociationIds]);\n      saveCount += 1;`,
          );

          const deleteAnchor = `      entityTags.delete(id);\n      dispositions.delete(id);`;
          if (!text.includes(deleteAnchor)) throw new Error('Missing association delete anchor');
          text = text.replace(
            deleteAnchor,
            `      entityTags.delete(id);\n      dispositions.delete(id);\n      entityAssociations.delete(id);`,
          );

          fs.writeFileSync(path, text);
          NODE

      - name: Format and focused-check the patch
        run: |
          npx prettier --write src/app/pinPlayerAssociationVisuals.ts tests/e2e/admin-map-entities.spec.ts
          npx prettier --check src/app/pinPlayerAssociationVisuals.ts tests/e2e/admin-map-entities.spec.ts
          npm run lint
          npm run test
          npm run build:pages

      - name: Remove workflow and commit patch
        shell: bash
        run: |
          git rm .github/workflows/map064-persist-association-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pinPlayerAssociationVisuals.ts tests/e2e/admin-map-entities.spec.ts
          git commit -m "test(map-064): persist player association fixture state"
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
