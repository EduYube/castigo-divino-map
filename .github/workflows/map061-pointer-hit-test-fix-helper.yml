name: MAP-061 Pointer Hit Test Fix Helper

on:
  push:
    branches:
      - agent/map-061-campaign-regions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-061-campaign-regions

      - name: Patch region pointer hit-test helper
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('tests/e2e/map061-campaign-regions.spec.ts')
          text = path.read_text()
          signature = text.index('async function clickRegionInterior(')
          start = text.index('  const target = region(page, id);', signature)
          end = text.index('\n}\n\nfunction insidePin', start)
          encoded = ''
          replacement = base64.b64decode(encoded).decode().rstrip('\n')
          path.write_text(text[:start] + replacement + text[end:])
          PY
          npx prettier --write tests/e2e/map061-campaign-regions.spec.ts
          npx prettier --check tests/e2e/map061-campaign-regions.spec.ts
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/map061-campaign-regions.spec.ts
          git commit -m "test: exercise MAP-061 pointer hit testing directly"
          git push origin HEAD:agent/map-061-campaign-regions
