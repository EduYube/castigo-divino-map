name: MAP-061 Pointer Hit Test Fix Helper

on:
  push:
    branches:
      - agent/map-061-campaign-regions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-061-campaign-regions

      - name: Patch region pointer hit-test helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/map061-campaign-regions.spec.ts')
          text = path.read_text()
          old = '''  const target = region(page, id);
          const box = await target.boundingBox();
          expect(box).not.toBeNull();
          if (!box) throw new Error(`La región ${id} no tiene un área interactiva visible.`);
          await target.click({
            position: {
              x: box.width * position.xRatio,
              y: box.height * position.yRatio,
            },
          });'''
          new = '''  const target = region(page, id);
          await expect(target).toBeVisible();

          const hitRegionAtPosition = async (): Promise<string | null> => {
            const box = await target.boundingBox();
            if (!box) return null;
            const point = {
              x: box.x + box.width * position.xRatio,
              y: box.y + box.height * position.yRatio,
            };
            return page.evaluate(({ x, y }) => {
              const hit = document.elementFromPoint(x, y);
              return hit instanceof Element
                ? (hit.closest('.campaign-region') as HTMLElement | null)?.dataset.regionId ?? null
                : null;
            }, point);
          };

          await expect.poll(hitRegionAtPosition).toBe(id);
          const box = await target.boundingBox();
          expect(box).not.toBeNull();
          if (!box) throw new Error(`La región ${id} no tiene un área interactiva visible.`);
          const point = {
            x: box.x + box.width * position.xRatio,
            y: box.y + box.height * position.yRatio,
          };
          expect(await hitRegionAtPosition()).toBe(id);
          await page.mouse.click(point.x, point.y);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one clickRegionInterior body, found {count}')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --check tests/e2e/map061-campaign-regions.spec.ts
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/map061-campaign-regions.spec.ts
          git commit -m "test: exercise MAP-061 pointer hit testing directly"
          git push origin HEAD:agent/map-061-campaign-regions
