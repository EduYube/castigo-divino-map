name: MAP-055 campaign E2E validator

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format campaign E2E
        run: npx prettier --write tests/e2e/campaign-switcher.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run MAP-055 campaign E2E
        env:
          CI: '1'
        run: npx playwright test tests/e2e/campaign-switcher.spec.ts --project=chromium --reporter=line
      - name: Commit validated E2E formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/campaign-switcher.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "MAP-055 format campaign E2E coverage"
          git push origin HEAD:agent/map-055-public-campaign-runtime
