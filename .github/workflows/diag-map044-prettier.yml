name: MAP-044 Prettier diagnostic

on:
  pull_request:
    branches:
      - agent/map-044-master-audience

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print exact Prettier diff
        shell: bash
        run: |
          npx prettier --write tests/e2e/master-mode-startup-revocation.spec.ts
          git --no-pager diff -- tests/e2e/master-mode-startup-revocation.spec.ts
          test -z "$(git status --porcelain -- tests/e2e/master-mode-startup-revocation.spec.ts)"
