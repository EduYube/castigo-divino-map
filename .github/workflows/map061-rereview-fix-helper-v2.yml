name: MAP-061 rereview fix helper v2

on:
  push:
    paths:
      - '.github/workflows/map061-rereview-fix-helper-v2.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/map-061-campaign-regions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply review fixes and regressions
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          main = 'src/main.ts'
          replace_once(main,
            "  let masterModeRuntime: MasterModeRuntime | null = null;\n  const portraitResources = createPortraitResources();",
            "  let masterModeRuntime: MasterModeRuntime | null = null;\n  let deferredSelectionAnnouncementGeneration = 0;\n  const invalidateDeferredSelectionAnnouncement = (): void => {\n    deferredSelectionAnnouncementGeneration += 1;\n  };\n  const portraitResources = createPortraitResources();")
          replace_once(main,
            "    onPinActivate(pin): void {\n      mapController.clearSearchFocus();",
            "    onPinActivate(pin): void {\n      const announcementGeneration = ++deferredSelectionAnnouncementGeneration;\n      const wasMaster = Boolean(pin.entityId && masterEntityIds.has(pin.entityId));\n      mapController.clearSearchFocus();")
          replace_once(main,
            "      window.requestAnimationFrame(() => {\n        if (!mapSearchStatus) return;\n        const type = getPinTypeVisual(pin.entityType).label.toLocaleLowerCase('es');",
            "      window.requestAnimationFrame(() => {\n        if (\n          announcementGeneration !== deferredSelectionAnnouncementGeneration ||\n          activeSupplementalPin?.id !== pin.id ||\n          !renderedMarkers.some(({ id }) => id === pin.id) ||\n          (wasMaster && (!pin.entityId || !masterEntityIds.has(pin.entityId)))\n        ) {\n          return;\n        }\n        if (!mapSearchStatus) return;\n        const type = getPinTypeVisual(pin.entityType).label.toLocaleLowerCase('es');")
          replace_once(main,
            "    onClose(): void {\n      const previouslyActivePlaceId = selection.getActivePlaceId();",
            "    onClose(): void {\n      invalidateDeferredSelectionAnnouncement();\n      const previouslyActivePlaceId = selection.getActivePlaceId();")
          replace_once(main,
            "  const openLegacyPlace = (placeId: PlaceId): void => {\n    const wasAlreadyActive",
            "  const openLegacyPlace = (placeId: PlaceId): void => {\n    invalidateDeferredSelectionAnnouncement();\n    const wasAlreadyActive")
          replace_once(main,
            "    onQueryChange(): void {\n      if (geographicNameId !== null)",
            "    onQueryChange(): void {\n      invalidateDeferredSelectionAnnouncement();\n      if (geographicNameId !== null)")
          replace_once(main,
            "    onSelect(result): void {\n      if (result.type === 'location'",
            "    onSelect(result): void {\n      invalidateDeferredSelectionAnnouncement();\n      if (result.type === 'location'")
          replace_once(main,
            "  function applyCatalogState(nextCatalogState: PublicCatalogState, force = false): void {\n    if (!force && isSameCatalogState(catalogState, nextCatalogState)) return;\n\n    catalogState = nextCatalogState;",
            "  function applyCatalogState(nextCatalogState: PublicCatalogState, force = false): void {\n    if (!force && isSameCatalogState(catalogState, nextCatalogState)) return;\n\n    invalidateDeferredSelectionAnnouncement();\n    catalogState = nextCatalogState;")
          replace_once(main,
            "  function restorePublicStateFromUrl(sourceUrl: URL): void {\n    const shouldPreserveUnknownFilters =",
            "  function restorePublicStateFromUrl(sourceUrl: URL): void {\n    invalidateDeferredSelectionAnnouncement();\n    const shouldPreserveUnknownFilters =")

          editor = 'src/map/adminEntityEditorMap.ts'
          replace_once(editor,
            "  const updateVertex = (index: number, coordinate: CampaignCoordinate): void => {\n    if (currentGeometry?.kind !== 'polygon' || !isMapCoordinateWithinBounds(coordinate)) return;\n    currentGeometry = {",
            "  const updateVertex = (index: number, coordinate: CampaignCoordinate): void => {\n    if (currentGeometry?.kind !== 'polygon') return;\n    if (!isMapCoordinateWithinBounds(coordinate)) {\n      selectedVertexIndex = index;\n      renderGeometry();\n      window.requestAnimationFrame(() =>\n        vertexMarkers[index]?.getElement()?.focus({ preventScroll: true }),\n      );\n      return;\n    }\n    currentGeometry = {")

          status_test = 'tests/e2e/map061-master-status-purge.spec.ts'
          first_test = "test('purges Master region search status on OFF and campaign replacement without residual metadata', async ({"
          helpers = r'''async function holdAnimationFrames(page: Page): Promise<void> {
            await page.evaluate(() => {
              const testWindow = window as typeof window & {
                __MAP061_RAF_CONTROL__?: { readonly pending: () => number; readonly release: () => void };
              };
              const originalRequestAnimationFrame = window.requestAnimationFrame.bind(window);
              const originalCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
              const pending = new Map<number, FrameRequestCallback>();
              let nextId = 1_000_000;

              testWindow.__MAP061_RAF_CONTROL__ = {
                pending: () => pending.size,
                release: () => {
                  window.requestAnimationFrame = originalRequestAnimationFrame;
                  window.cancelAnimationFrame = originalCancelAnimationFrame;
                  const callbacks = [...pending.values()];
                  pending.clear();
                  callbacks.forEach((callback) => callback(performance.now()));
                },
              };
              window.requestAnimationFrame = (callback: FrameRequestCallback): number => {
                const id = nextId;
                nextId += 1;
                pending.set(id, callback);
                return id;
              };
              window.cancelAnimationFrame = (id: number): void => {
                if (!pending.delete(id)) originalCancelAnimationFrame(id);
              };
            });
          }

          async function heldAnimationFrameCount(page: Page): Promise<number> {
            return page.evaluate(() => {
              const testWindow = window as typeof window & {
                __MAP061_RAF_CONTROL__?: { readonly pending: () => number };
              };
              return testWindow.__MAP061_RAF_CONTROL__?.pending() ?? 0;
            });
          }

          async function releaseAnimationFrames(page: Page): Promise<void> {
            await page.evaluate(() => {
              const testWindow = window as typeof window & {
                __MAP061_RAF_CONTROL__?: { readonly release: () => void };
              };
              testWindow.__MAP061_RAF_CONTROL__?.release();
              delete testWindow.__MAP061_RAF_CONTROL__;
            });
          }

          '''
          helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in helpers.splitlines())
          replace_once(status_test, first_test, helpers + first_test)

          auth_test = "test('purges Master region search status after a 403 revokes administrative authorization', async ({"
          deterministic = r'''test('purges Master region search status when a deferred selection frame runs after OFF', async ({
            page,
          }) => {
            await openAuthorizedMap(page);
            const masterToggle = page.locator('[data-master-mode-toggle]');
            const regionA = page.locator(`[data-region-entity-id="${MASTER_REGION_A_ID}"]`);
            const status = page.locator('[data-map-search-status]');

            await masterToggle.click();
            await expect(masterToggle).toHaveAttribute('aria-pressed', 'true');
            await expect(regionA).toHaveCount(1);
            await searchMasterRegion(page, MASTER_REGION_A_NAME);

            await holdAnimationFrames(page);
            await regionA.focus();
            await regionA.press('Enter');
            expect(await heldAnimationFrameCount(page)).toBeGreaterThan(0);

            await masterToggle.click();
            await expect(masterToggle).toHaveAttribute('aria-pressed', 'false');
            await expectSecretPurged(page, MASTER_REGION_A_NAME, MASTER_REGION_A_ID);

            const newerPublicStatus = 'Estado público posterior MAP061.';
            await status.evaluate((element, message) => {
              element.textContent = message;
            }, newerPublicStatus);
            await releaseAnimationFrames(page);

            await expect(status).toHaveText(newerPublicStatus);
            await expect(status).not.toContainText(MASTER_REGION_A_NAME);
            await expectSecretPurged(page, MASTER_REGION_A_NAME, MASTER_REGION_A_ID);
          });

          '''
          deterministic = '\n'.join(line[10:] if line.startswith('          ') else line for line in deterministic.splitlines())
          replace_once(status_test, auth_test, deterministic + auth_test)

          old_403 = "  await searchMasterRegion(page, MASTER_REGION_A_NAME);\n\n  backend.denyMasterCatalog();\n  await campaignSelector.selectOption('campaign-b');\n  await expect(campaignSelector).toHaveValue('campaign-b');\n  await expectSecretPurged(page, MASTER_REGION_A_NAME, MASTER_REGION_A_ID);\n  await expect(masterToggle).toHaveCount(0);"
          new_403 = "  await searchMasterRegion(page, MASTER_REGION_A_NAME);\n\n  await holdAnimationFrames(page);\n  await regionA.focus();\n  await regionA.press('Enter');\n  expect(await heldAnimationFrameCount(page)).toBeGreaterThan(0);\n\n  backend.denyMasterCatalog();\n  await campaignSelector.selectOption('campaign-b');\n  await expect(campaignSelector).toHaveValue('campaign-b');\n  await expect(masterToggle).toHaveCount(0);\n  await releaseAnimationFrames(page);\n  await expectSecretPurged(page, MASTER_REGION_A_NAME, MASTER_REGION_A_ID);"
          replace_once(status_test, old_403, new_403)

          admin_test = 'tests/e2e/map061-admin-regions.spec.ts'
          save_test = "test('saving a valid polygon preserves stable identity, audience, tags, dispositions and player associations', async ({"
          regression = r'''test('rejecting an out-of-bounds vertex drag restores the visible handle before save', async ({
            page,
          }) => {
            const backend = await openAdmin(page);
            await page.getByTestId('admin-geometry-kind').selectOption('polygon');

            const canvas = page.getByTestId('admin-coordinate-map');
            await canvas.scrollIntoViewIfNeeded();
            const canvasBox = await canvas.boundingBox();
            const viewport = page.viewportSize();
            const firstVertex = page.getByTestId('admin-polygon-vertex-0');
            const beforeBox = await firstVertex.boundingBox();
            if (!canvasBox || !viewport || !beforeBox) {
              throw new Error('El mapa o el vértice administrativo no tiene geometría visible.');
            }

            const start = {
              x: beforeBox.x + beforeBox.width / 2,
              y: beforeBox.y + beforeBox.height / 2,
            };
            let target: { x: number; y: number };
            if (canvasBox.x >= 32) {
              target = { x: canvasBox.x - 24, y: start.y };
            } else if (canvasBox.x + canvasBox.width + 24 < viewport.width) {
              target = { x: canvasBox.x + canvasBox.width + 24, y: start.y };
            } else if (canvasBox.y >= 32) {
              target = { x: start.x, y: canvasBox.y - 24 };
            } else if (canvasBox.y + canvasBox.height + 24 < viewport.height) {
              target = { x: start.x, y: canvasBox.y + canvasBox.height + 24 };
            } else {
              throw new Error('No hay espacio de viewport para arrastrar el vértice fuera del mapa.');
            }

            await page.mouse.move(start.x, start.y);
            await page.mouse.down();
            await page.mouse.move(target.x, target.y, { steps: 8 });
            await page.mouse.up();

            await expect(firstVertex).toBeFocused();
            const restoredBox = await firstVertex.boundingBox();
            if (!restoredBox) throw new Error('El vértice restaurado no es visible.');
            const restoredCenter = {
              x: restoredBox.x + restoredBox.width / 2,
              y: restoredBox.y + restoredBox.height / 2,
            };
            expect(Math.abs(restoredCenter.x - start.x)).toBeLessThan(2);
            expect(Math.abs(restoredCenter.y - start.y)).toBeLessThan(2);

            await page.getByRole('button', { name: 'Previsualizar' }).click();
            await expect(page.getByText(/Área\/Región · 4 vértices/)).toBeVisible();
            await page.getByRole('button', { name: 'Publicar' }).click();
            await expect(page.getByText('Entidad publicada correctamente.')).toBeVisible();

            const expectedGeometry: Geometry = {
              kind: 'polygon',
              vertices: [
                { x: 964, y: 764 },
                { x: 1036, y: 764 },
                { x: 1036, y: 836 },
                { x: 964, y: 836 },
              ],
            };
            expect(backend.getGeometry()).toEqual(expectedGeometry);
            expect(backend.getLastSaveBody()).toMatchObject({ p_geometry: expectedGeometry });

            await page.getByRole('button', { name: 'Cerrar editor' }).click();
            await openExistingEditor(page);
            await expect(page.getByTestId('admin-geometry-kind')).toHaveValue('polygon');
            await expect(page.locator('[data-testid^="admin-polygon-vertex-"]')).toHaveCount(4);
            await expect(page.getByLabel(/Coordenada X representativa/)).toHaveValue('1000');
            await expect(page.getByLabel(/Coordenada Y representativa/)).toHaveValue('800');
          });

          '''
          regression = '\n'.join(line[10:] if line.startswith('          ') else line for line in regression.splitlines())
          replace_once(admin_test, save_test, regression + save_test)
      - name: Format changed files
        run: npx prettier --write src/main.ts src/map/adminEntityEditorMap.ts tests/e2e/map061-master-status-purge.spec.ts tests/e2e/map061-admin-regions.spec.ts
      - name: Validate patch
        run: |
          git diff --check
          npx prettier --check src/main.ts src/map/adminEntityEditorMap.ts tests/e2e/map061-master-status-purge.spec.ts tests/e2e/map061-admin-regions.spec.ts
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.ts src/map/adminEntityEditorMap.ts tests/e2e/map061-master-status-purge.spec.ts tests/e2e/map061-admin-regions.spec.ts
          git commit -m 'fix: close MAP-061 rereview findings'
          git push origin HEAD:agent/map-061-campaign-regions
