name: MAP-064 format final gates

on:
  push:
    branches:
      - agent/map-064-mission-hazard-lifecycle
    paths:
      - .github/workflows/map064-format-final-gates.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MAP-064 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format and check new MAP-064 gates
        run: |
          npx prettier --write package.json scripts/test-map064-v6-v7-concurrency.mjs src/infrastructure/supabase/publicCatalogLifecycleCompatibility.test.ts
          node --check scripts/test-map064-v6-v7-concurrency.mjs
          npx vitest run src/infrastructure/supabase/publicCatalogLifecycleCompatibility.test.ts

      - name: Remove workflow and persist formatting
        shell: bash
        run: |
          git rm .github/workflows/map064-format-final-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/test-map064-v6-v7-concurrency.mjs src/infrastructure/supabase/publicCatalogLifecycleCompatibility.test.ts
          git commit -m "test(map-064): format final validation gates"
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
