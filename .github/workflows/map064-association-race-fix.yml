name: MAP064 association race fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/map-064-mission-hazard-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch authoritative draft projection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/adminMapEntities.ts')
          s = p.read_text()
          old = """    const pointFallback = isMapCoordinateWithinBounds(coordinate)\n      ? createPointMapGeometry(coordinate)\n      : undefined;\n    return {\n"""
          new = """    const pointFallback = isMapCoordinateWithinBounds(coordinate)\n      ? createPointMapGeometry(coordinate)\n      : undefined;\n    const associationCheckboxes = Array.from(\n      form.querySelectorAll<HTMLInputElement>('[data-player-association-id]'),\n    );\n    const playerAssociationIds =\n      associationCheckboxes.length > 0\n        ? associationCheckboxes\n            .filter((checkbox) => checkbox.checked)\n            .map((checkbox) => checkbox.value)\n        : (state.editorDetail?.associations ?? [])\n            .filter(({ publicationStatus }) => publicationStatus !== 'archived')\n            .map(({ playerId }) => playerId);\n    return {\n"""
          if old not in s:
              raise SystemExit('readDraft anchor missing')
          s = s.replace(old, new, 1)
          old2 = """      lifecycleStatus: (input('lifecycleStatus') || null) as MapEntityLifecycleStatus | null,\n      visibility: input('visibility') as MapVisibility,\n"""
          new2 = """      lifecycleStatus: (input('lifecycleStatus') || null) as MapEntityLifecycleStatus | null,\n      visibility: input('visibility') as MapVisibility,\n      audience: state.pendingAudience,\n"""
          if old2 not in s:
              raise SystemExit('audience anchor missing')
          s = s.replace(old2, new2, 1)
          old3 = """      dispositions: [\n        ...dispositionSelects.map((select) => ({\n          playerId: select.dataset.playerId ?? '',\n          disposition: select.value as PlayerDisposition,\n        })),\n        ...preservedDispositions,\n      ],\n      publicationStatus,\n"""
          new3 = """      dispositions: [\n        ...dispositionSelects.map((select) => ({\n          playerId: select.dataset.playerId ?? '',\n          disposition: select.value as PlayerDisposition,\n        })),\n        ...preservedDispositions,\n      ],\n      playerAssociationIds,\n      publicationStatus,\n"""
          if old3 not in s:
              raise SystemExit('association anchor missing')
          p.write_text(s.replace(old3, new3, 1))
          PY
          npx prettier --write src/app/adminMapEntities.ts
      - name: Remove integration workflow
        run: rm .github/workflows/map064-association-race-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/adminMapEntities.ts .github/workflows/map064-association-race-fix.yml
          git commit -m 'fix(map-064): preserve associations across editor rerenders'
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
