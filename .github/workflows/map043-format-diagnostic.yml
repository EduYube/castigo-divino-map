name: MAP-043 format diagnostic

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Prettier diff for MAP-043 files
        run: |
          npx prettier --write src/app/publicPinRequestEntry.ts tests/e2e/map043-public-pin-form.spec.ts
          git diff -- src/app/publicPinRequestEntry.ts tests/e2e/map043-public-pin-form.spec.ts
