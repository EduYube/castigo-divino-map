name: MAP-021 temporary formatter

on:
  push:
    branches:
      - agent/map-021-geographic-search

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'style(MAP-021): apply Prettier') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-021-geographic-search
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format tracked sources
        run: npm run format

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts public .github '*.js' '*.mjs' '*.ts' '*.json' '*.html'
          git commit -m "style(MAP-021): apply Prettier"
          git push origin HEAD:agent/map-021-geographic-search
