name: MAP-055 refresh multicampaign snapshot

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate native schema v3 snapshot from public Supabase data
        env:
          VITE_SUPABASE_URL: https://ehpouvbzmvwbkkoypgfa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0
        run: npm run snapshot:generate
      - name: Verify generated snapshot
        run: npm run snapshot:verify
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/public-catalog.snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot already current."
            exit 0
          fi
          git commit -m "MAP-055 refresh multicampaign public snapshot"
          git push origin HEAD:agent/map-055-public-campaign-runtime
