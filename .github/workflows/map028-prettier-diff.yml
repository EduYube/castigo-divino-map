name: MAP-028 apply canonical Prettier output

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-028-static-catalog-migration
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical formatting and remove this diagnostic
        run: |
          npx prettier --write tests/e2e/full-entity-details.spec.ts
          rm .github/workflows/map028-prettier-diff.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/full-entity-details.spec.ts .github/workflows/map028-prettier-diff.yml
          git commit -m "MAP-028 — aplicar formato canónico de E2E"
          git push origin HEAD:agent/map-028-static-catalog-migration
