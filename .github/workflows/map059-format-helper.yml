name: MAP-059 format helper

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format MAP-059 sources
        run: npx prettier --write src/domain/pinProximity.ts src/map/leaflet.ts
      - name: Print formatted sources
        run: |
          echo '===PIN_PROXIMITY_BEGIN==='
          base64 -w 0 src/domain/pinProximity.ts
          echo
          echo '===PIN_PROXIMITY_END==='
          echo '===LEAFLET_BEGIN==='
          base64 -w 0 src/map/leaflet.ts
          echo
          echo '===LEAFLET_END==='
