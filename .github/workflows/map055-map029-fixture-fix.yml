name: MAP-055 MAP-029 fixture fix

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch MAP-029 multicampaign fixture
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/e2e/map029-resilience.spec.ts';
          let text = fs.readFileSync(path, 'utf8');

          function replaceOnce(oldValue, newValue) {
            if (!text.includes(oldValue)) {
              throw new Error(`Expected MAP-029 fixture pattern not found: ${oldValue}`);
            }
            text = text.replace(oldValue, newValue);
          }

          replaceOnce(
            "import { PUBLIC_CATALOG_TABLE_QUERIES } from '../../src/data-access/publicCatalogQueryContract.js';",
            "import {\n  INITIAL_PUBLIC_CAMPAIGN_ID,\n  PUBLIC_CAMPAIGNS_QUERY,\n  PUBLIC_CATALOG_TABLE_QUERIES,\n} from '../../src/data-access/publicCatalogQueryContract.js';",
          );

          replaceOnce(
            "    let rows = projectFixtureRows(table);",
            [
              '    let rows =',
              '      table === PUBLIC_CAMPAIGNS_QUERY.name',
              '        ? [',
              '            {',
              '              id: INITIAL_PUBLIC_CAMPAIGN_ID,',
              "              slug: 'castigo-divino',",
              "              name: 'Castigo Divino',",
              "              status: 'active',",
              '              display_order: 0,',
              '            },',
              '          ]',
              '        : projectFixtureRows(table);',
            ].join('\n'),
          );

          replaceOnce(
            "  await expect\n    .poll(() => backend.requestCount())\n    .toBe(Object.keys(PUBLIC_CATALOG_TABLE_QUERIES).length);\n  const settledCount = backend.requestCount();\n  expect(settledCount).toBe(Object.keys(PUBLIC_CATALOG_TABLE_QUERIES).length);",
            "  const initialRequestCount = Object.keys(PUBLIC_CATALOG_TABLE_QUERIES).length + 1;\n  await expect.poll(() => backend.requestCount()).toBe(initialRequestCount);\n  const settledCount = backend.requestCount();\n  expect(settledCount).toBe(initialRequestCount);",
          );

          fs.writeFileSync(path, text);
          NODE
      - run: npx prettier --write tests/e2e/map029-resilience.spec.ts .github/workflows/map055-map029-fixture-fix.yml
      - run: npm run format:check
      - run: npm test
      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/map029-resilience.spec.ts .github/workflows/map055-map029-fixture-fix.yml
          git commit -m 'MAP-055 align MAP-029 resilience fixture with campaigns'
          git push origin HEAD:agent/map-055-public-campaign-runtime
