name: MAP-064 integration patch

on:
  push:
    branches:
      - agent/map-064-mission-hazard-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(map-064): run integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/map064-integration-patch.mjs
      - run: npm ci
      - run: npx prettier --write src/domain/mapGeometry.ts src/data-access/publicCatalogQueryContract.js src/infrastructure/supabase/publicCatalogRows.ts src/app/adminCampaignScope.ts src/infrastructure/supabase/adminMapEntityRepository.ts src/infrastructure/supabase/masterCatalogRepository.ts src/data/pinMarkers.ts src/data/compactPinDetails.ts src/app/compactPinDetails.ts src/map/leafletBase.ts src/styles/pin-visual-system.css
      - name: Commit integration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(map-064): integrate lifecycle across public and admin pipelines"
          git push
