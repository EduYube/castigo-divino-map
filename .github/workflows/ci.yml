name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Audit tracked files for privileged credentials
        run: npm run verify:security

      - name: Verify accessibility invariants
        run: npm run verify:accessibility

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application for GitHub Pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ehpouvbzmvwbkkoypgfa.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0' }}
        run: npm run build:pages

      - name: Audit production artifact
        run: npm run verify:build

      - name: Report production build metrics
        run: npm run report:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MAP-033 mobile visual references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-033-mobile-references-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MAP-037 mobile sheet references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-037-mobile-sheet-references-${{ github.run_id }}
          path: test-results/**/attachments/MAP-037-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke test the Pages build locally
        run: npm run test:e2e:pages

  database:
    name: Supabase migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Rebuild, lint and test database
        run: npm run supabase:db:validate

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  map058_compat:
    name: MAP-058 compatibility codemod
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/map-058-player-associations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MAP-058 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-058-player-associations

      - name: Apply compatibility codemod
        run: node scripts/map058-compat-codemod.mjs

      - name: Format changed sources
        run: npx prettier --write --end-of-line auto "src/**/*.{ts,js,json}" "tests/**/*.ts" "scripts/**/*.{mjs,mts}"

      - name: Commit codemod result when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No compatibility changes remain."
            exit 0
          fi
          git config user.name "Eduardo Yubero Lavandeira"
          git config user.email "33625448+EduYube@users.noreply.github.com"
          git add src tests
          git commit -m "MAP-058 preserve historical catalog compatibility"
          git push origin HEAD:agent/map-058-player-associations
