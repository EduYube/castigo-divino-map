name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map019-cleanup:
    name: MAP-019 one-shot cleanup
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/map-019-pin-crud' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout MAP-019 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final MAP-019 cleanup
        shell: python
        run: |
          from pathlib import Path
          import json

          ui_path = Path('src/app/adminMapEntities.ts')
          ui = ui_path.read_text()
          ui = ui.replace(
              "const first = Array.from(controls.values()).find(({ input }) => !input.readOnly && !input.disabled);",
              """const first = Array.from(controls.values()).find(
                ({ input }) =>
                  !input.disabled &&
                  (!(
                    input instanceof HTMLInputElement || input instanceof HTMLTextAreaElement
                  ) ||
                    !input.readOnly),
              );""",
          )
          ui = ui.replace(
              """const desiredEditorKey = state.creating
              ? `new:${requestedEntityType}`
              : state.editorDetail
                ? state.editorDetail.record.id
                : null;""",
              """const desiredEditorKey = state.creating
              ? `new:${requestedEntityType}`
              : state.editorDetail
                ? `${state.editorDetail.record.id}:${state.editorDetail.record.updatedAt}`
                : null;""",
          )
          ui_path.write_text(ui)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['format:check'] = (
              'prettier --check "src/**/*.{ts,json}" "public/**/*.json" '
              '"tests/**/*.ts" "scripts/**/*.{mjs,mts}" "*.{js,mjs,ts,json,html}" '
              '".github/**/*.yml"'
          )
          package_path.write_text(json.dumps(package, indent=2) + '\n')

      - name: Format tracked sources
        run: npm run format

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src public tests scripts package.json '*.js' '*.mjs' '*.ts' '*.json' '*.html' .github
          git commit -m "MAP-019 finalize formatting and editor safety"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Audit tracked files for privileged credentials
        run: npm run verify:security

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application for GitHub Pages
        run: npm run build:pages

      - name: Audit production artifact
        run: npm run verify:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Smoke test the Pages build locally
        run: npm run test:e2e:pages

  database:
    name: Supabase migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase database
        run: npx supabase db start

      - name: Rebuild, lint and test database
        run: npm run supabase:db:validate

      - name: Stop local Supabase database
        if: always()
        run: npx supabase stop --no-backup
