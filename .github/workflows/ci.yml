name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format MAP-044 files
        run: >-
          npx prettier --write
          src/application/masterModeController.test.ts
          src/data/masterCatalogView.test.ts
          src/data/publicCatalogRevocations.test.ts
          src/data/publicCatalogRevocations.ts
          src/infrastructure/supabase/adminMapEntityConvertedDraft.test.ts
          src/infrastructure/supabase/adminMapEntityRepository.test.ts
          tests/e2e/master-mode.spec.ts
          verify-production-build.mjs

      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-044-review-formatted-${{ github.run_id }}
          path: |
            src/application/masterModeController.test.ts
            src/data/masterCatalogView.test.ts
            src/data/publicCatalogRevocations.test.ts
            src/data/publicCatalogRevocations.ts
            src/infrastructure/supabase/adminMapEntityConvertedDraft.test.ts
            src/infrastructure/supabase/adminMapEntityRepository.test.ts
            tests/e2e/master-mode.spec.ts
            verify-production-build.mjs
          retention-days: 1

      - name: Keep diagnostic PR unmergeable
        run: exit 1
