name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    # Chromium/WebKit require a complete browser runtime; pinned image avoids slow apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Trust container checkout for Git-aware audit scripts
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MAP-071 PDF matches Markdown
        run: node scripts/generate-admin-qa-pdf.cjs --check

      - name: Check formatting
        run: npm run format:check

      # Temporary MAP-079 diagnostics: emit ONLY tracked source text, never secrets.
      # Remove this before the independent-review HEAD.
      - name: MAP-079 formatted source diagnostics
        if: failure()
        run: |
          npx prettier --write src/app/localMapNavigation.ts src/app/placeSearch.ts src/app/publicLocalMapRuntime.ts src/data-access/publicCatalogQueryContract.d.ts src/data-access/publicCatalogQueryContract.js src/data/search.ts src/infrastructure/supabase/publicLocalMapRepository.test.ts src/infrastructure/supabase/publicLocalMapRepository.ts src/main.ts
          for f in src/app/localMapNavigation.ts src/app/placeSearch.ts src/app/publicLocalMapRuntime.ts src/data-access/publicCatalogQueryContract.d.ts src/data-access/publicCatalogQueryContract.js src/data/search.ts src/infrastructure/supabase/publicLocalMapRepository.test.ts src/infrastructure/supabase/publicLocalMapRepository.ts src/main.ts; do
            printf 'MAP079_FORMAT_BEGIN=%s\\n' "$f"
            base64 -w 0 "$f"
            printf '\\nMAP079_FORMAT_END=%s\\n' "$f"
          done

      - name: Audit tracked files for privileged credentials
        run: npm run verify:security

      - name: Verify accessibility invariants
        run: npm run verify:accessibility

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application for GitHub Pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ehpouvbzmvwbkkoypgfa.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0' }}
        run: npm run build:pages

      - name: Audit production artifact
        run: npm run verify:build

      - name: Report production build metrics
        run: npm run report:build

      - name: Verify preinstalled Playwright browsers
        run: npx playwright --version

      - name: Run Chromium and WebKit end-to-end tests
        run: npm run test:e2e -- --project=chromium --project=webkit-map061 --project=mobile-chromium --project=mobile-webkit

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MAP-033 mobile visual references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-033-mobile-references-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MAP-037 mobile sheet references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-037-mobile-sheet-references-${{ github.run_id }}
          path: test-results/**/attachments/MAP-037-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke test the Pages build locally
        run: npm run test:e2e:pages

  firefox:
    name: Firefox accessibility and MAP-061 browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox browser
        run: npx playwright install firefox

      - name: Run Firefox end-to-end tests
        run: npm run test:e2e -- --project=firefox --project=firefox-map061

      - name: Upload Firefox failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-failure-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: warn
          retention-days: 14

  database:
    name: Supabase migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Rebuild, lint and test database
        run: npm run supabase:db:validate

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
