name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix MAP-053 lint finding once
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/public-snapshot-lib.mjs';
          const before = fs.readFileSync(path, 'utf8');
          const needle = "  const geographicNames = geographicNamesV2.map(({ entityId: _entityId, ...name }) => name);";
          const replacement = `  const geographicNames = geographicNamesV2.map((name) => {
            const geographicName = { ...name };
            delete geographicName.entityId;
            return geographicName;
          });`;
          if (!before.includes(needle)) throw new Error('Expected MAP-053 lint target was not found.');
          const after = before.replace(needle, replacement);
          if (after === before || after.includes(needle)) throw new Error('MAP-053 lint target was not replaced exactly once.');
          fs.writeFileSync(path, after);
          NODE
          npx prettier --write scripts/public-snapshot-lib.mjs
          npx eslint scripts/public-snapshot-lib.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/public-snapshot-lib.mjs
          git diff --cached --check
          git commit -m "fix: remove unused legacy snapshot binding"
          git push origin HEAD:${GITHUB_HEAD_REF}

  database:
    name: Supabase migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Rebuild, lint and test database
        run: npm run supabase:db:validate

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
