name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Audit tracked files for privileged credentials
        run: npm run verify:security

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application for GitHub Pages
        run: npm run build:pages

      - name: Audit production artifact
        run: npm run verify:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run existing end-to-end tests
        id: e2e_existing
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t specs < <(find tests/e2e -name '*.spec.ts' ! -name 'public-pin-request.spec.ts' -print)
          npx playwright test "${specs[@]}"

      - name: Diagnose MAP-026 valid submission
        id: e2e_map026_submit
        continue-on-error: true
        run: npx playwright test tests/e2e/public-pin-request.spec.ts --grep "submits a valid anonymous request"

      - name: Diagnose MAP-026 validation
        id: e2e_map026_validation
        continue-on-error: true
        run: npx playwright test tests/e2e/public-pin-request.spec.ts --grep "associates validation errors"

      - name: Diagnose MAP-026 network preservation
        id: e2e_map026_network
        continue-on-error: true
        run: npx playwright test tests/e2e/public-pin-request.spec.ts --grep "keeps entered data and position"

      - name: Diagnose MAP-026 abuse cooldown
        id: e2e_map026_cooldown
        continue-on-error: true
        run: npx playwright test tests/e2e/public-pin-request.spec.ts --grep "applies a local post-success cooldown"

      - name: Diagnose MAP-026 mobile accessibility
        id: e2e_map026_mobile
        continue-on-error: true
        run: npx playwright test tests/e2e/public-pin-request.spec.ts --grep "keeps the request flow accessible"

      - name: Require all end-to-end diagnostics
        if: always()
        run: |
          test "${{ steps.e2e_existing.outcome }}" = "success"
          test "${{ steps.e2e_map026_submit.outcome }}" = "success"
          test "${{ steps.e2e_map026_validation.outcome }}" = "success"
          test "${{ steps.e2e_map026_network.outcome }}" = "success"
          test "${{ steps.e2e_map026_cooldown.outcome }}" = "success"
          test "${{ steps.e2e_map026_mobile.outcome }}" = "success"

      - name: Smoke test the Pages build locally
        run: npm run test:e2e:pages

  database:
    name: Supabase migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase database
        run: npx supabase db start

      - name: Rebuild, lint and test database
        run: npm run supabase:db:validate

      - name: Stop local Supabase database
        if: always()
        run: npx supabase stop --no-backup
