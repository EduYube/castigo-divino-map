name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    # Chromium/WebKit require a complete browser runtime; pinned image avoids slow apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust container checkout for Git-aware audit scripts
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MAP-071 PDF matches Markdown
        run: node scripts/generate-admin-qa-pdf.cjs --check

      - name: Check formatting
        run: npm run format:check

      - name: Audit tracked files for privileged credentials
        run: npm run verify:security

      - name: Verify accessibility invariants
        run: npm run verify:accessibility

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application for GitHub Pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ehpouvbzmvwbkkoypgfa.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0' }}
        run: npm run build:pages

      - name: Audit production artifact
        run: npm run verify:build

      - name: Report production build metrics
        run: npm run report:build

      # MAP-079: read-only, self-contained bundle for the independent reviewer.
      # Export the exact checked-out Git tree; never package workspace secrets,
      # .git, Actions credentials, generated reports or runner configuration.
      - name: Package MAP-079 offline independent-review runtime
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 217
        shell: bash
        run: |
          set -euo pipefail
          offline_dir="$(mktemp -d)"
          mkdir -p "$offline_dir/repository"
          git archive --format=tar HEAD | tar -xf - -C "$offline_dir/repository"
          cp -a node_modules "$offline_dir/repository/node_modules"
          git rev-parse HEAD > "$offline_dir/repository/CI_SYNTHETIC_MERGE_SHA.txt"
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$offline_dir/repository/PR_HEAD_SHA.txt"
          git rev-parse 'HEAD^{tree}' > "$offline_dir/repository/TREE_SHA.txt"
          git ls-files -z | xargs -0 sha256sum > "$offline_dir/repository/TRACKED_SOURCE_SHA256SUMS.txt"
          cat > "$offline_dir/repository/playwright.offline-map079.config.ts" <<'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './tests/e2e',
            fullyParallel: false,
            retries: 0,
            workers: 1,
            reporter: 'list',
            expect: { timeout: 15_000 },
            use: {
              baseURL: 'http://127.0.0.1:4173',
              launchOptions: {
                executablePath: process.env.MAP079_CHROMIUM_PATH || '/usr/bin/chromium',
                args: ['--no-sandbox'],
              },
            },
            projects: [{ name: 'chromium', use: { ...devices['Desktop Chrome'] } }],
            webServer: {
              command: 'npm run dev -- --mode e2e --host 127.0.0.1 --port 4173',
              url: 'http://127.0.0.1:4173',
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          EOF
          cat > "$offline_dir/repository/OFFLINE_REVIEW.md" <<'EOF'
          # MAP-079 — Offline, real-runtime independent-review bundle

          This ZIP contains a tar.gz of the GitHub Actions checkout tree (Git
          archive, exact PR synthetic merge), plus npm-ci-installed Linux Node 22
          dependencies. No .git, local secrets or private data are included.

          The checkout's merge SHA, PR HEAD SHA and tree SHA are recorded in
          CI_SYNTHETIC_MERGE_SHA.txt, PR_HEAD_SHA.txt and TREE_SHA.txt.
          Compare them with GitHub Git Data API. TRACKED_SOURCE_SHA256SUMS.txt
          hashes tracked source files, prior to any independent instrumentation.

          Offline Linux x64 execution (requires Node 22 and system Chromium):

            tar -xzf map079-offline-runtime.tgz
            cd repository
            sha256sum -c TRACKED_SOURCE_SHA256SUMS.txt
            MAP079_CHROMIUM_PATH=/usr/bin/chromium ./node_modules/.bin/playwright test \
              tests/e2e/map077-local-navigation.spec.ts \
              --config=playwright.offline-map079.config.ts \
              --grep='MAP-079'

          The offline Playwright configuration starts the authentic Vite e2e
          development server and uses the installed browser instead of trying
          to download an unavailable browser executable. The app and Leaflet
          come from the repository and installed production dependencies.
          Fixtures in tests/e2e intercept Supabase calls; NO production writes.

          IMPORTANT: The original E2E tests were written by the implementer.
          An independent reviewer MUST additionally author/instrument their
          own browser tests against this genuine runtime to independently
          demonstrate REV-04 (DOM focus, Escape, local regions), REV-05 (stale
          retained popup buttons and an onPinActivate spy/count inside the
          actual module), and REV-06 (unrelated/local layer changes). For an
          activation spy, instrument ONLY a separate scratch copy of the
          runtime at the actual options.onPinActivate call sites, and compare
          original-file hashes before instrumentation. Never characterize
          double/mock-only probes as integrated evidence.
          EOF
          tar -czf map079-offline-runtime.tgz -C "$offline_dir" repository
          ls -lh map079-offline-runtime.tgz

      - name: Upload MAP-079 offline independent-review runtime
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 217
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map079-offline-runtime-${{ github.run_id }}
          path: map079-offline-runtime.tgz
          retention-days: 14
          if-no-files-found: error

      - name: Verify preinstalled Playwright browsers
        run: npx playwright --version

      - name: Run Chromium and WebKit end-to-end tests
        run: npm run test:e2e -- --project=chromium --project=webkit-map061 --project=mobile-chromium --project=mobile-webkit

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MAP-033 mobile visual references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-033-mobile-references-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MAP-037 mobile sheet references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-037-mobile-sheet-references-${{ github.run_id }}
          path: test-results/**/attachments/MAP-037-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke test the Pages build locally
        run: npm run test:e2e:pages

  firefox:
    name: Firefox accessibility and MAP-061 browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox browser
        run: npx playwright install firefox

      - name: Run Firefox end-to-end tests
        run: npm run test:e2e -- --project=firefox --project=firefox-map061

      - name: Upload Firefox failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-failure-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: warn
          retention-days: 14

  database:
    name: Supabase migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Rebuild, lint and test database
        run: npm run supabase:db:validate

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
