name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - agent/map-061-campaign-regions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Apply MAP-061 self-review fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-061-campaign-regions

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch focus restoration and editing regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/main.ts',
              """  const focusPinControl = (pin: AtlasPinMarkerModel): void => {
    const [lat, lng] = pin.coordinate;
    const element = Array.from(
      app.querySelectorAll<HTMLElement>('.campaign-marker-icon[data-marker-lat][data-marker-lng]'),
    ).find(
      (candidate) =>
        Number(candidate.dataset.markerLat) === lat && Number(candidate.dataset.markerLng) === lng,
    );

    element?.focus({ preventScroll: true });
  };
""",
              """  const focusPinControl = (pin: AtlasPinMarkerModel): void => {
    const region = Array.from(
      app.querySelectorAll<HTMLElement>('.campaign-region[data-region-id]'),
    ).find((candidate) => candidate.dataset.regionId === pin.id);
    if (region) {
      region.focus({ preventScroll: true });
      return;
    }

    const [lat, lng] = pin.coordinate;
    const element = Array.from(
      app.querySelectorAll<HTMLElement>('.campaign-marker-icon[data-marker-lat][data-marker-lng]'),
    ).find(
      (candidate) =>
        Number(candidate.dataset.markerLat) === lat && Number(candidate.dataset.markerLng) === lng,
    );

    element?.focus({ preventScroll: true });
  };
""",
          )

          replace_once(
              'tests/e2e/map061-campaign-regions.spec.ts',
              """  await expect(cromryn).toHaveClass(/campaign-region--active/);
  await expect(cromryn).toHaveAttribute('aria-pressed', 'true');

  await closeDetails(page);
  await cromryn.focus();
""",
              """  await expect(cromryn).toHaveClass(/campaign-region--active/);
  await expect(cromryn).toHaveAttribute('aria-pressed', 'true');

  await closeDetails(page);
  await expect(cromryn).toBeFocused();
  await cromryn.focus();
""",
          )

          replace_once(
              'tests/e2e/map061-admin-regions.spec.ts',
              """  await expect(page.getByTestId(`admin-player-association-${PLAYER_ID}`)).toBeChecked();
  await page.getByTestId('admin-geometry-kind').selectOption('polygon');

  const firstVertex = page.getByTestId('admin-polygon-vertex-0');
""",
              """  await expect(page.getByTestId(`admin-player-association-${PLAYER_ID}`)).toBeChecked();
  await page.getByTestId('admin-geometry-kind').selectOption('polygon');

  const canvas = page.getByTestId('admin-coordinate-map');
  const canvasBox = await canvas.boundingBox();
  expect(canvasBox).not.toBeNull();
  if (!canvasBox) throw new Error('El mapa administrativo no tiene un área interactiva.');
  await page.mouse.click(
    canvasBox.x + canvasBox.width / 2,
    canvasBox.y + canvasBox.height / 2,
  );
  await expect(page.locator('[data-testid^="admin-polygon-vertex-"]')).toHaveCount(5);
  const deleteVertex = page.getByTestId('admin-polygon-delete-vertex');
  await expect(deleteVertex).toBeEnabled();
  await deleteVertex.click();
  await expect(page.locator('[data-testid^="admin-polygon-vertex-"]')).toHaveCount(4);

  const firstVertex = page.getByTestId('admin-polygon-vertex-0');
""",
          )
          PY

          npx prettier --write src/main.ts tests/e2e/map061-campaign-regions.spec.ts tests/e2e/map061-admin-regions.spec.ts
          git diff --check

          if git diff --quiet; then
            echo "Self-review fixes are already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts tests/e2e/map061-campaign-regions.spec.ts tests/e2e/map061-admin-regions.spec.ts
          git commit -m "fix: restore region focus and cover vertex deletion"
          git push origin HEAD:agent/map-061-campaign-regions
