name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-e2e:
    name: Diagnose MAP-026 E2E failures
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Capture existing E2E regression
        id: existing
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics
          mapfile -t specs < <(find tests/e2e -name '*.spec.ts' ! -name 'public-pin-request.spec.ts' -print)
          set -o pipefail
          npx playwright test "${specs[@]}" 2>&1 | tee diagnostics/existing-e2e.log

      - name: Capture MAP-026 mobile accessibility failure
        id: mobile
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics
          set -o pipefail
          npx playwright test tests/e2e/public-pin-request.spec.ts --grep "keeps the request flow accessible" 2>&1 | tee diagnostics/map026-mobile.log

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-026-e2e-diagnostics
          path: diagnostics/*.log
          retention-days: 1

      - name: Existing E2E regression remains
        if: ${{ always() && steps.existing.outcome != 'success' }}
        run: exit 1

      - name: MAP-026 mobile accessibility failure remains
        if: ${{ always() && steps.mobile.outcome != 'success' }}
        run: exit 1
