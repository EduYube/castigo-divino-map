name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Bootstrap lockfile and install dependencies
        run: npm install

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Commit generated lockfile to the pull request branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked"
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const content = (await readFile('package-lock.json')).toString('base64');
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/package-lock.json`,
            {
              method: 'PUT',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                message: 'MAP-011: añadir lockfile reproducible',
                content,
                branch: process.env.HEAD_BRANCH,
              }),
            },
          );

          if (!response.ok) {
            throw new Error(`${response.status} ${await response.text()}`);
          }
          NODE

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application for GitHub Pages
        run: npm run build:pages

      - name: Audit production artifact
        run: npm run verify:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Smoke test the Pages build locally
        run: npm run test:e2e:pages
