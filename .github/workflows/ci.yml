name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format MAP-044 sources
        run: |
          npx prettier --write --end-of-line auto \
            src/app/adminAuthRuntime.ts \
            src/app/adminMapEntityAudience.ts \
            src/app/adminPinVisualSync.ts \
            src/app/masterMode.ts \
            src/app/masterPinVisuals.ts \
            src/app/masterSearchVisuals.ts \
            src/application/adminMapEntityController.ts \
            src/application/masterModeController.ts \
            src/data-access/masterCatalog.ts \
            src/data/masterCatalogView.ts \
            src/infrastructure/supabase/masterCatalogRepository.ts \
            src/main.ts

      - name: Stage formatted files for export
        run: |
          mkdir -p map044-formatted/src/app \
            map044-formatted/src/application \
            map044-formatted/src/data-access \
            map044-formatted/src/data \
            map044-formatted/src/infrastructure/supabase
          cp src/app/adminAuthRuntime.ts map044-formatted/src/app/
          cp src/app/adminMapEntityAudience.ts map044-formatted/src/app/
          cp src/app/adminPinVisualSync.ts map044-formatted/src/app/
          cp src/app/masterMode.ts map044-formatted/src/app/
          cp src/app/masterPinVisuals.ts map044-formatted/src/app/
          cp src/app/masterSearchVisuals.ts map044-formatted/src/app/
          cp src/application/adminMapEntityController.ts map044-formatted/src/application/
          cp src/application/masterModeController.ts map044-formatted/src/application/
          cp src/data-access/masterCatalog.ts map044-formatted/src/data-access/
          cp src/data/masterCatalogView.ts map044-formatted/src/data/
          cp src/infrastructure/supabase/masterCatalogRepository.ts map044-formatted/src/infrastructure/supabase/
          cp src/main.ts map044-formatted/src/

      - name: Upload formatted MAP-044 sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-044-formatted-sources-${{ github.run_id }}
          path: map044-formatted
          if-no-files-found: error
          retention-days: 1

      - name: Keep diagnostic PR unmergeable
        run: exit 1
