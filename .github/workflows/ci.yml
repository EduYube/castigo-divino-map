name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format final MAP-044 sources
        run: |
          npx prettier --write --end-of-line auto \
            src/application/masterModeController.test.ts \
            src/data/masterCatalogView.test.ts \
            tests/e2e/master-mode.spec.ts \
            verify-production-build.mjs

      - name: Stage formatted files for export
        run: |
          mkdir -p map044-formatted/src/application \
            map044-formatted/src/data \
            map044-formatted/tests/e2e
          cp src/application/masterModeController.test.ts map044-formatted/src/application/
          cp src/data/masterCatalogView.test.ts map044-formatted/src/data/
          cp tests/e2e/master-mode.spec.ts map044-formatted/tests/e2e/
          cp verify-production-build.mjs map044-formatted/

      - name: Upload formatted MAP-044 sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-044-final-formatted-${{ github.run_id }}
          path: map044-formatted
          if-no-files-found: error
          retention-days: 1

      - name: Keep diagnostic PR unmergeable
        run: exit 1
