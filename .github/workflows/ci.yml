name: CI

on:
  pull_request:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write
  actions: write
  statuses: write

jobs:
  dispatch-definitive-ci:
    name: Restore and launch definitive CI
    if: >-
      github.event.pull_request.number == 60 &&
      contains(github.event.pull_request.body, '<!-- map-016-dispatch -->')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout MAP-016 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-016-public-data-resilience
          fetch-depth: 0

      - name: Restore normal CI and create clean head
        env:
          CLEAN_BASE_SHA: 96fe09f7ea7c291e52c66509028cbc2984ce0186
        shell: bash
        run: |
          set -euo pipefail
          git show "$CLEAN_BASE_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: restore normal MAP-016 validation"
          git push origin HEAD:agent/map-016-public-data-resilience

      - name: Launch and monitor definitive CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/map-016-public-data-resilience
        shell: bash
        run: |
          set -euo pipefail
          new_sha=$(git rev-parse HEAD)
          api="https://api.github.com/repos/$REPOSITORY"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          curl --fail-with-body --silent --show-error -X POST \
            "${headers[@]}" \
            "$api/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}"

          run_id=""
          run_url=""
          for _ in $(seq 1 60); do
            response=$(curl --fail-with-body --silent --show-error \
              "${headers[@]}" \
              "$api/actions/workflows/ci.yml/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20")
            run_id=$(jq -r --arg sha "$new_sha" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$response" | head -n 1)
            run_url=$(jq -r --arg sha "$new_sha" '.workflow_runs[] | select(.head_sha == $sha) | .html_url' <<<"$response" | head -n 1)

            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "The definitive CI run could not be located." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error -X POST \
            "${headers[@]}" \
            "$api/statuses/$new_sha" \
            -d "{\"state\":\"pending\",\"target_url\":\"$run_url\",\"description\":\"Definitive CI is running\",\"context\":\"map-016/definitive-ci\"}" >/dev/null

          conclusion=""
          for _ in $(seq 1 360); do
            run=$(curl --fail-with-body --silent --show-error \
              "${headers[@]}" \
              "$api/actions/runs/$run_id")
            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run")

            if [[ "$status" == "completed" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$conclusion" == "success" ]]; then
            state=success
            description="Definitive CI passed"
          else
            state=failure
            description="Definitive CI failed: ${conclusion:-unknown}"
          fi

          curl --fail-with-body --silent --show-error -X POST \
            "${headers[@]}" \
            "$api/statuses/$new_sha" \
            -d "{\"state\":\"$state\",\"target_url\":\"$run_url\",\"description\":\"$description\",\"context\":\"map-016/definitive-ci\"}" >/dev/null

          echo "Definitive CI: $run_url"
          [[ "$conclusion" == "success" ]]
