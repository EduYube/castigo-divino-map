name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-map064-master-contract:
    name: Integrate MAP-064 Master lifecycle contract
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/map-064-mission-hazard-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Master wire-contract fix
        run: node scripts/map064-master-contract-fix.mjs

      - name: Remove integration scaffolding
        run: |
          git rm scripts/map064-master-contract-fix.mjs
          git checkout origin/master -- .github/workflows/ci.yml

      - name: Commit fix and regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260902111000_add_mission_hazard_lifecycle.sql supabase/tests/database/038_mission_hazard_lifecycle.test.sql .github/workflows/ci.yml
          git commit -m "fix(map-064): align Master lifecycle wire contract"
          git push origin HEAD:${{ github.head_ref }}
