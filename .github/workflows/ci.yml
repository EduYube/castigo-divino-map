name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair MAP-054 branch files
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/map-054-campaign-roster-admin'
        env:
          MAP054_HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$MAP054_HEAD_REF"
          git checkout -B "$MAP054_HEAD_REF" "origin/$MAP054_HEAD_REF"
          git fetch origin 403fd75fcc1258b838aa73a3e2f67e3a252e5c6d --depth=1
          git show 403fd75fcc1258b838aa73a3e2f67e3a252e5c6d:src/app/adminCampaignRoster.ts > /tmp/adminCampaignRoster.ts
          python - <<'PY'
          from pathlib import Path

          ui = Path('src/app/adminCampaignRoster.ts')
          text = Path('/tmp/adminCampaignRoster.ts').read_text()
          old = """  const shell = root.querySelector<HTMLElement>('.admin-auth__shell');
          const summary = root.querySelector<HTMLElement>('.admin-auth__summary');
          const logout = root.querySelector<HTMLElement>('.admin-auth__logout');
          if (!shell || !summary || !logout) {
            throw new Error('Missing administrative shell for MAP-054.');
          }

          summary.textContent =
          """
          new = """  const shellCandidate = root.querySelector<HTMLElement>('.admin-auth__shell');
          const summary = root.querySelector<HTMLElement>('.admin-auth__summary');
          const logout = root.querySelector<HTMLElement>('.admin-auth__logout');
          if (!shellCandidate || !summary || !logout) {
            throw new Error('Missing administrative shell for MAP-054.');
          }
          const shell: HTMLElement = shellCandidate;

          summary.textContent =
          """
          if old not in text:
              raise SystemExit('MAP-054 admin shell block not found')
          ui.write_text(text.replace(old, new, 1))

          sql = Path('supabase/tests/database/025_campaign_roster_admin.test.sql')
          text = sql.read_text()
          old = """select is(
            (
              with updated as (
                update public.players
                set display_name = 'Tampered'
                where id = 'player-map054-b'
                returning 1
              )
              select count(*) from updated
            ),
            0::bigint,
            'authenticated non-admin cannot edit another campaign roster'
          );
          """
          new = """update public.players
          set display_name = 'Tampered'
          where id = 'player-map054-b';

          select is(
            (
              select count(*)
              from public.players
              where id = 'player-map054-b'
                and display_name = 'Tampered'
            ),
            0::bigint,
            'authenticated non-admin cannot edit another campaign roster'
          );
          """
          if old not in text:
              raise SystemExit('MAP-054 pgTAP update assertion block not found')
          sql.write_text(text.replace(old, new, 1))
          PY
          npm run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/adminCampaignRoster.ts src/application/adminCampaignRosterController.test.ts supabase/tests/database/025_campaign_roster_admin.test.sql
          if ! git diff --cached --quiet; then
            git commit -m "fix(map-054): repair admin roster validation gates"
            git push origin "HEAD:$MAP054_HEAD_REF"
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Audit tracked files for privileged credentials
        run: npm run verify:security

      - name: Verify accessibility invariants
        run: npm run verify:accessibility

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build application for GitHub Pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ehpouvbzmvwbkkoypgfa.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_b5Kx8EpNWtRvUHSvHPrQIA_pdOZT7p0' }}
        run: npm run build:pages

      - name: Audit production artifact
        run: npm run verify:build

      - name: Report production build metrics
        run: npm run report:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload MAP-033 mobile visual references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-033-mobile-references-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MAP-037 mobile sheet references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-037-mobile-sheet-references-${{ github.run_id }}
          path: test-results/**/attachments/MAP-037-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke test the Pages build locally
        run: npm run test:e2e:pages

  database:
    name: Supabase migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record pinned Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Rebuild, lint and test database
        run: npm run supabase:db:validate

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
