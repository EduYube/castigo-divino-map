name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - agent/map-061-campaign-regions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Apply MAP-061 self-review fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-061-campaign-regions

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch, format and push
        shell: bash
        run: |
          echo '' | base64 --decode | python3
          npx prettier --write src/main.ts tests/e2e/map061-campaign-regions.spec.ts tests/e2e/map061-admin-regions.spec.ts
          git diff --check
          if git diff --quiet; then
            echo "Self-review fixes are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts tests/e2e/map061-campaign-regions.spec.ts tests/e2e/map061-admin-regions.spec.ts
          git commit -m "fix: restore region focus and cover vertex deletion"
          git push origin HEAD:agent/map-061-campaign-regions
