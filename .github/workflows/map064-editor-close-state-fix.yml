name: MAP064 editor close-state fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/map-064-mission-hazard-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix stale editor-key button state and lock regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/app/adminMapEntities.ts')
          s = p.read_text()
          old = """  function render(nextState: AdminMapEntityState): void {\n    state = nextState;\n    const unavailable = !state.authorized || !state.backendConnected;\n"""
          new = """  function render(nextState: AdminMapEntityState): void {\n    state = nextState;\n    const desiredEditorKey = state.creating\n      ? `new:${requestedEntityType}`\n      : state.editorDetail\n        ? `${state.editorDetail.record.id}:${state.editorDetail.record.updatedAt}`\n        : null;\n    const unavailable = !state.authorized || !state.backendConnected;\n"""
          if old not in s:
              raise SystemExit('render opening anchor missing')
          s = s.replace(old, new, 1)

          old = """    createCharacterButton.disabled =\n      unavailable || state.phase !== 'ready' || renderedEditorKey !== null;\n"""
          new = """    createCharacterButton.disabled =\n      unavailable || state.phase !== 'ready' || desiredEditorKey !== null;\n"""
          if old not in s:
              raise SystemExit('create button state anchor missing')
          s = s.replace(old, new, 1)

          old = """    const desiredEditorKey = state.creating\n      ? `new:${requestedEntityType}`\n      : state.editorDetail\n        ? `${state.editorDetail.record.id}:${state.editorDetail.record.updatedAt}`\n        : null;\n    if (desiredEditorKey !== renderedEditorKey) {\n"""
          new = """    if (desiredEditorKey !== renderedEditorKey) {\n"""
          if old not in s:
              raise SystemExit('late desired editor key anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/e2e/admin-map-entities.spec.ts')
          s = p.read_text()
          old = """  await page.getByRole('button', { name: 'Cerrar editor' }).click();\n  await page.getByRole('button', { name: 'Crear peligro' }).click();\n"""
          new = """  await page.getByRole('button', { name: 'Cerrar editor' }).click();\n  await expect(page.getByRole('button', { name: 'Crear peligro' })).toBeEnabled();\n  await page.getByRole('button', { name: 'Crear peligro' }).click();\n"""
          if old not in s:
              raise SystemExit('MAP-064 close/create hazard anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier --write src/app/adminMapEntities.ts tests/e2e/admin-map-entities.spec.ts
          npx prettier --check src/app/adminMapEntities.ts tests/e2e/admin-map-entities.spec.ts
      - name: Remove integration workflow
        run: rm .github/workflows/map064-editor-close-state-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/adminMapEntities.ts tests/e2e/admin-map-entities.spec.ts .github/workflows/map064-editor-close-state-fix.yml
          git commit -m 'fix(map-064): re-enable creation after closing editor'
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
