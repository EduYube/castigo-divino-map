name: MAP-058 temporary fixture fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  fix:
    name: Align legacy player accent fixtures
    if: github.head_ref == 'agent/map-058-player-associations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MAP-058 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-058-player-associations

      - name: Align fixtures
        run: node scripts/map058-fix-legacy-player-accents.mjs

      - name: Format fixtures
        run: npx prettier --write --end-of-line auto tests/e2e/full-entity-details.spec.ts tests/e2e/compact-pin-details.spec.ts tests/e2e/map037-mobile-details.spec.ts tests/e2e/pin-density.spec.ts

      - name: Commit fixture alignment
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fixture changes remain."
            exit 0
          fi
          git config user.name "Eduardo Yubero Lavandeira"
          git config user.email "33625448+EduYube@users.noreply.github.com"
          git add tests/e2e/full-entity-details.spec.ts tests/e2e/compact-pin-details.spec.ts tests/e2e/map037-mobile-details.spec.ts tests/e2e/pin-density.spec.ts
          git commit -m "MAP-058 align legacy player accent fixtures"
          git push origin HEAD:agent/map-058-player-associations
