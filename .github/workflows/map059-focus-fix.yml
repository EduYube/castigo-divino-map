name: MAP-059 focus compatibility fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/map-059-proximity-spiderfy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore singleton focus timing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/map/leaflet.ts')
          source = path.read_text()
          old = """    const marker = group.marker;\n    if (focus) {\n      window.requestAnimationFrame(() => marker.getElement()?.focus({ preventScroll: true }));\n    }\n"""
          new = """    const marker = group.marker;\n    if (focus) marker.getElement()?.focus({ preventScroll: true });\n"""
          assert old in source, 'expected singleton focus block not found'
          path.write_text(source.replace(old, new))
          PY
          npx prettier --write src/map/leaflet.ts
      - name: Commit compatibility fix
        run: |
          if git diff --quiet -- src/map/leaflet.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/map/leaflet.ts
          git commit -m 'MAP-059: restore singleton focus timing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
