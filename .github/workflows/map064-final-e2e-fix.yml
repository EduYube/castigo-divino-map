name: MAP-064 final E2E corrections

on:
  push:
    branches:
      - agent/map-064-mission-hazard-lifecycle
    paths:
      - .github/workflows/map064-final-e2e-fix.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-064-mission-hazard-lifecycle
          fetch-depth: 0

      - name: Patch deterministic E2E expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/admin-map-entities.spec.ts')
          text = path.read_text()

          old_heading = "getByRole('heading', { name: 'Personajes y emplazamientos' })"
          new_heading = "getByRole('heading', { name: 'Entidades del mapa' })"
          heading_count = text.count(old_heading)
          if heading_count != 2:
              raise SystemExit(f'expected 2 legacy heading assertions, found {heading_count}')
          text = text.replace(old_heading, new_heading)

          old_coords = "  await page.getByLabel('Coordenada X').fill('1490');\n  await page.getByLabel('Coordenada Y').fill('1010');"
          new_coords = "  await page.getByLabel('Coordenada X').fill('1700');\n  await page.getByLabel('Coordenada Y').fill('1300');"
          coord_count = text.count(old_coords)
          if coord_count != 1:
              raise SystemExit(f'expected 1 MAP-064 hazard coordinate block, found {coord_count}')
          text = text.replace(old_coords, new_coords)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed test
        run: npx prettier --write tests/e2e/admin-map-entities.spec.ts

      - name: Remove integration workflow and commit clean tree
        shell: bash
        run: |
          git rm .github/workflows/map064-final-e2e-fix.yml
          git add tests/e2e/admin-map-entities.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(map-064): isolate lifecycle E2E from clustering"
          git push origin HEAD:agent/map-064-mission-hazard-lifecycle
