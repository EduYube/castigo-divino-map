name: MAP-080 temporary formatter
on:
  push:
    branches:
      - agent/map-080-snapshot-degraded-multimap
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize formatting on MAP-080 branch only
        run: |
          npm run format
          git diff --stat
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style(MAP-080): normalize V4 implementation formatting"
            git push origin HEAD:refs/heads/agent/map-080-snapshot-degraded-multimap
          fi
