name: MAP-041 Leaflet Restore

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-041-geographic-search-extents
          fetch-depth: 0
      - name: Restore previously compiled Leaflet implementation
        run: |
          git checkout 7128f56ac62a7bfb5d14620263f735f7bcb7f4f1 -- src/map/leaflet.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/map/leaflet.ts')
          text = path.read_text()
          old_clear = """    delete elements.shell.dataset.searchHighlight;\n    delete elements.shell.dataset.searchHighlightLabel;\n"""
          new_clear = """    delete elements.shell.dataset.searchHighlight;\n    delete elements.shell.dataset.searchHighlightKind;\n    delete elements.shell.dataset.searchHighlightLabel;\n"""
          old_show = """    elements.shell.dataset.searchHighlight = 'true';\n    elements.shell.dataset.searchHighlightLabel = target.label;\n    elements.searchStatus.textContent = `Mapa centrado en ${target.label}. La posición está resaltada temporalmente con un símbolo circular.`;\n"""
          new_show = """    elements.shell.dataset.searchHighlight = 'true';\n    elements.shell.dataset.searchHighlightKind = 'point';\n    elements.shell.dataset.searchHighlightLabel = target.label;\n    elements.searchStatus.textContent = `Mapa centrado en ${target.label}; posición resaltada.`;\n"""
          if old_clear not in text or old_show not in text:
              raise SystemExit('Expected compiled MAP-041 Leaflet markers were not found')
          path.write_text(text.replace(old_clear, new_clear).replace(old_show, new_show))
          PY
          npx prettier --write --end-of-line auto src/map/leaflet.ts
          git rm .github/workflows/map041-leaflet-restore.yml
      - name: Commit restored implementation and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/leaflet.ts
          git commit -m "fix(MAP-041): restore compiled Leaflet implementation"
          git push origin HEAD:agent/map-041-geographic-search-extents
