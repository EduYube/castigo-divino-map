name: MAP-063 temporary transaction lock diagnostic

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase stack
        run: npx supabase start
      - name: Reset database and diagnose transaction visibility
        run: |
          npm run supabase:db:reset
          node - <<'NODE'
          const { spawn, spawnSync } = require('node:child_process');

          const container = 'supabase_db_castigo-divino-map';
          const playerId = 'player-skade';
          const entityId = 'place-demo-harbor';
          const adminSub = '00000000-0000-4000-8000-000000000001';
          const timeoutMs = 12000;

          function args(interactive = false) {
            return [
              'exec',
              ...(interactive ? ['--interactive'] : []),
              '--user', 'postgres',
              container,
              'psql', '--username', 'postgres', '--dbname', 'postgres',
              '--no-psqlrc', '--set=ON_ERROR_STOP=1', '--quiet', '--tuples-only', '--no-align',
            ];
          }

          function run(sql) {
            const result = spawnSync('docker', [...args(false), '--command', sql], { encoding: 'utf8' });
            if (result.status !== 0) throw new Error(result.stderr || `psql exited ${result.status}`);
            return result.stdout.trim();
          }

          function session(name) {
            const child = spawn('docker', args(true), { stdio: ['pipe', 'pipe', 'pipe'] });
            let stdout = '';
            let stderr = '';
            let exited = false;
            let exitCode = null;
            child.stdout.setEncoding('utf8');
            child.stderr.setEncoding('utf8');
            child.stdout.on('data', (chunk) => { stdout += chunk; });
            child.stderr.on('data', (chunk) => { stderr += chunk; });
            child.on('close', (code) => { exited = true; exitCode = code; });
            child.stdin.write(`set application_name = '${name}';\n`);
            return {
              child,
              get output() { return `${stdout}\n${stderr}`.trim(); },
              get exited() { return exited; },
              get exitCode() { return exitCode; },
            };
          }

          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function waitFor(session, marker) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              if (session.output.includes(marker)) return;
              if (session.exited) throw new Error(`session exited before ${marker}: ${session.output}`);
              await delay(20);
            }
            throw new Error(`timeout waiting for ${marker}: ${session.output}`);
          }

          function activity(name) {
            return run(`
              select concat_ws('|', state, coalesce(wait_event_type, ''), coalesce(wait_event, ''),
                     case when xact_start is null then 'no-xact' else 'xact' end,
                     case when backend_xid is null then 'no-xid' else 'xid' end)
              from pg_catalog.pg_stat_activity
              where application_name = '${name}';
            `);
          }

          function blockers(name) {
            return run(`
              select coalesce(pg_catalog.array_to_string(pg_catalog.pg_blocking_pids(pid), ','), '')
              from pg_catalog.pg_stat_activity
              where application_name = '${name}';
            `);
          }

          async function main() {
            run(`
              update public.players set publication_status='draft'::public.publication_status
              where id='${playerId}' and publication_status='archived'::public.publication_status;
              update public.players set publication_status='published'::public.publication_status
              where id='${playerId}' and publication_status<>'published'::public.publication_status;
            `);
            console.log('initial_external_player=' + run(`select publication_status from public.players where id='${playerId}';`));

            const admin = session('map063_diag_admin');
            const claims = JSON.stringify({ sub: adminSub, role: 'authenticated' }).replaceAll("'", "''");
            admin.child.stdin.write(`
              set "request.jwt.claim.sub"='${adminSub}';
              set "request.jwt.claims"='${claims}';
              set role authenticated;
              set statement_timeout='8s';
              begin;
              update public.players
              set publication_status='archived'::public.publication_status
              where id='${playerId}'
              returning publication_status;
              \\echo ADMIN_READY
            `);
            await waitFor(admin, 'ADMIN_READY');
            console.log('admin_output_after_ready=' + JSON.stringify(admin.output));
            console.log('admin_activity_after_ready=' + activity('map063_diag_admin'));
            console.log('external_player_while_admin_open=' + run(`select publication_status from public.players where id='${playerId}';`));

            const rpc = session('map063_diag_rpc');
            rpc.child.stdin.write(`
              set role anon;
              set statement_timeout='8s';
              \\echo RPC_STARTED
              select id from public.create_public_player_note(
                '${entityId}', '${playerId}', 'MAP063 diagnostic note', 'diagnostic body'
              );
              \\echo RPC_DONE
            `);
            await waitFor(rpc, 'RPC_STARTED');
            await delay(300);
            console.log('rpc_exited_after_300ms=' + rpc.exited);
            console.log('rpc_output_after_300ms=' + JSON.stringify(rpc.output));
            console.log('rpc_activity_after_300ms=' + activity('map063_diag_rpc'));
            console.log('rpc_blockers_after_300ms=' + blockers('map063_diag_rpc'));
            console.log('admin_activity_with_rpc=' + activity('map063_diag_admin'));
            console.log('external_player_with_rpc=' + run(`select publication_status from public.players where id='${playerId}';`));

            if (rpc.exited) {
              throw new Error('RPC exited while admin transaction should still hold the player row lock');
            }
            if (!activity('map063_diag_rpc').includes('|Lock|')) {
              throw new Error('RPC is alive but PostgreSQL does not report a lock wait');
            }

            admin.child.stdin.write('commit;\n\\echo ADMIN_COMMITTED\n\\q\n');
            await waitFor(admin, 'ADMIN_COMMITTED');
            const deadline = Date.now() + timeoutMs;
            while (!rpc.exited && Date.now() < deadline) await delay(20);
            console.log('rpc_final_output=' + JSON.stringify(rpc.output));
            console.log('rpc_final_exit=' + rpc.exitCode);
            if (!rpc.exited) throw new Error('RPC did not finish after admin commit');
            if (!rpc.output.includes('invalid public note author')) {
              throw new Error('RPC did not revalidate the player after serialized revocation');
            }
            console.log('DIAGNOSTIC_OK');
          }

          main().catch((error) => {
            console.error(error.stack || error.message || error);
            process.exitCode = 1;
          });
          NODE
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
