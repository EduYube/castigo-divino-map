name: MAP-045 Bootstrap Diagnostic

on:
  push:
    branches:
      - agent/map-045-bootstrap-diagnostic

permissions:
  contents: read

jobs:
  focused-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/master-mode-startup-revocation.spec.ts --project=chromium
