name: MAP-045 Bootstrap Diagnostic

on:
  push:
    branches:
      - agent/map-045-bootstrap-diagnostic

permissions:
  contents: read

jobs:
  focused-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instrument the single startup-race test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/master-mode-startup-revocation.spec.ts')
          text = path.read_text()
          old = """  const backend = await configureStartupRaceBackend(page);\n  await page.goto('/');\n"""
          new = """  const backend = await configureStartupRaceBackend(page);\n  await page.addInitScript(() => {\n    const diagnosticWindow = window as Window & { __MAP045_AUDIENCE_EVENTS__?: unknown[] };\n    diagnosticWindow.__MAP045_AUDIENCE_EVENTS__ = [];\n    window.addEventListener('atlas:admin-entity-audience-changed', (event) => {\n      diagnosticWindow.__MAP045_AUDIENCE_EVENTS__?.push((event as CustomEvent).detail);\n    });\n  });\n  await page.goto('/');\n"""
          if text.count(old) != 1:
              raise SystemExit('initial diagnostic anchor mismatch')
          text = text.replace(old, new, 1)
          old = """  await expect.poll(() => backend.getSaveCount()).toBe(1);\n  await expect.poll(() => backend.getAudience()).toBe('master');\n\n  backend.failDelayedPublicInitialization();\n"""
          new = """  await expect.poll(() => backend.getSaveCount()).toBe(1);\n  await expect.poll(() => backend.getAudience()).toBe('master');\n  console.log(\n    'MAP045_DIAG_AFTER_SAVE',\n    await page.evaluate((entityId) => {\n      const diagnosticWindow = window as Window & { __MAP045_AUDIENCE_EVENTS__?: unknown[] };\n      return {\n        events: diagnosticWindow.__MAP045_AUDIENCE_EVENTS__ ?? [],\n        markerCount: document.querySelectorAll(\n          `[data-testid=\\\"place-marker\\\"][data-place-id=\\\"${entityId}\\\"]`,\n        ).length,\n        publicStatus: document.documentElement.dataset.publicDataStatus ?? null,\n      };\n    }, RACE_ENTITY_ID),\n  );\n\n  backend.failDelayedPublicInitialization();\n"""
          if text.count(old) != 1:
              raise SystemExit('post-save diagnostic anchor mismatch')
          text = text.replace(old, new, 1)
          old = """  await expect\n    .poll(() => page.locator('html').getAttribute('data-public-data-status'))\n    .toMatch(/available|degraded/);\n"""
          new = """  await expect\n    .poll(() => page.locator('html').getAttribute('data-public-data-status'))\n    .toMatch(/available|degraded/);\n  console.log(\n    'MAP045_DIAG_AFTER_PUBLIC_FAILURE',\n    await page.evaluate((entityId) => {\n      const diagnosticWindow = window as Window & { __MAP045_AUDIENCE_EVENTS__?: unknown[] };\n      return {\n        events: diagnosticWindow.__MAP045_AUDIENCE_EVENTS__ ?? [],\n        markerCount: document.querySelectorAll(\n          `[data-testid=\\\"place-marker\\\"][data-place-id=\\\"${entityId}\\\"]`,\n        ).length,\n        publicStatus: document.documentElement.dataset.publicDataStatus ?? null,\n      };\n    }, RACE_ENTITY_ID),\n  );\n"""
          if text.count(old) != 1:
              raise SystemExit('post-failure diagnostic anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/master-mode-startup-revocation.spec.ts --project=chromium
