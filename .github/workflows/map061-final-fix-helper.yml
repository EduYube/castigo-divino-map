name: MAP-061 Final Fix Helper

on:
  push:
    branches:
      - agent/map-061-campaign-regions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-061-campaign-regions

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MAP-061 final fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          replace(
              'src/styles/campaign-regions.css',
              ".campaign-region {\n  stroke: currentColor;",
              ".campaign-region {\n  pointer-events: all;\n  stroke: currentColor;",
          )

          replace(
              'src/app/masterPinVisuals.ts',
              "    for (const marker of markers) {\n      const key = coordinateKey(marker);",
              "    for (const marker of markers) {\n      // Polygon coordinates are representative points for search/detail compatibility only.\n      // They must never participate in point-marker audience aggregation or ARIA counts.\n      if (marker.mapPresentation?.kind === 'polygon') continue;\n      const key = coordinateKey(marker);",
          )

          replace(
              'tests/e2e/map061-admin-mobile.spec.ts',
              "    await page.touchscreen.tap(box.x + box.width * 0.72, box.y + box.height * 0.52);",
              "    await canvas.tap({ position: { x: box.width * 0.72, y: box.height * 0.52 } });",
          )

          replace(
              'tests/e2e/admin-map-entities.spec.ts',
              r"/place-map019-harbor · location · archived/",
              r"/place-map019-harbor · location · punto · archived/",
          )

          campaign = Path('tests/e2e/map061-campaign-regions.spec.ts')
          text = campaign.read_text()
          old = "  await expect(page.getByTestId('place-details')).toContainText('Cromryn remains the same entity');"
          if text.count(old) != 1:
              raise SystemExit('map061-campaign-regions: compact identity assertion changed unexpectedly')
          text = text.replace(
              old,
              "  await expect(page.getByTestId('place-details')).toHaveAttribute(\n    'data-active-pin-id',\n    REGION_A_ID,\n  );",
          )
          cromryn_clicks = text.count('  await cromryn.click();')
          if cromryn_clicks != 2:
              raise SystemExit(f'map061-campaign-regions: expected 2 cromryn clicks, found {cromryn_clicks}')
          text = text.replace(
              '  await cromryn.click();',
              '  await cromryn.click({ position: { x: 6, y: 6 } });',
          )
          overlap_clicks = text.count('  await overlap.click();')
          if overlap_clicks != 1:
              raise SystemExit(f'map061-campaign-regions: expected 1 overlap click, found {overlap_clicks}')
          text = text.replace(
              '  await overlap.click();',
              '  await overlap.click({ position: { x: 6, y: 6 } });',
          )
          campaign.write_text(text)

          replace(
              'tests/e2e/map059-master-isolation.spec.ts',
              "  await expect(regionA).toHaveAttribute('aria-description', /Contenido del Máster/i);\n\n  await clusterTwo(page).click();",
              """  await expect(regionA).toHaveAttribute('aria-description', /Contenido del Máster/i);

  // The public point and the secret polygon deliberately share the polygon's representative
  // coordinate. A point-like surface without a stable pin id must still remain purely public:
  // polygon representative points are never members of point aggregation/audience semantics.
  const coordinateSurface = page.getByTestId('map059-coordinate-surface');
  await page.evaluate(() => {
    const surface = document.createElement('div');
    surface.className = 'campaign-marker-icon';
    surface.setAttribute('data-testid', 'map059-coordinate-surface');
    surface.dataset.markerLat = '800';
    surface.dataset.markerLng = '1000';
    const visual = document.createElement('span');
    visual.className = 'pin-visual';
    surface.append(visual);
    document.querySelector('[data-map-shell]')?.append(surface);
  });
  await expect(coordinateSurface).toHaveAttribute('data-audience', 'public');
  await expect(coordinateSurface.locator('.pin-visual')).not.toHaveClass(/pin-visual--master/);
  await expect(coordinateSurface).not.toHaveAttribute('aria-label', /Máster|Región secreta/i);
  await coordinateSurface.evaluate((element) => element.remove());

  await clusterTwo(page).click();""",
          )
          PY

          npx prettier --write \
            src/app/masterPinVisuals.ts \
            src/styles/campaign-regions.css \
            tests/e2e/admin-map-entities.spec.ts \
            tests/e2e/map059-master-isolation.spec.ts \
            tests/e2e/map061-admin-mobile.spec.ts \
            tests/e2e/map061-campaign-regions.spec.ts

          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/masterPinVisuals.ts src/styles/campaign-regions.css tests/e2e
          git commit -m "fix: close MAP-061 interaction and isolation gaps"
          git push origin HEAD:agent/map-061-campaign-regions
