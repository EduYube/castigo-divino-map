name: MAP-046 snapshot E2E diagnostics

on:
  push:
    branches:
      - agent/map-046-sync-public-snapshot

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-046-sync-public-snapshot
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Make request E2E independent of pre-existing public entity pins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/public-pin-request.spec.ts')
          text = path.read_text()
          old = "  const initialPinCount = await page.getByTestId('place-marker').count();\n  const form = await openRequestForm(page);"
          new = "  const initialPinCount = await page.getByTestId('place-marker').count();\n  const initialEntityPinCount = await page.locator('[data-testid=\"entity-pin\"]').count();\n  const form = await openRequestForm(page);"
          if text.count(old) != 1:
              raise SystemExit('initial pin count anchor did not match exactly once')
          text = text.replace(old, new, 1)
          old = "  await expect(page.locator('[data-testid=\"entity-pin\"]')).toHaveCount(0);"
          new = "  await expect(page.locator('[data-testid=\"entity-pin\"]')).toHaveCount(\n    initialEntityPinCount,\n  );"
          if text.count(old) != 1:
              raise SystemExit('entity pin assertion anchor did not match exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write tests/e2e/public-pin-request.spec.ts
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/public-pin-request.spec.ts
          git commit -m 'test: preserve existing public entity pins in request flow'
          git push origin HEAD:agent/map-046-sync-public-snapshot
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Repeat public request invariant
        run: npx playwright test tests/e2e/public-pin-request.spec.ts --project=chromium --repeat-each=3 --reporter=line --max-failures=1
      - name: Stress MAP-046 publication flow without modifying it
        run: npx playwright test tests/e2e/map046-request-publication.spec.ts --project=chromium --repeat-each=10 --reporter=line --max-failures=1
