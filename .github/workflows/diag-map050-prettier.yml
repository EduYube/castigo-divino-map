name: DIAG MAP-050 Pending Filter Canonicalization

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-map050:
    if: github.head_ref == 'agent/map-050-prettier-diagnostic'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MAP-050 feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-050-beta02-public-filters
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonicalize immediately while retaining unknown filters in memory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.ts')
          text = path.read_text()

          patches = [
              (
                  r"\n    if \(initialPublicRefreshSettled \|\| !pendingInitialFilterUrl\) \{\n      writePublicStateToHistory\('replace'\);\n    \}\n  \}\n",
                  "\n    writePublicStateToHistory('replace');\n  }\n",
                  'applyCatalogState canonicalization',
              ),
              (
                  r"\n    if \(!shouldPreserveUnknownFilters\) \{\n      writePublicStateToHistory\('replace'\);\n    \}\n  \}\n",
                  "\n    writePublicStateToHistory('replace');\n  }\n",
                  'initial URL canonicalization',
              ),
          ]

          for pattern, replacement, label in patches:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')

          path.write_text(text)
          PY

      - name: Format patched source
        run: npx prettier --write src/main.ts

      - name: Verify focused quality gates
        run: |
          npm run format:check
          npm run lint
          npm run test
          npm run build:pages

      - name: Install focused Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify canonicalization and dynamic filter reload
        run: >-
          npx playwright test
          tests/e2e/url-state.spec.ts
          tests/e2e/beta02-filter-refresh.spec.ts
          tests/e2e/beta02-filters-320.spec.ts
          --project=chromium

      - name: Commit fix to feature branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          git commit -m 'MAP-050 canonicalize pending filters immediately'
          git push origin HEAD:refs/heads/agent/map-050-beta02-public-filters
