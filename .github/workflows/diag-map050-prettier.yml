name: DIAG MAP-050 Prettier

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format-map050:
    if: github.head_ref == 'agent/map-050-prettier-diagnostic'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MAP-050 feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-050-beta02-public-filters
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format 320px spec
        run: npx prettier --write tests/e2e/beta02-filters-320.spec.ts

      - name: Commit formatting to feature branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/beta02-filters-320.spec.ts
          git commit -m 'MAP-050 format 320px filter test'
          git push origin HEAD:refs/heads/agent/map-050-beta02-public-filters
