name: MAP-018 one-shot branch fixer

on:
  push:
    branches:
      - agent/map-018-admin-taxonomy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-018-admin-taxonomy

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MAP-018 CI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))

          replace_if_present(
              "supabase/tests/database/009_admin_catalog_crud.test.sql",
              "select plan(18);",
              "select plan(19);",
          )
          replace_if_present(
              "src/app/adminAuthRuntime.ts",
              "import './adminCatalog';\n",
              "",
          )
          replace_if_present(
              "src/app/adminCatalog.ts",
              "  editorStatus.setAttribute('aria-live', 'assertive');\n",
              "  editorStatus.setAttribute('aria-live', 'assertive');\n  editorStatus.tabIndex = -1;\n",
          )
          replace_if_present(
              "src/app/adminCatalog.ts",
              """    addField(form, controls, {
              name: 'id',
              label: 'ID estable',
              value: draft.id,
              required: true,
              readOnly: Boolean(record),
            });
            if (fields.parentElement !== form) {
              fields.append(...Array.from(form.querySelectorAll(':scope > .admin-catalog__field')));
            }
          """,
              """    const idInput = addField(form, controls, {
              name: 'id',
              label: 'ID estable',
              value: draft.id,
              required: true,
              readOnly: Boolean(record),
            });
            fields.append(idInput.closest('.admin-catalog__field') as HTMLElement);
          """,
          )
          replace_if_present(
              "tests/e2e/admin-catalog.spec.ts",
              "  await expect(page.getByLabel('Slug')).toBeFocused();\n",
              "  await expect(page.getByLabel('ID estable')).toBeFocused();\n",
          )

          runtime_path = Path("src/app/adminAuthRuntime.ts")
          runtime = runtime_path.read_text()
          method_uses = [
              (
                  """  list(
              _kind: AdminCatalogResourceKind,
              _options: { readonly signal: AbortSignal },
            ): Promise<readonly AdminCatalogRecord[]> {
              return Promise.reject(this.#error);
            }
          """,
                  """  list(
              _kind: AdminCatalogResourceKind,
              _options: { readonly signal: AbortSignal },
            ): Promise<readonly AdminCatalogRecord[]> {
              void _kind;
              void _options;
              return Promise.reject(this.#error);
            }
          """,
              ),
              (
                  """  create(
              _draft: AdminCatalogDraft,
              _options: { readonly signal: AbortSignal },
            ): Promise<AdminCatalogRecord> {
              return Promise.reject(this.#error);
            }
          """,
                  """  create(
              _draft: AdminCatalogDraft,
              _options: { readonly signal: AbortSignal },
            ): Promise<AdminCatalogRecord> {
              void _draft;
              void _options;
              return Promise.reject(this.#error);
            }
          """,
              ),
              (
                  """  update(
              _original: AdminCatalogRecord,
              _draft: AdminCatalogDraft,
              _options: { readonly signal: AbortSignal },
            ): Promise<AdminCatalogRecord> {
              return Promise.reject(this.#error);
            }
          """,
                  """  update(
              _original: AdminCatalogRecord,
              _draft: AdminCatalogDraft,
              _options: { readonly signal: AbortSignal },
            ): Promise<AdminCatalogRecord> {
              void _original;
              void _draft;
              void _options;
              return Promise.reject(this.#error);
            }
          """,
              ),
              (
                  """  archive(
              _record: AdminCatalogRecord,
              _options: { readonly signal: AbortSignal },
            ): Promise<AdminCatalogRecord> {
              return Promise.reject(this.#error);
            }
          """,
                  """  archive(
              _record: AdminCatalogRecord,
              _options: { readonly signal: AbortSignal },
            ): Promise<AdminCatalogRecord> {
              void _record;
              void _options;
              return Promise.reject(this.#error);
            }
          """,
              ),
              (
                  """  delete(_record: AdminCatalogRecord, _options: { readonly signal: AbortSignal }): Promise<void> {
              return Promise.reject(this.#error);
            }
          """,
                  """  delete(_record: AdminCatalogRecord, _options: { readonly signal: AbortSignal }): Promise<void> {
              void _record;
              void _options;
              return Promise.reject(this.#error);
            }
          """,
              ),
              (
                  """  listEntityReferences(_options: {
              readonly signal: AbortSignal;
            }): Promise<readonly AdminEntityReference[]> {
              return Promise.reject(this.#error);
            }
          """,
                  """  listEntityReferences(_options: {
              readonly signal: AbortSignal;
            }): Promise<readonly AdminEntityReference[]> {
              void _options;
              return Promise.reject(this.#error);
            }
          """,
              ),
              (
                  """  listGeographicNameReferences(_options: {
              readonly signal: AbortSignal;
            }): Promise<readonly AdminGeographicNameReference[]> {
              return Promise.reject(this.#error);
            }
          """,
                  """  listGeographicNameReferences(_options: {
              readonly signal: AbortSignal;
            }): Promise<readonly AdminGeographicNameReference[]> {
              void _options;
              return Promise.reject(this.#error);
            }
          """,
              ),
          ]
          for old, new in method_uses:
              runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)

          replace_if_present(
              "src/infrastructure/supabase/adminCatalogRepository.ts",
              "    const { id: _id, ...body } = draftBody(draft);\n    return body;\n",
              "    const { id: _id, ...body } = draftBody(draft);\n    void _id;\n    return body;\n",
          )
          PY

      - name: Format tracked sources
        run: npm run format

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/map018-format.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branch fixes remain."
            exit 0
          fi
          git commit -m "MAP-018 — Corregir validación CI y foco administrativo"
          git push origin HEAD:agent/map-018-admin-taxonomy
