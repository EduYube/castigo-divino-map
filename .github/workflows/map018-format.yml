name: MAP-018 one-shot branch fixer

on:
  push:
    branches:
      - agent/map-018-admin-taxonomy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-018-admin-taxonomy

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply MAP-018 CI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "supabase/tests/database/009_admin_catalog_crud.test.sql",
              "select plan(18);",
              "select plan(19);",
          )
          replace_once(
              "src/app/adminAuthRuntime.ts",
              "import './adminCatalog';\n",
              "",
          )
          replace_once(
              "src/app/adminCatalog.ts",
              "  editorStatus.setAttribute('aria-live', 'assertive');\n",
              "  editorStatus.setAttribute('aria-live', 'assertive');\n  editorStatus.tabIndex = -1;\n",
          )
          replace_once(
              "src/app/adminCatalog.ts",
              """    addField(form, controls, {
              name: 'id',
              label: 'ID estable',
              value: draft.id,
              required: true,
              readOnly: Boolean(record),
            });
            if (fields.parentElement !== form) {
              fields.append(...Array.from(form.querySelectorAll(':scope > .admin-catalog__field')));
            }
          """,
              """    const idInput = addField(form, controls, {
              name: 'id',
              label: 'ID estable',
              value: draft.id,
              required: true,
              readOnly: Boolean(record),
            });
            fields.append(idInput.closest('.admin-catalog__field') as HTMLElement);
          """,
          )
          replace_once(
              "tests/e2e/admin-catalog.spec.ts",
              "  await expect(page.getByLabel('Slug')).toBeFocused();\n",
              "  await expect(page.getByLabel('ID estable')).toBeFocused();\n",
          )
          PY

      - name: Format tracked sources
        run: npm run format

      - name: Remove one-shot workflow
        run: rm .github/workflows/map018-format.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MAP-018 — Corregir validación CI y foco administrativo"
          git push origin HEAD:agent/map-018-admin-taxonomy
