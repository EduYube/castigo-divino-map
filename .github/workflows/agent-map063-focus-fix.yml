name: MAP-063 temporary cancel focus fix

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch focus restoration and regression coverage
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const appPath = 'src/app/publicNotes.ts';
          let app = fs.readFileSync(appPath, 'utf8');

          function replaceOnce(source, before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(before, after);
          }

          app = replaceOnce(
            app,
            `  const focusNote = (noteId: string): void => {\n    window.requestAnimationFrame(() => {\n      elements.list\n        .querySelector<HTMLElement>(\`[data-public-note-id="\${CSS.escape(noteId)}"] h3\`)\n        ?.focus({ preventScroll: true });\n    });\n  };`,
            `  const focusNote = (noteId: string): void => {\n    window.requestAnimationFrame(() => {\n      elements.list\n        .querySelector<HTMLElement>(\`[data-public-note-id="\${CSS.escape(noteId)}"] h3\`)\n        ?.focus({ preventScroll: true });\n    });\n  };\n\n  const focusAdminAction = (noteId: string, action: 'edit' | 'archive'): void => {\n    window.requestAnimationFrame(() => {\n      elements.list\n        .querySelector<HTMLButtonElement>(\n          \`[data-public-note-id="\${CSS.escape(noteId)}"] [data-public-note-action="\${action}"]\`,\n        )\n        ?.focus({ preventScroll: true });\n    });\n  };`,
            'focus admin action helper',
          );

          app = replaceOnce(
            app,
            `    cancel.addEventListener('click', () => renderList());\n    form.addEventListener('submit', (event) => {`,
            `    cancel.addEventListener('click', () => {\n      renderList();\n      focusAdminAction(record.id, 'edit');\n    });\n    form.addEventListener('submit', (event) => {`,
            'edit cancel focus',
          );

          app = replaceOnce(
            app,
            `    cancel.addEventListener('click', () => renderList());\n    confirm.addEventListener('click', () => {`,
            `    cancel.addEventListener('click', () => {\n      renderList();\n      focusAdminAction(record.id, 'archive');\n    });\n    confirm.addEventListener('click', () => {`,
            'archive cancel focus',
          );

          app = replaceOnce(
            app,
            `        edit.type = 'button';\n        edit.textContent = 'Editar';\n        edit.setAttribute('aria-label', \`Editar nota \${record.title}\`);\n        const archive = document.createElement('button');\n        archive.type = 'button';\n        archive.textContent = 'Retirar';\n        archive.setAttribute('aria-label', \`Retirar nota \${record.title}\`);`,
            `        edit.type = 'button';\n        edit.textContent = 'Editar';\n        edit.dataset.publicNoteAction = 'edit';\n        edit.setAttribute('aria-label', \`Editar nota \${record.title}\`);\n        const archive = document.createElement('button');\n        archive.type = 'button';\n        archive.textContent = 'Retirar';\n        archive.dataset.publicNoteAction = 'archive';\n        archive.setAttribute('aria-label', \`Retirar nota \${record.title}\`);`,
            'admin action data attributes',
          );
          fs.writeFileSync(appPath, app);

          const testPath = 'tests/e2e/map063-public-player-notes.spec.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          test = replaceOnce(
            test,
            `  const playerNote = page.locator('[data-public-note-id="note-map063-player-a"]');\n  await playerNote.getByRole('button', { name: 'Editar nota Apunte de Skade' }).click();\n  const editForm = playerNote.locator('form');`,
            `  const playerNote = page.locator('[data-public-note-id="note-map063-player-a"]');\n  await playerNote.getByRole('button', { name: 'Editar nota Apunte de Skade' }).click();\n  await playerNote.getByRole('button', { name: 'Cancelar' }).click();\n  await expect(\n    playerNote.getByRole('button', { name: 'Editar nota Apunte de Skade' }),\n  ).toBeFocused();\n\n  await playerNote.getByRole('button', { name: 'Editar nota Apunte de Skade' }).click();\n  const editForm = playerNote.locator('form');`,
            'edit cancel regression',
          );
          test = replaceOnce(
            test,
            `  await edited.getByRole('button', { name: 'Retirar nota Apunte de Skade revisado' }).click();\n  await page.getByRole('button', { name: 'Confirmar retirada' }).click();`,
            `  await edited.getByRole('button', { name: 'Retirar nota Apunte de Skade revisado' }).click();\n  await edited.getByRole('button', { name: 'Cancelar' }).click();\n  await expect(\n    edited.getByRole('button', { name: 'Retirar nota Apunte de Skade revisado' }),\n  ).toBeFocused();\n\n  await edited.getByRole('button', { name: 'Retirar nota Apunte de Skade revisado' }).click();\n  await page.getByRole('button', { name: 'Confirmar retirada' }).click();`,
            'archive cancel regression',
          );
          fs.writeFileSync(testPath, test);
          NODE
          npx prettier --write src/app/publicNotes.ts tests/e2e/map063-public-player-notes.spec.ts
          npx prettier --check src/app/publicNotes.ts tests/e2e/map063-public-player-notes.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run MAP-063 E2E
        run: npx playwright test tests/e2e/map063-public-player-notes.spec.ts --project=chromium
      - name: Run lint and unit tests
        run: npm run lint && npm run test -- --run src/domain/publicNotes.test.ts
      - name: Commit validated fix and remove helper
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/publicNotes.ts tests/e2e/map063-public-player-notes.spec.ts
          git rm .github/workflows/agent-map063-focus-fix.yml
          git commit -m "fix(notes): restore focus after cancelled admin actions"
          git push origin HEAD:agent/map-063-public-player-notes
