name: MAP-058 temporary hardening formatter

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    name: Format MAP-058 hardened coverage
    if: github.head_ref == 'agent/map-058-player-associations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MAP-058 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/map-058-player-associations
      - name: Install dependencies
        run: npm ci
      - name: Format hardened coverage
        run: npx prettier --write --end-of-line auto tests/e2e/map058-player-associations.spec.ts tests/e2e/master-mode.spec.ts tests/e2e/admin-map-entities.spec.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Coverage is already formatted."
            exit 0
          fi
          git config user.name "Eduardo Yubero Lavandeira"
          git config user.email "33625448+EduYube@users.noreply.github.com"
          git add tests/e2e/map058-player-associations.spec.ts tests/e2e/master-mode.spec.ts tests/e2e/admin-map-entities.spec.ts
          git commit -m "MAP-058 format hardened regression coverage"
          git push origin HEAD:agent/map-058-player-associations
