name: MAP-055 deep-link contract fix

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch campaign-scoped deep links
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, oldValue, newValue, count = 1) {
            let text = fs.readFileSync(path, 'utf8');
            const occurrences = text.split(oldValue).length - 1;
            if (occurrences < count) {
              throw new Error(`Expected at least ${count} occurrence(s) in ${path}: ${oldValue}`);
            }
            for (let index = 0; index < count; index += 1) {
              text = text.replace(oldValue, newValue);
            }
            fs.writeFileSync(path, text);
          }

          replaceExact(
            'src/main.ts',
            "import { mountCompactPinDetails } from './app/compactPinDetails';\n",
            "import { mountCompactPinDetails } from './app/compactPinDetails';\nimport { INITIAL_PUBLIC_CAMPAIGN_SLUG } from './app/campaignSelection';\n",
          );
          replaceExact(
            'src/main.ts',
            "  const mapUrl = new URL(sourceUrl);\n  mapUrl.search = '';\n  mapUrl.hash = '';\n",
            "  const mapUrl = new URL(sourceUrl);\n  const campaignSlug =\n    mapUrl.searchParams.get('campaign')?.trim() || INITIAL_PUBLIC_CAMPAIGN_SLUG;\n  mapUrl.search = '';\n  mapUrl.searchParams.set('campaign', campaignSlug);\n  mapUrl.hash = '';\n",
          );

          replaceExact(
            'tests/e2e/app.spec.ts',
            "/\\?entity=puerto-de-demostracion$/",
            "/\\?entity=puerto-de-demostracion&campaign=castigo-divino$/",
          );

          replaceExact(
            'tests/e2e/full-entity-details.spec.ts',
            "const LOCAL_SUPABASE_URL = 'http://127.0.0.1:4173';\n",
            "const LOCAL_SUPABASE_URL = 'http://127.0.0.1:4173';\nconst CAMPAIGN_A_ID = '00000000-0000-4000-8000-000000000053';\n",
          );
          replaceExact(
            'tests/e2e/full-entity-details.spec.ts',
            "    const table = match?.[1] ?? '';\n    const rows = rowsByTable[table] ?? [];\n",
            [
              "    const table = match?.[1] ?? '';",
              '    const rows =',
              "      table === 'campaigns'",
              '        ? [',
              '            {',
              '              id: CAMPAIGN_A_ID,',
              "              slug: 'castigo-divino',",
              "              name: 'Castigo Divino',",
              "              status: 'active',",
              '              display_order: 0,',
              '            },',
              '          ]',
              '        : (rowsByTable[table] ?? []);',
              '',
            ].join('\n'),
          );

          const entityFile = 'tests/e2e/full-entity-details.spec.ts';
          let entityText = fs.readFileSync(entityFile, 'utf8');
          for (const slug of ['harbor-guard', 'puerto-de-demostracion']) {
            const oldValue = `/\\?entity=${slug}$/`;
            const newValue = `/\\?entity=${slug}&campaign=castigo-divino$/`;
            if (!entityText.includes(oldValue)) {
              throw new Error(`Missing expected full-entity URL pattern: ${slug}`);
            }
            entityText = entityText.split(oldValue).join(newValue);
          }
          fs.writeFileSync(entityFile, entityText);
          NODE
      - run: npx prettier --write src/main.ts tests/e2e/app.spec.ts tests/e2e/full-entity-details.spec.ts .github/workflows/map055-deeplink-contract-fix.yml
      - run: npm run format:check
      - run: npm test
      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts tests/e2e/app.spec.ts tests/e2e/full-entity-details.spec.ts .github/workflows/map055-deeplink-contract-fix.yml
          git commit -m 'MAP-055 align full entity navigation with campaigns'
          git push origin HEAD:agent/map-055-public-campaign-runtime
