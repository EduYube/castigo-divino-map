name: MAP-055 deep-link contract fix

on:
  push:
    branches:
      - agent/map-055-public-campaign-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-055-public-campaign-runtime
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch legacy deep-link fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              'tests/e2e/app.spec.ts',
              r"/\?entity=puerto-de-demostracion$/",
              r"/\?entity=puerto-de-demostracion&campaign=castigo-divino$/",
          )

          path = Path('tests/e2e/full-entity-details.spec.ts')
          text = path.read_text()
          old = "const LOCAL_SUPABASE_URL = 'http://127.0.0.1:4173';\n"
          new = old + "const CAMPAIGN_A_ID = '00000000-0000-4000-8000-000000000053';\n"
          if old not in text or 'const CAMPAIGN_A_ID' in text:
              raise SystemExit('Unexpected full-entity campaign constant state')
          text = text.replace(old, new, 1)
          old_rows = "    const table = match?.[1] ?? '';\n    const rows = rowsByTable[table] ?? [];\n"
          new_rows = """    const table = match?.[1] ?? '';
    const rows =
      table === 'campaigns'
        ? [
            {
              id: CAMPAIGN_A_ID,
              slug: 'castigo-divino',
              name: 'Castigo Divino',
              status: 'active',
              display_order: 0,
            },
          ]
        : (rowsByTable[table] ?? []);
"""
          if old_rows not in text:
              raise SystemExit('Expected full-entity remote rows block not found')
          text = text.replace(old_rows, new_rows, 1)
          for slug in ('harbor-guard', 'puerto-de-demostracion'):
              old_pattern = rf"/\?entity={slug}$/"
              new_pattern = rf"/\?entity={slug}&campaign=castigo-divino$/"
              if old_pattern not in text:
                  raise SystemExit(f'Expected full-entity URL pattern not found: {slug}')
              text = text.replace(old_pattern, new_pattern)
          path.write_text(text)
          PY
      - run: npx prettier --write tests/e2e/app.spec.ts tests/e2e/full-entity-details.spec.ts
      - run: npm run format:check
      - run: npm test
      - name: Commit validated patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/app.spec.ts tests/e2e/full-entity-details.spec.ts
          git commit -m 'MAP-055 align full entity E2E with campaign deep links'
          git push origin HEAD:agent/map-055-public-campaign-runtime
