name: MAP-018 close editor fix

on:
  push:
    branches:
      - agent/map-018-admin-taxonomy
    paths:
      - .github/workflows/map018-close-editor-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-018-admin-taxonomy
          fetch-depth: 0

      - name: Patch editor close visibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/adminCatalog.ts')
          text = path.read_text()
          old = """  function closeEditor(): void {
            editor.hidden = true;
            original = null;
            controls.clear();
            fields.replaceChildren();
            editorStatus.textContent = '';
            restoreFocus?.focus();
            restoreFocus = null;
          }
          """
          new = """  function closeEditor(): void {
            editor.hidden = true;
            list.hidden = false;
            if (state.visibleRecords.length === 0 && state.phase === 'ready') {
              empty.textContent = state.query ? 'No hay coincidencias.' : 'No hay registros de este tipo.';
              empty.hidden = false;
            } else {
              empty.hidden = true;
            }
            original = null;
            controls.clear();
            fields.replaceChildren();
            editorStatus.textContent = '';
            restoreFocus?.focus();
            restoreFocus = null;
          }
          """
          if old not in text:
              raise SystemExit('Expected closeEditor block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/map018-close-editor-fix.yml
          git add src/app/adminCatalog.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore admin list after editor closes"
          git push origin HEAD:agent/map-018-admin-taxonomy
