name: MAP-063 temporary concurrency fixture validation

on:
  push:
    branches:
      - agent/map-063-public-player-notes

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/map-063-public-player-notes
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch concurrency fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-map063-public-note-concurrency.mjs')
          source = path.read_text()
          replacements = {
              "const ENTITY_ID = 'place-demo-harbor';": "const ENTITY_ID = 'entity-aster-guide';",
              "const PLAYER_ID = 'player-skade';": "const PLAYER_ID = 'player-demo-one';",
          }
          for before, after in replacements.items():
              if source.count(before) != 1:
                  raise SystemExit(f'expected exactly one fixture constant: {before}')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
          npx prettier --check scripts/test-map063-public-note-concurrency.mjs
      - run: npx supabase start
      - name: Run focused MAP-063 concurrency regression
        run: |
          npm run supabase:db:reset
          node scripts/test-map063-public-note-concurrency.mjs
      - if: always()
        run: npx supabase stop --no-backup
      - name: Commit validated fixture and remove diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+EduYube@users.noreply.github.com"
          git add scripts/test-map063-public-note-concurrency.mjs
          git rm .github/workflows/agent-map063-concurrency-fixture-fix.yml
          git rm .github/workflows/agent-map063-lock-diagnostic-fast.yml
          git commit -m "test(db): cover MAP-063 concurrent eligibility revocations"
          git push origin HEAD:agent/map-063-public-player-notes
